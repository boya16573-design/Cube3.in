<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cube3 — creator & brand collaborations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F6F8FC;--card:#fff;--ink:#0F172A;--muted:#64748B;--faint:#94A3B8;--line:#E7EBF3;
--blue:#2563EB;--blued:#1D4ED8;--blues:#EFF4FF;--green:#10B981;--greens:#ECFDF5;
--amber:#F59E0B;--ambers:#FFFBEB;--purple:#7C3AED;--purples:#F5F3FF;--red:#EF4444;--reds:#FEF2F2;
--r:12px;--sh:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em}h2{font-size:18px;font-weight:700}h3{font-size:15px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:13px}.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--blue);color:#fff;
border:0;border-radius:9px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--blued)}.btn:disabled{opacity:.5}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.g:hover{background:var(--bg)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:8px}.btn.blk{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
font-size:16px;font-family:inherit;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blues)}
textarea{min-height:100px;resize:vertical}
.chip{display:inline-block;background:var(--blues);color:var(--blue);font-size:12px;font-weight:600;padding:4px 10px;border-radius:7px;margin:2px 4px 2px 0}
.chip.g{background:var(--greens);color:var(--green)}.chip.a{background:var(--ambers);color:var(--amber)}
.chip.r{background:var(--reds);color:var(--red)}.chip.p{background:var(--purples);color:var(--purple)}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--blue);color:#fff;
display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 auto}
.state{padding:34px 20px;text-align:center;color:var(--muted)}
.state b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}
.bad{background:var(--reds);border:1px solid #FECACA;border-radius:var(--r);padding:16px;text-align:left}
.bad b{color:var(--red);display:block;margin-bottom:5px}
.bad code{display:block;font-family:ui-monospace,monospace;font-size:12.5px;word-break:break-word}
.ok{background:var(--greens);border:1px solid #A7F3D0;border-radius:9px;padding:11px 14px;font-size:14px;color:#065F46;margin-top:14px}
.sk{height:64px;background:linear-gradient(90deg,#EEF2F8,#F7F9FC,#EEF2F8);background-size:200% 100%;
animation:sh 1.3s infinite;border-radius:10px;margin-bottom:12px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.auth{min-height:100vh;display:grid;place-items:center;padding:22px}
.auth .box{width:100%;max-width:410px}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:24px;letter-spacing:-.02em}
.logo .m{width:34px;height:34px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:15px}
.logo b{color:var(--blue)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.pick button{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:10px;padding:14px;text-align:center;font-weight:600;font-size:14px}
.pick button[aria-pressed="true"]{border-color:var(--blue);background:var(--blues);color:var(--blue)}
.shell{display:flex;min-height:100vh}
aside{width:248px;flex:0 0 248px;background:var(--card);border-right:1px solid var(--line);padding:20px 14px;
position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:60;transition:transform .22s}
aside .logo{justify-content:flex-start;font-size:20px;padding:0 8px 20px}
.side a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;color:var(--muted);font-weight:500;font-size:14.5px;margin-bottom:2px}
.side a:hover{background:var(--bg);color:var(--ink)}
.side a.on{background:var(--blue);color:#fff;font-weight:600}
.side a .ic{width:19px;text-align:center}
main{flex:1;margin-left:248px;min-width:0}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;font-size:17px;cursor:pointer}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}
.content{padding:22px;max-width:1150px}
.scrim{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:55}
@media(max-width:900px){aside{transform:translateX(-100%)}body.nav aside{transform:none}
body.nav .scrim{display:block}main{margin-left:0}.burger{display:block}.content{padding:16px}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--sh);display:flex;justify-content:space-between;gap:10px}
.stat .lb{font-size:13.5px;color:var(--muted);font-weight:500}
.stat .vl{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:5px}
.stat .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:18px}
.cols{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:start}
@media(max-width:980px){.cols{grid-template-columns:1fr}}
.hd{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.hd a{color:var(--blue);font-size:13.5px;font-weight:600}
.row{display:flex;gap:13px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}.row:hover{background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:14px}
.chat{display:grid;grid-template-columns:285px 1fr;gap:16px;height:calc(100vh - 132px)}
.pane{display:flex;flex-direction:column;overflow:hidden;min-height:0}
#thr{overflow-y:auto;flex:1}
#msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:9px;background:var(--bg)}
.bub{max-width:76%;padding:10px 14px;border-radius:14px;font-size:14.5px;word-break:break-word;box-shadow:var(--sh)}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.bub.th{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px}
.bub .ts{display:block;font-size:11px;opacity:.65;margin-top:4px}
.comp{display:flex;gap:9px;padding:13px;border-top:1px solid var(--line);align-items:center;background:var(--card)}
.thr{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:11px;align-items:center}
.thr.on{background:var(--blues)}
.back{display:none}
@media(max-width:820px){.chat{grid-template-columns:1fr;height:auto}.pane.cv{display:none}
body.open .pane.cv{display:flex;height:calc(100vh - 150px)}body.open .pane.ls{display:none}.back{display:inline-flex}}
</style>
</head>
<body>
<div class="scrim" onclick="document.body.classList.remove('nav')"></div>
<div id="root"><div class="auth"><div class="box"><div class="sk"></div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>

<script>
/* ===========================================================
   STEP 1 — paste your two Supabase values below.
   Find them in your old config.js file, or in Supabase under
   Project Settings → API.  Both are safe to publish; your RLS
   policies are what protect the data.
   =========================================================== */
var SUPABASE_URL = "https://zjgtceurzsvjkspkvroz.supabase.co";
var SUPABASE_KEY = "sb_publishable_q9x-cmieOqpj3_rw3AGcEA_K-uynMSm";
</script>

<script>
(function(){
"use strict";
var R=document.getElementById("root");

if(/PASTE_YOUR/.test(SUPABASE_URL)||/PASTE_YOUR/.test(SUPABASE_KEY)){
  R.innerHTML='<div class="auth"><div class="box"><div class="bad"><b>Setup needed</b><code>'+
    'Open index.html, scroll to the bottom, and replace SUPABASE_URL and SUPABASE_KEY '+
    'with the two values from your old config.js.</code></div></div></div>';
  return;
}

var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var me=null,BUCKET="message-attachments",chan=null,active=null,pend=null;

function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(m){
return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m];});}
function ini(n){return String(n||"?").trim().split(/\s+/).slice(0,2).map(function(w){return w[0];}).join("").toUpperCase()||"?";}
function ago(t){if(!t)return"";var m=Math.round((Date.now()-new Date(t))/60000);
if(m<1)return"just now";if(m<60)return m+"m ago";if(m<1440)return Math.round(m/60)+"h ago";return Math.round(m/1440)+"d ago";}
function inr(n){return n==null||n===""?"—":"₹"+Number(n).toLocaleString("en-IN");}
function fsz(b){if(b==null)return"";if(b<1024)return b+" B";if(b<1048576)return Math.round(b/1024)+" KB";return (b/1048576).toFixed(1)+" MB";}
function el(i){return document.getElementById(i);}
function go(h){location.hash=h;}
var LOGO='<div class="logo"><span class="m">C3</span>Cube<b>3</b></div>';

async function Q(label,builder){
  var r=await Promise.race([builder,new Promise(function(_,j){
    setTimeout(function(){j(new Error(label+": server didn't respond in 15s"));},15000);})]);
  if(r&&r.error){var e=r.error,m=label+": "+(e.message||"failed");
    if(e.code)m+=" ["+e.code+"]";
    if(e.code==="42P01")m+=" — that table doesn't exist";
    if(e.code==="42501")m+=" — blocked by a security policy";
    throw new Error(m);}
  return r?r.data:null;
}
function boom(e,t){console.error(e);
  (t||el("view")||R).innerHTML='<div class="bad"><b>Something went wrong</b><code>'+esc(e.message)+
  '</code><button class="btn sm" style="margin-top:12px" onclick="location.reload()">Reload</button></div>';}
function none(b,d,h,l){return '<div class="state"><b>'+esc(b)+'</b>'+esc(d||"")+
(h?'<div style="margin-top:14px"><a class="btn sm" href="'+esc(h)+'">'+esc(l)+'</a></div>':"")+'</div>';}

/* ================= AUTH ================= */
function authShell(inner){R.innerHTML='<div class="auth"><div class="box">'+LOGO+
  '<div class="card pad" style="margin-top:16px">'+inner+'</div></div></div>';}

function login(){
  authShell('<h1 style="font-size:21px">Sign in</h1><p class="muted small" style="margin-top:4px">Welcome back.</p>'+
    '<label>Email</label><input id="e" type="email" autocomplete="email">'+
    '<label>Password</label><input id="p" type="password" autocomplete="current-password">'+
    '<button class="btn blk" id="b" style="margin-top:18px">Sign in</button><div id="m"></div>'+
    '<p class="small muted" style="margin-top:16px;text-align:center"><a href="#forgot" style="color:var(--blue);font-weight:600">Forgot password?</a></p>'+
    '<p class="small muted" style="margin-top:8px;text-align:center">No account? <a href="#signup" style="color:var(--blue);font-weight:600">Sign up</a></p>');
  el("b").onclick=async function(){
    var b=el("b");b.disabled=true;b.textContent="Signing in…";
    var r=await sb.auth.signInWithPassword({email:el("e").value.trim(),password:el("p").value});
    if(r.error){el("m").innerHTML='<div class="bad" style="margin-top:14px"><code>'+esc(r.error.message)+'</code></div>';
      b.disabled=false;b.textContent="Sign in";return;}
    me=null;go("#dashboard");route();
  };
  el("p").onkeydown=function(ev){if(ev.key==="Enter")el("b").click();};
}

function signup(){
  var role="creator";
  authShell('<h1 style="font-size:21px">Create your account</h1>'+
    '<label>I am a…</label><div class="pick"><button id="rc" aria-pressed="true">Creator</button>'+
    '<button id="rb" aria-pressed="false">Brand</button></div>'+
    '<label>Full name</label><input id="n" autocomplete="name">'+
    '<label>Email</label><input id="e" type="email" autocomplete="email">'+
    '<label>Password</label><input id="p" type="password" autocomplete="new-password">'+
    '<p class="small muted" style="margin-top:6px">At least 6 characters.</p>'+
    '<button class="btn blk" id="b" style="margin-top:18px">Create account</button><div id="m"></div>'+
    '<p class="small muted" style="margin-top:16px;text-align:center">Already have one? <a href="#login" style="color:var(--blue);font-weight:600">Sign in</a></p>');
  el("rc").onclick=function(){role="creator";el("rc").setAttribute("aria-pressed","true");el("rb").setAttribute("aria-pressed","false");};
  el("rb").onclick=function(){role="brand";el("rb").setAttribute("aria-pressed","true");el("rc").setAttribute("aria-pressed","false");};
  el("b").onclick=async function(){
    var b=el("b"),name=el("n").value.trim();
    if(!name)return void(el("m").innerHTML='<div class="bad" style="margin-top:14px"><code>Please enter your name.</code></div>');
    b.disabled=true;b.textContent="Creating…";
    var r=await sb.auth.signUp({email:el("e").value.trim(),password:el("p").value,
      options:{data:{full_name:name,role:role}}});
    if(r.error){el("m").innerHTML='<div class="bad" style="margin-top:14px"><code>'+esc(r.error.message)+'</code></div>';
      b.disabled=false;b.textContent="Create account";return;}
    if(r.data.session&&r.data.user){
      await sb.from("profiles").upsert({id:r.data.user.id,full_name:name,role:role});
      if(role==="creator")await sb.from("creator_profiles").upsert({id:r.data.user.id});
      me=null;go("#dashboard");route();
    }else{
      el("m").innerHTML='<div class="ok">Check your email to confirm your account, then sign in.</div>';
    }
  };
}

function forgot(){
  authShell('<h1 style="font-size:21px">Reset password</h1>'+
    '<p class="muted small" style="margin-top:4px">We\'ll email you a link.</p>'+
    '<label>Email</label><input id="e" type="email">'+
    '<button class="btn blk" id="b" style="margin-top:18px">Send reset link</button><div id="m"></div>'+
    '<p class="small muted" style="margin-top:16px;text-align:center"><a href="#login" style="color:var(--blue);font-weight:600">Back to sign in</a></p>');
  el("b").onclick=async function(){
    var b=el("b");b.disabled=true;b.textContent="Sending…";
    var r=await sb.auth.resetPasswordForEmail(el("e").value.trim(),{redirectTo:location.origin+"/#reset"});
    el("m").innerHTML=r.error?'<div class="bad" style="margin-top:14px"><code>'+esc(r.error.message)+'</code></div>'
      :'<div class="ok">Sent. Check your inbox.</div>';
    b.disabled=false;b.textContent="Send reset link";
  };
}

function reset(){
  authShell('<h1 style="font-size:21px">New password</h1>'+
    '<label>Password</label><input id="p" type="password" autocomplete="new-password">'+
    '<button class="btn blk" id="b" style="margin-top:18px">Update password</button><div id="m"></div>');
  el("b").onclick=async function(){
    var b=el("b");b.disabled=true;b.textContent="Updating…";
    var r=await sb.auth.updateUser({password:el("p").value});
    if(r.error){el("m").innerHTML='<div class="bad" style="margin-top:14px"><code>'+esc(r.error.message)+'</code></div>';
      b.disabled=false;b.textContent="Update password";return;}
    el("m").innerHTML='<div class="ok">Done. Taking you in…</div>';
    setTimeout(function(){me=null;go("#dashboard");route();},900);
  };
}

/* ================= SHELL ================= */
var NAV=[["dashboard","◧","Dashboard"],["campaigns","◈","Campaigns"],["applications","✎","Applications"],
["creators","◕","Creators"],["messages","✉","Messages"],["profile","◑","Profile"]];
var TITLES={dashboard:"Dashboard",campaigns:"Campaigns",applications:"Applications",creators:"Creators",
messages:"Messages",profile:"Profile",creator:"Creators","new-campaign":"New campaign"};

function shell(on){
  R.innerHTML='<div class="shell"><aside>'+LOGO+'<nav class="side">'+
    NAV.map(function(n){return '<a href="#'+n[0]+'" class="'+(n[0]===on?"on":"")+'"><span class="ic">'+
      n[1]+'</span>'+n[2]+'</a>';}).join("")+
    '<a href="#" id="out" style="margin-top:14px"><span class="ic">⏻</span>Sign out</a></nav></aside>'+
    '<main><div class="top"><button class="burger" id="bg">☰</button><strong id="ttl">Dashboard</strong>'+
    '<div class="who"><div style="text-align:right"><div style="font-weight:600;font-size:14px;line-height:1.2">'+
    esc(me.name)+'</div><div style="font-size:12px;color:var(--faint)">'+(me.role==="brand"?"Brand":"Creator")+
    '</div></div>'+(me.av?'<img class="av" src="'+esc(me.av)+'" alt="">':'<div class="av">'+esc(ini(me.name))+'</div>')+
    '</div></div><div class="content" id="view"><div class="sk"></div><div class="sk"></div></div></main></div>';
  el("bg").onclick=function(){document.body.classList.toggle("nav");};
  el("out").onclick=async function(e){e.preventDefault();await sb.auth.signOut();me=null;go("#login");route();};
}

async function boot(){
  var a=await sb.auth.getUser();
  if(!a.data||!a.data.user)return false;
  var u=a.data.user;
  var p=await Q("Loading your profile",
    sb.from("profiles").select("id,role,full_name,avatar_url,bio").eq("id",u.id).maybeSingle());
  if(!p){
    var md=u.user_metadata||{};
    await Q("Creating your profile",sb.from("profiles").insert({
      id:u.id,full_name:md.full_name||u.email.split("@")[0],role:md.role||"creator"}));
    p=await Q("Loading your profile",
      sb.from("profiles").select("id,role,full_name,avatar_url,bio").eq("id",u.id).maybeSingle());
  }
  me={id:p.id,role:p.role,name:p.full_name||"Cube3 user",av:p.avatar_url,bio:p.bio};
  return true;
}

/* ================= VIEWS ================= */
async function dashboard(){
  var V=el("view"),brand=me.role==="brand";
  V.innerHTML='<h1>Welcome back, '+esc(me.name.split(" ")[0])+'</h1><p class="muted" style="margin:4px 0 20px">'+
    (brand?"Find creators and track your campaigns.":"Discover campaigns and grow your work.")+
    '</p><div class="stats" id="st"></div><div class="cols"><div class="card" id="l"></div><div class="card" id="r"></div></div>';
  var tone={blue:["var(--blues)","var(--blue)"],purple:["var(--purples)","var(--purple)"],
    amber:["var(--ambers)","var(--amber)"],green:["var(--greens)","var(--green)"]};
  function stats(rows){el("st").innerHTML=rows.map(function(x){var c=tone[x[3]];
    return '<div class="stat"><div><div class="lb">'+esc(x[0])+'</div><div class="vl">'+esc(x[1])+
    '</div></div><div class="ic" style="background:'+c[0]+';color:'+c[1]+'">'+x[2]+'</div></div>';}).join("");}
  function list(id,t,h,rows,eb,ed){el(id).innerHTML='<div class="hd"><h2>'+esc(t)+'</h2><a href="'+h+'">View all</a></div>'+
    (rows.length?rows.map(function(r){return '<div class="row"><div class="av">'+esc(ini(r.t))+'</div>'+
    '<div class="grow"><h3 class="trunc">'+esc(r.t)+'</h3><div class="small muted trunc">'+esc(r.s)+'</div></div>'+
    (r.c?'<span class="chip '+(r.c==="accepted"||r.c==="open"?"g":r.c==="pending"?"a":"")+'">'+esc(r.c)+'</span>':"")+
    '</div>';}).join(""):none(eb,ed));}

  if(brand){
    var cs=await Q("Loading your campaigns",sb.from("campaigns")
      .select("id,title,budget,status,created_at").eq("brand_id",me.id))||[];
    var ids=cs.map(function(c){return c.id;});
    var ap=ids.length?(await Q("Counting pitches",sb.from("campaign_applications")
      .select("id,status").in("campaign_id",ids))||[]):[];
    stats([["Your campaigns",cs.length,"◈","blue"],["Pitches received",ap.length,"✎","purple"],
      ["Awaiting review",ap.filter(function(a){return a.status==="pending";}).length,"◷","amber"],
      ["Selected",ap.filter(function(a){return a.status==="accepted";}).length,"✓","green"]]);
    list("l","Your campaigns","#campaigns",cs.slice(0,5).map(function(c){
      return {t:c.title,s:inr(c.budget)+" · "+ago(c.created_at),c:c.status};}),
      "No campaigns yet","Post one to start receiving pitches.");
  }else{
    var open=await Q("Counting open campaigns",
      sb.from("campaigns").select("id",{count:"exact",head:true}).eq("status","open"));
    var mine=await Q("Loading your applications",sb.from("campaign_applications")

async function fillAtt(id,m){
  var e=el(id);if(!e)return;

  if(!url)return void(e.textContent="Attachment unavailable");
  var t=m.attachment_type;
  if(t==="image")e.innerHTML='<a href="'+esc(url)+'" target="_blank" rel="noopener"><img src="'+esc(url)+'" alt="" style="max-width:210px;border-radius:9px;display:block"></a>';
  else if(t==="video")e.innerHTML='<video src="'+esc(url)+'" controls preload="metadata" style="max-width:210px;border-radius:9px;display:block"></video>';
  else if(t==="audio")e.innerHTML='<audio src="'+esc(url)+'" controls style="max-width:210px"></audio>';
  else e.innerHTML='<a href="'+esc(url)+'" target="_blank" rel="noopener" download="'+esc(m.attachment_name||"file")+
    '" style="text-decoration:underline">↓ '+esc(m.attachment_name||"Download")+'</a> <span style="opacity:.7">'+esc(fsz(m.attachment_size))+'</span>';

  var b=el("sd");b.disabled=true;b.textContent="…";
  try{
    var row={sender_id:me.id,body:body||null};row[fkey(active.k)]=active.id;
    if(pend){
      var ext=(pend.name.split(".").pop()||"").toLowerCase();
      if(BLOCKED.indexOf(ext)>-1)throw new Error("."+ext+" files can't be shared here. Zip it first.");
      if(pend.size>50*1024*1024)throw new Error("That file is "+fsz(pend.size)+". Limit is 50 MB.");
      var kind=pend.type.indexOf("image/")===0?"image":pend.type.indexOf("video/")===0?"video"
        :pend.type.indexOf("audio/")===0?"audio":"file";
      var path=active.id+"/"+(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2))+(ext?"."+ext:"");
      var up=await sb.storage.from(BUCKET).upload(path,pend,{contentType:pend.type||"application/octet-stream"});
      if(up.error){
        if(/bucket/i.test(up.error.message))throw new Error('Storage bucket "'+BUCKET+
          '" does not exist. Create it in Supabase → Storage and keep it private.');
        throw new Error("Upload failed: "+up.error.message);}
      row.attachment_path=path;row.attachment_type=kind;
      row.attachment_name=pend.name.slice(0,200);row.attachment_size=pend.size;
    }
    await Q("Sending",sb.from(tbl(active.k)).insert(row));
    tx.value="";pend=null;el("f").value="";el("pb").innerHTML="";
    await paint();
  }catch(e){alert(e.message);}
  finally{b.disabled=false;b.textContent="Send";}
}

document.addEventListener("click",async function(e){
  var m=e.target.closest("[data-msg]");
  if(m){
    var lbl=m.textContent;m.disabled=true;m.textContent="Opening…";
    try{
      var f=await Q("Checking for an existing conversation",sb.from("creator_inquiries")
        .select("id").eq("brand_id",me.id).eq("creator_id",m.dataset.msg).maybeSingle());
      if(!f)await Q("Starting the conversation",sb.from("creator_inquiries")
        .insert({brand_id:me.id,creator_id:m.dataset.msg}).select("id").single());
      go("#messages");
    }catch(x){alert(x.message);m.disabled=false;m.textContent=lbl;}
    return;
  }
  var ap=e.target.closest("[data-apply]");
  if(ap){
    var pitch=prompt('Your pitch for "'+ap.dataset.title+'" — why are you a fit?');
    if(pitch==null)return;
    ap.disabled=true;ap.textContent="Sending…";
    try{
      await Q("Sending your pitch",sb.from("campaign_applications").insert({
        campaign_id:ap.dataset.apply,creator_id:me.id,pitch:pitch.trim()||null,status:"pending"}));
      route();
    }catch(x){alert(x.message);ap.disabled=false;ap.textContent="Apply";}
    return;
  }
  var acc=e.target.closest("[data-accept]");
  if(acc){
    acc.disabled=true;acc.textContent="…";
    try{await Q("Selecting creator",sb.from("campaign_applications")
      .update({status:"accepted"}).eq("id",acc.dataset.accept));route();}
    catch(x){alert(x.message);acc.disabled=false;acc.textContent="Select";}
  }
});

async function route(){
  var h=(location.hash||"").slice(1),base=h.split("/")[0];
  document.body.classList.remove("nav","open");
  if(chan){sb.removeChannel(chan);chan=null;}
  var AUTH={login:login,signup:signup,forgot:forgot,reset:reset};
  try{
    if(!me){
      var ok=await boot();
      if(!ok){(AUTH[base]||login)();return;}
    }
    if(base==="reset"){reset();return;}
    if(AUTH[base]){base="dashboard";location.hash="#dashboard";}
    if(!base)base="dashboard";
    shell(base==="creator"?"creators":(base==="new-campaign"?"campaigns":base));
    el("ttl").textContent=TITLES[base]||"Dashboard";
    if(base==="creator")await creatorPage(h.slice(8));
    else if(base==="campaigns")await campaignsView();
    else if(base==="new-campaign")newCampaign();
    else if(base==="applications")await applications();
    else if(base==="creators")await creators();
    else if(base==="messages")await messages();
    else if(base==="profile")await profileView();
    else await dashboard();
  }catch(e){boom(e);}
}
window.addEventListener("hashchange",route);
sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT")me=null;});
route();
})();
</script>
