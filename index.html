<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cube3 — creator & brand collaborations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F6F8FC;--card:#fff;--ink:#0F172A;--muted:#64748B;--faint:#94A3B8;--line:#E7EBF3;
--blue:#2563EB;--blued:#1D4ED8;--blues:#EFF4FF;--green:#10B981;--greens:#ECFDF5;
--amber:#F59E0B;--ambers:#FFFBEB;--purple:#7C3AED;--purples:#F5F3FF;--red:#EF4444;--reds:#FEF2F2;
--r:12px;--sh:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em}h2{font-size:18px;font-weight:700}h3{font-size:15px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:13px}.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1;min-width:0}.row2{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--blue);color:#fff;
border:0;border-radius:9px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--blued)}.btn:disabled{opacity:.5}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.g:hover{background:var(--bg)}
.btn.d{background:var(--reds);color:var(--red);border:1px solid #FECACA}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}.btn.blk{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
font-size:16px;font-family:inherit;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blues)}
textarea{min-height:100px;resize:vertical}
.chip{display:inline-block;background:var(--blues);color:var(--blue);font-size:12px;font-weight:600;padding:4px 10px;border-radius:7px;margin:2px 4px 2px 0}
.chip.g{background:var(--greens);color:var(--green)}.chip.a{background:var(--ambers);color:var(--amber)}
.chip.r{background:var(--reds);color:var(--red)}.chip.p{background:var(--purples);color:var(--purple)}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--blue);color:#fff;
display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 auto}
.state{padding:34px 20px;text-align:center;color:var(--muted)}
.state b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}
.bad{background:var(--reds);border:1px solid #FECACA;border-radius:var(--r);padding:16px;text-align:left}
.bad b{color:var(--red);display:block;margin-bottom:5px}
.bad code{display:block;font-family:ui-monospace,monospace;font-size:12.5px;word-break:break-word}
.ok{background:var(--greens);border:1px solid #A7F3D0;border-radius:9px;padding:11px 14px;font-size:14px;color:#065F46;margin-top:14px}
.warn{background:var(--ambers);border:1px solid #FDE68A;border-radius:9px;padding:11px 14px;font-size:14px;color:#8A5D05;margin-top:14px}
.sk{height:64px;background:linear-gradient(90deg,#EEF2F8,#F7F9FC,#EEF2F8);background-size:200% 100%;
animation:sh 1.3s infinite;border-radius:10px;margin-bottom:12px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.auth{min-height:100vh;display:grid;place-items:center;padding:22px}
.auth .box{width:100%;max-width:410px}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:24px;letter-spacing:-.02em}
.logo .m{width:34px;height:34px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:15px}
.logo b{color:var(--blue)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.pick button{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:10px;padding:14px;text-align:center;font-weight:600;font-size:14px}
.pick button[aria-pressed="true"]{border-color:var(--blue);background:var(--blues);color:var(--blue)}
.shell{display:flex;min-height:100vh}
aside{width:248px;flex:0 0 248px;background:var(--card);border-right:1px solid var(--line);padding:20px 14px;
position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:60;transition:transform .22s}
aside .logo{justify-content:flex-start;font-size:20px;padding:0 8px 20px}
.side a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;color:var(--muted);font-weight:500;font-size:14.5px;margin-bottom:2px}
.side a:hover{background:var(--bg);color:var(--ink)}
.side a.on{background:var(--blue);color:#fff;font-weight:600}
.side a .ic{width:19px;text-align:center}
.side a .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px}
.side a.on .badge{background:rgba(255,255,255,.3)}
.side .sep{margin:14px 8px 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
main{flex:1;margin-left:248px;min-width:0}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;font-size:17px;cursor:pointer}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}
.content{padding:22px;max-width:1150px}
.scrim{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:55}
@media(max-width:900px){aside{transform:translateX(-100%)}body.nav aside{transform:none}
body.nav .scrim{display:block}main{margin-left:0}.burger{display:block}.content{padding:16px}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--sh);display:flex;justify-content:space-between;gap:10px}
.stat .lb{font-size:13.5px;color:var(--muted);font-weight:500}
.stat .vl{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:5px}
.stat .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:18px}
.cols{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:start}
@media(max-width:980px){.cols{grid-template-columns:1fr}}
.hd{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.hd a{color:var(--blue);font-size:13.5px;font-weight:600}
.row{display:flex;gap:13px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}.row:hover{background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:14px}
.cover{width:100%;height:160px;object-fit:cover;border-radius:var(--r) var(--r) 0 0;display:block;background:var(--blues)}
.chat{display:grid;grid-template-columns:285px 1fr;gap:16px;height:calc(100vh - 132px)}
.pane{display:flex;flex-direction:column;overflow:hidden;min-height:0}
#thr{overflow-y:auto;flex:1}
#msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:9px;background:var(--bg)}
.bub{max-width:76%;padding:10px 14px;border-radius:14px;font-size:14.5px;word-break:break-word;box-shadow:var(--sh)}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.bub.th{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px}
.bub .ts{display:block;font-size:11px;opacity:.65;margin-top:4px}
.comp{display:flex;gap:9px;padding:13px;border-top:1px solid var(--line);align-items:center;background:var(--card)}
.thr{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:11px;align-items:center}
.thr.on{background:var(--blues)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:0 0 auto}
.back{display:none}
@media(max-width:820px){.chat{grid-template-columns:1fr;height:auto}.pane.cv{display:none}
body.open .pane.cv{display:flex;height:calc(100vh - 150px)}body.open .pane.ls{display:none}.back{display:inline-flex}}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;z-index:200;padding:18px}
.modal .in{background:var(--card);border-radius:var(--r);max-width:460px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:grid;place-items:center;z-index:300;padding:16px}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:110%;background:var(--card);border:1px solid var(--line);
border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.15);min-width:170px;z-index:120;overflow:hidden}
.menu .pop button{all:unset;display:block;width:100%;padding:11px 14px;font-size:14px;cursor:pointer;box-sizing:border-box}
.menu .pop button:hover{background:var(--bg)}
.menu .pop button.dg{color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;
color:var(--muted);border:1px solid var(--line);background:var(--card)}
.tabs button[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.doc{max-width:760px}
.doc h2{margin:26px 0 8px}
.doc p{margin-bottom:12px;color:#334155}
.doc ul{margin:0 0 14px 20px;color:#334155}
.doc li{margin-bottom:6px}
.doc .upd{font-size:13px;color:var(--faint);font-family:ui-monospace,monospace}
</style>
</head>

<script>

var SUPABASE_URL = "https://zjgtceurzsvjkspkvroz.supabase.co";
var SUPABASE_KEY = "sb_publishable_q9x-cmieOqpj3_rw3AGcEA_K-uynMSm";

/* Business details shown in Terms & Privacy. Fill these in. */

<script>
(function(){
"use strict";
var R=document.getElementById("root"),LAYER=document.getElementById("layer");

if(/PASTE_YOUR/.test(SUPABASE_URL)||/PASTE_YOUR/.test(SUPABASE_KEY)){
  R.innerHTML='<div class="auth"><div class="box"><div class="bad"><b>Setup needed</b><code>'+
    'Open index.html and replace SUPABASE_URL and SUPABASE_KEY with your two Supabase values.'+
    '</code></div></div></div>';return;}

var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var me=null,ATT="message-attachments",AVA="avatars",CIMG="campaign-images";
var chan=null,active=null,pend=null,blocked={},blockedBy={},unread=0;

/* One fixed list, used by profiles, campaigns and both filters.
   Free text was the bug: "Beauty", "beauty" and "Content Creator" never match. */
var CATEGORIES=["Beauty & Skincare","Fashion & Styling","Food & Cooking","Fitness & Health",
"Tech & Gadgets","Gaming","Travel","Lifestyle & Vlogs","Comedy & Entertainment","Education & Learning",
"Finance & Business","Parenting & Family","Home & Interiors","Automotive","Music & Dance",
"Art & Craft","Sports","Pets & Animals","Books & Writing","Other"];

function catSelect(id,value,blankLabel){
  return '<select id="'+id+'"><option value="">'+(blankLabel||"Select a category")+'</option>'+
    CATEGORIES.map(function(c){return '<option value="'+esc(c)+'"'+
      (c===value?" selected":"")+'>'+esc(c)+'</option>';}).join("")+'</select>';
}

function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(m){
return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m];});}
function ini(n){return String(n||"?").trim().split(/\s+/).slice(0,2).map(function(w){return w[0];}).join("").toUpperCase()||"?";}
function ago(t){if(!t)return"";var m=Math.round((Date.now()-new Date(t))/60000);
if(m<1)return"just now";if(m<60)return m+"m ago";if(m<1440)return Math.round(m/60)+"h ago";return Math.round(m/1440)+"d ago";}
function inr(n){return n==null||n===""?"—":"₹"+Number(n).toLocaleString("en-IN");}
function fsz(b){if(b==null)return"";if(b<1024)return b+" B";if(b<1048576)return Math.round(b/1024)+" KB";return (b/1048576).toFixed(1)+" MB";}
function el(i){return document.getElementById(i);}
function go(h){location.hash=h;}
var LOGO='<div class="logo"><span class="m">C3</span>Cube<b>3</b></div>';
function avatarOf(url,name,size){var s=size||38;
  return url?'<img class="av" style="width:'+s+'px;height:'+s+'px" src="'+esc(url)+'" alt="">'
    :'<div class="av" style="width:'+s+'px;height:'+s+'px;font-size:'+Math.round(s/2.7)+'px">'+esc(ini(name))+'</div>';}

async function Q(label,builder){
  var r=await Promise.race([builder,new Promise(function(_,j){
    setTimeout(function(){j(new Error(label+": server didn't respond in 15s"));},15000);})]);
  if(r&&r.error){var e=r.error,m=label+": "+(e.message||"failed");
    if(e.code)m+=" ["+e.code+"]";
    if(e.code==="42P01")m+=" — that table doesn't exist. Run features.sql in Supabase.";
    if(e.code==="42703")m+=" — that column doesn't exist. Run hardening.sql / safeguards.sql.";
    if(e.code==="42501")m+=" — blocked by a security policy";
    throw new Error(m);}
  return r?r.data:null;}
function boom(e,t){console.error(e);
  (t||el("view")||R).innerHTML='<div class="bad"><b>Something went wrong</b><code>'+esc(e.message)+
  '</code><button class="btn sm" style="margin-top:12px" onclick="location.reload()">Reload</button></div>';}
function none(b,d,h,l){return '<div class="state"><b>'+esc(b)+'</b>'+esc(d||"")+
(h?'<div style="margin-top:14px"><a class="btn sm" href="'+esc(h)+'">'+esc(l)+'</a></div>':"")+'</div>';}
function modal(html){LAYER.innerHTML='<div class="modal" id="mdl"><div class="in">'+html+'</div></div>';
  el("mdl").onclick=function(e){if(e.target.id==="mdl")closeModal();};}
function closeModal(){LAYER.innerHTML="";}
window.closeModal=closeModal;
function lightbox(url){LAYER.innerHTML='<div class="lightbox" id="lb"><img src="'+esc(url)+'" alt=""></div>';
  el("lb").onclick=closeModal;}

async function uploadImage(bucket,file,prefix){
  if(!file.type||file.type.indexOf("image/")!==0) throw new Error("Please choose an image file.");
  if(file.size>5*1024*1024) throw new Error("Image is "+fsz(file.size)+". Keep it under 5 MB.");
  var ext=(file.name.split(".").pop()||"jpg").toLowerCase();
  var path=prefix+"/"+(crypto.randomUUID?crypto.randomUUID():Date.now())+"."+ext;
  var up=await sb.storage.from(bucket).upload(path,file,{contentType:file.type,upsert:true});
  if(up.error){
    if(/bucket/i.test(up.error.message))
      throw new Error('Bucket "'+bucket+'" does not exist. Create it in Supabase → Storage (Public).');
    throw new Error(up.error.message);}
  return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;}

/* ================= AUTH ================= */
function authShell(inner){R.innerHTML='<div class="auth"><div class="box">'+LOGO+
  '<div class="card pad" style="margin-top:16px">'+inner+'</div>'+
  '<p class="small muted" style="text-align:center;margin-top:14px">'+
  '<a href="#terms">Terms</a> · <a href="#privacy">Privacy</a></p></div></div>';}

function login(){
  authShell('<h1 style="font-size:21px">Sign in</h1><p class="muted small" style="margin-top:4px">Welcome back.</p>'+
    '<label>Email</label><input id="e" type="email" autocomplete="email">'+
    '<label>Password</label><input id="p" type="password" autocomplete="current-password">'+
    '<button class="btn blk" id="b" style="margin-top:18px">Sign in</button><div id="m"></div>'+
    '<p class="small muted" style="margin-top:16px;text-align:center"><a href="#forgot" style="color:var(--blue);font-weight:600">Forgot password?</a></p>'+
    '<p class="small muted" style="margin-top:8px;text-align:center">No account? <a href="#signup" style="color:var(--blue);font-weight:600">Sign up</a></p>');
  el("b").onclick=async function(){
    var b=el("b");b.disabled=true;b.textContent="Signing in…";
    var r=await sb.auth.signInWithPassword({email:el("e").value.trim(),password:el("p").value});
    if(r.error){el("m").innerHTML='<div class="bad" style="margin-top:14px"><code>'+esc(r.error.message)+'</code></div>';
      b.disabled=false;b.textContent="Sign in";return;}
    me=null;go("#dashboard");route();};
  el("p").onkeydown=function(ev){if(ev.key==="Enter")el("b").click();};}

function signup(){
  var role="creator";
  authShell('<h1 style="font-size:21px">Create your account</h1>'+
    '<label>I am a…</label><div class="pick"><button id="rc" aria-pressed="true">Creator</button>'+
    '<button id="rb" aria-pressed="false">Brand</button></div>'+
    '<label>Full name</label><input id="n" autocomplete="name">'+
    '<label>Email</label><input id="e" type="email" autocomplete="email">'+
    '<label>Password</label><input id="p" type="password" autocomplete="new-password">'+
    '<p class="small muted" style="margin-top:6px">At least 6 characters.</p>'+
    '<button class="btn blk" id="b" style="margin-top:18px">Create account</button><div id="m"></div>'+
    '<p class="small muted" style="margin-top:12px;text-align:center">By signing up you agree to the '+
    '<a href="#terms" style="color:var(--blue)">Terms</a> and <a href="#privacy" style="color:var(--blue)">Privacy Policy</a>.</p>'+
    '<p class="small muted" style="margin-top:10px;text-align:center">Already have one? <a href="#login" style="color:var(--blue);font-weight:600">Sign in</a></p>');
  el("rc").onclick=function(){role="creator";el("rc").setAttribute("aria-pressed","true");el("rb").setAttribute("aria-pressed","false");};
  el("rb").onclick=function(){role="brand";el("rb").setAttribute("aria-pressed","true");el("rc").setAttribute("aria-pressed","false");};
  el("b").onclick=async function(){
    var b=el("b"),name=el("n").value.trim();
    if(!name)return void(el("m").innerHTML='<div class="bad" style="margin-top:14px"><code>Please enter your name.</code></div>');
    b.disabled=true;b.textContent="Creating…";
    var r=await sb.auth.signUp({email:el("e").value.trim(),password:el("p").value,
      options:{data:{full_name:name,role:role}}});
    if(r.error){el("m").innerHTML='<div class="bad" style="margin-top:14px"><code>'+esc(r.error.message)+'</code></div>';
      b.disabled=false;b.textContent="Create account";return;}
    if(r.data.session&&r.data.user){
      await sb.from("profiles").upsert({id:r.data.user.id,full_name:name,role:role});
      if(role==="creator")await sb.from("creator_profiles").upsert({id:r.data.user.id});
      me=null;go("#dashboard");route();
    }else el("m").innerHTML='<div class="ok">Check your email to confirm your account, then sign in.</div>';};}

function forgot(){
  authShell('<h1 style="font-size:21px">Reset password</h1>'+
    '<p class="muted small" style="margin-top:4px">We\'ll email you a link.</p>'+
    '<label>Email</label><input id="e" type="email">'+
    '<button class="btn blk" id="b" style="margin-top:18px">Send reset link</button><div id="m"></div>'+
    '<p class="small muted" style="margin-top:16px;text-align:center"><a href="#login" style="color:var(--blue);font-weight:600">Back to sign in</a></p>');
  el("b").onclick=async function(){
    var b=el("b");b.disabled=true;b.textContent="Sending…";
    var r=await sb.auth.resetPasswordForEmail(el("e").value.trim(),{redirectTo:location.origin+"/#reset"});
    el("m").innerHTML=r.error?'<div class="bad" style="margin-top:14px"><code>'+esc(r.error.message)+'</code></div>'
      :'<div class="ok">Sent. Check your inbox.</div>';
    b.disabled=false;b.textContent="Send reset link";};}

function reset(){
  authShell('<h1 style="font-size:21px">New password</h1>'+
    '<label>Password</label><input id="p" type="password" autocomplete="new-password">'+
    '<button class="btn blk" id="b" style="margin-top:18px">Update password</button><div id="m"></div>');
  el("b").onclick=async function(){
    var b=el("b");b.disabled=true;b.textContent="Updating…";

async function boot(){

      admin:!!p.is_admin,suspended:!!p.suspended,suspendReason:p.suspended_reason};

  return true;}

function toggleBlock(userId,name,isB){
  modal('<h2>'+(isB?"Unblock":"Block")+' '+esc(name||"this user")+'?</h2>'+
    '<p class="muted small" style="margin-top:6px">'+
    (isB?"They will appear in listings and can message you again."
      :"You won't see each other in listings, campaigns, or messages. They aren't told.")+'</p>'+
    '<div class="row2" style="margin-top:18px;justify-content:flex-end">'+
    '<button class="btn g" onclick="closeModal()">Cancel</button>'+
    '<button class="btn '+(isB?"":"d")+'" id="bg2">'+(isB?"Unblock":"Block")+'</button></div><div id="bm"></div>');
  el("bg2").onclick=async function(){
    var b=el("bg2");b.disabled=true;b.textContent="…";
    try{
      if(isB){await Q("Unblocking",sb.from("user_blocks").delete()
        .eq("blocker_id",me.id).eq("blocked_id",userId));delete blocked[userId];}
      else{await Q("Blocking",sb.from("user_blocks").insert({blocker_id:me.id,blocked_id:userId}));
        blocked[userId]=true;}
      closeModal();route();
    }catch(e){el("bm").innerHTML='<div class="bad" style="margin-top:12px"><code>'+esc(e.message)+'</code></div>';
      b.disabled=false;b.textContent=isB?"Unblock":"Block";}};}

      '<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">'+
      '<div class="row2">'+avatarOf(who.avatar_url,who.full_name)+
      '<div><h2 style="font-size:16px">'+esc(who.full_name||"Unknown user")+
      (who.suspended?' <span class="chip r">suspended</span>':"")+'</h2>'+
      '<div class="small muted">'+esc(who.role||"")+' · reported by '+esc(by.full_name||"someone")+'</div></div></div>'+
      '<div class="row2">'+(n>1?'<span class="chip r">'+n+' reports</span>':"")+
      '<span class="chip '+(TONE[r.status]||"")+'">'+esc(r.status)+'</span></div></div>'+
      '<div style="margin-top:10px"><span class="chip">'+esc(r.reason)+'</span>'+
      (r.context?'<span class="chip">'+esc(r.context)+'</span>':"")+'</div>'+
      (r.details?'<p class="small muted" style="margin-top:10px;padding-left:11px;border-left:3px solid var(--line);white-space:pre-wrap">'+
        esc(r.details)+'</p>':'<p class="small muted" style="margin-top:10px">No details given.</p>')+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px;'+
      'padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap">'+
      '<span class="small muted">'+esc(ago(r.created_at))+'</span><span class="row2">'+
      '<a class="btn sm g" href="#creator/'+esc(r.reported_id)+'">Profile</a>'+
      (who.suspended
        ? '<button class="btn sm g" data-unsuspend="'+esc(r.reported_id)+'">Lift suspension</button>'
        : '<button class="btn sm d" data-suspend="'+esc(r.reported_id)+'" data-name="'+esc(who.full_name||"")+'">Suspend</button>')+
      (r.status!=="reviewing"?'<button class="btn sm g" data-rep="'+esc(r.id)+'" data-to="reviewing">Reviewing</button>':"")+
      (r.status!=="resolved"?'<button class="btn sm" data-rep="'+esc(r.id)+'" data-to="resolved">Resolve</button>':"")+
      (r.status!=="dismissed"?'<button class="btn sm g" data-rep="'+esc(r.id)+'" data-to="dismissed">Dismiss</button>':"")+
      '</span></div></div>';}).join("");}

/* ================= MESSAGES ================= */
async function messages(){
  el("view").innerHTML='<h1 style="margin-bottom:14px">Messages</h1><div class="chat">'+
    '<div class="card pane ls"><div class="hd"><h2>Conversations</h2></div><div id="thr"><div class="sk" style="margin:12px"></div></div></div>'+
    '<div class="card pane cv"><div class="hd"><button class="btn sm g back" id="bk">← Back</button>'+
    '<h2 id="who" class="grow trunc">Select a conversation</h2><div class="menu" id="tm"></div></div>'+
    '<div id="msgs"><div class="state">Pick a conversation.</div></div>'+
    '<div id="pb"></div><div class="comp" id="cp" style="display:none"><input type="file" id="f" hidden>'+
    '<button class="btn sm g" id="clip">📎</button><input type="text" id="tx" placeholder="Type a message" maxlength="2000">'+
    '<button class="btn sm" id="sd">Send</button></div></div></div>';
  el("bk").onclick=function(){document.body.classList.remove("open");};
  el("clip").onclick=function(){el("f").click();};
  el("f").onchange=pickFile;el("sd").onclick=send;
  el("tx").onkeydown=function(e){if(e.key==="Enter")send();};
  var th=[],brand=me.role==="brand",col=brand?"brand_id":"creator_id",oth=brand?"creator_id":"brand_id";
  (await Q("Loading conversations",sb.from("creator_inquiries")
    .select("id,brand_id,creator_id").eq(col,me.id))||[]).forEach(function(i){
      if(!blocked[i[oth]]&&!blockedBy[i[oth]]) th.push({k:"inquiry",id:i.id,o:i[oth]});});
  if(brand){
    var cs=await Q("Loading campaigns",sb.from("campaigns").select("id,title").eq("brand_id",me.id))||[];
    if(cs.length){var t={};cs.forEach(function(c){t[c.id]=c.title;});
      (await Q("Loading accepted pitches",sb.from("campaign_applications")
        .select("id,campaign_id,creator_id").in("campaign_id",cs.map(function(c){return c.id;}))
        .eq("status","accepted"))||[]).forEach(function(a){
          if(!blocked[a.creator_id]&&!blockedBy[a.creator_id])
            th.push({k:"campaign",id:a.id,o:a.creator_id,n:t[a.campaign_id]});});}
  }else{
    var ap=await Q("Loading accepted pitches",sb.from("campaign_applications")
      .select("id,campaign_id").eq("creator_id",me.id).eq("status","accepted"))||[];
    if(ap.length){var ci={};
      (await Q("Loading campaigns",sb.from("campaigns").select("id,title,brand_id")
        .in("id",ap.map(function(a){return a.campaign_id;})))||[]).forEach(function(c){ci[c.id]=c;});
      ap.forEach(function(a){var c=ci[a.campaign_id];
        if(c&&!blocked[c.brand_id]&&!blockedBy[c.brand_id])
          th.push({k:"campaign",id:a.id,o:c.brand_id,n:c.title});});}}
  if(!th.length)return void(el("thr").innerHTML=none("No conversations yet",
    brand?"Message a creator to start one.":"A chat opens when a brand accepts your pitch."));
  var nm={};(await Q("Loading names",sb.from("profiles").select("id,full_name,avatar_url")
    .in("id",Array.from(new Set(th.map(function(t){return t.o;}).filter(Boolean)))))||[])
    .forEach(function(p){nm[p.id]=p;});
  unread=0;
  for(var i=0;i<th.length;i++){
    var t=th[i];
    try{
      var last=await Q("Checking messages",sb.from(tbl(t.k))
        .select("created_at,sender_id").eq(fkey(t.k),t.id)
        .order("created_at",{ascending:false}).limit(1));
      var m0=last&&last[0];
      t.fresh=!!(m0&&m0.sender_id!==me.id&&new Date(m0.created_at)>new Date(lastRead(t.k,t.id)));
      if(t.fresh)unread++;
    }catch(e){t.fresh=false;}}
  var link=document.querySelector('.side a[href="#messages"]');
  if(link){var bd=link.querySelector(".badge");
    if(unread){if(bd)bd.textContent=unread;else link.insertAdjacentHTML("beforeend",'<span class="badge">'+unread+'</span>');}
    else if(bd)bd.remove();}
  el("thr").innerHTML=th.map(function(t,i){var p=nm[t.o]||{};
    return '<div class="thr" data-i="'+i+'">'+avatarOf(p.avatar_url,p.full_name)+
    '<div class="grow"><h3 class="trunc">'+esc(p.full_name||"Cube3 user")+'</h3>'+
    '<div class="small muted trunc">'+esc(t.n||"Direct message")+'</div></div>'+
    (t.fresh?'<span class="dot"></span>':"")+'</div>';}).join("");
  el("thr").querySelectorAll(".thr").forEach(function(x){x.onclick=function(){
    el("thr").querySelectorAll(".thr").forEach(function(y){y.classList.remove("on");});
    x.classList.add("on");
    var d=x.querySelector(".dot");if(d)d.remove();
    var t=th[+x.dataset.i],p=nm[t.o]||{};
    openThread(t,p.full_name||"Cube3 user");};});}
function tbl(k){return k==="inquiry"?"inquiry_messages":"messages";}
function fkey(k){return k==="inquiry"?"inquiry_id":"application_id";}

async function openThread(t,name){
  active=t;document.body.classList.add("open");
  el("who").textContent=name;
  el("cp").style.display=me.suspended?"none":"flex";
  markRead(t.k,t.id);
  el("tm").innerHTML='<button class="btn g sm" id="tmo">⋯</button>';
  el("tmo").onclick=function(ev){
    ev.stopPropagation();
    var box=el("tm");
    if(box.querySelector(".pop"))return void(box.querySelector(".pop").remove());
    var pop=document.createElement("div");pop.className="pop";
    pop.innerHTML='<button id="vp">View profile</button><button id="rp2">Report</button>'+
      '<button class="dg" id="bl2">Block</button>';
    box.appendChild(pop);
    pop.querySelector("#vp").onclick=function(){pop.remove();go("#creator/"+t.o);};
    pop.querySelector("#rp2").onclick=function(){pop.remove();reportDialog(t.o,"message",name);};
    pop.querySelector("#bl2").onclick=function(){pop.remove();toggleBlock(t.o,name,false);};};
  try{await paint();
    if(chan)sb.removeChannel(chan);
    chan=sb.channel("t-"+t.id).on("postgres_changes",
      {event:"INSERT",schema:"public",table:tbl(t.k),filter:fkey(t.k)+"=eq."+t.id},
      function(){paint();markRead(t.k,t.id);}).subscribe();
  }catch(e){boom(e,el("msgs"));}}

async function paint(){
  var box=el("msgs");
  var rows=await Q("Loading messages",sb.from(tbl(active.k))
    .select("id,sender_id,body,attachment_path,attachment_url,attachment_type,attachment_name,attachment_size,created_at")
    .eq(fkey(active.k),active.id).order("created_at",{ascending:true}))||[];
  if(!rows.length)return void(box.innerHTML='<div class="state">No messages yet. Say hello.</div>');
  box.innerHTML=rows.map(function(m){
    var mine=m.sender_id===me.id,aid="at"+m.id;
    var att=(m.attachment_path||m.attachment_url)?'<div id="'+aid+'" class="small" style="margin-bottom:6px">Loading…</div>':"";
    if(att)setTimeout(function(){fillAtt(aid,m);},0);
    return '<div class="bub '+(mine?"me":"th")+'">'+att+(m.body?esc(m.body):"")+
    '<span class="ts">'+esc(ago(m.created_at))+'</span></div>';}).join("");
  box.scrollTop=box.scrollHeight;}

async function fillAtt(id,m){
  var e=el(id);if(!e)return;
  var url=m.attachment_url;
  if(!url&&m.attachment_path){var r=await sb.storage.from(ATT).createSignedUrl(m.attachment_path,3600);
    url=r.data?r.data.signedUrl:null;}
  if(!url)return void(e.textContent="Attachment unavailable");
  var t=m.attachment_type;
  if(t==="image")e.innerHTML='<img src="'+esc(url)+'" alt="" data-zoom="'+esc(url)+
    '" style="max-width:210px;border-radius:9px;display:block;cursor:zoom-in">';
  else if(t==="video")e.innerHTML='<video src="'+esc(url)+'" controls preload="metadata" style="max-width:210px;border-radius:9px;display:block"></video>';
  else if(t==="audio")e.innerHTML='<audio src="'+esc(url)+'" controls style="max-width:210px"></audio>';
  else e.innerHTML='<a href="'+esc(url)+'" target="_blank" rel="noopener" download="'+esc(m.attachment_name||"file")+
    '" style="text-decoration:underline">↓ '+esc(m.attachment_name||"Download")+'</a> <span style="opacity:.7">'+esc(fsz(m.attachment_size))+'</span>';}

function pickFile(e){
  pend=e.target.files[0]||null;
  el("pb").innerHTML=pend?'<div style="padding:9px 13px;font-size:13px;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px"><span>'+
    esc(pend.name)+' ('+esc(fsz(pend.size))+')</span><button class="btn g sm" id="rm">Remove</button></div>':"";
  var r=el("rm");if(r)r.onclick=function(){pend=null;el("f").value="";el("pb").innerHTML="";};}
var BLOCKED_EXT=["exe","msi","bat","cmd","com","scr","jar","js","html","htm","svg","php","sh","ps1","vbs","apk"];

async function send(){
  if(!active)return;
  var tx=el("tx"),body=tx.value.trim();
  if(!body&&!pend)return;
  var b=el("sd");b.disabled=true;b.textContent="…";
  try{
    var row={sender_id:me.id,body:body||null};row[fkey(active.k)]=active.id;
    if(pend){
      var ext=(pend.name.split(".").pop()||"").toLowerCase();
      if(BLOCKED_EXT.indexOf(ext)>-1)throw new Error("."+ext+" files can't be shared here. Zip it first.");
      if(pend.size>50*1024*1024)throw new Error("That file is "+fsz(pend.size)+". Limit is 50 MB.");
      var kind=pend.type.indexOf("image/")===0?"image":pend.type.indexOf("video/")===0?"video"
        :pend.type.indexOf("audio/")===0?"audio":"file";
      var path=active.id+"/"+(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2))+(ext?"."+ext:"");
      var up=await sb.storage.from(ATT).upload(path,pend,{contentType:pend.type||"application/octet-stream"});
      if(up.error){
        if(/bucket/i.test(up.error.message))throw new Error('Bucket "'+ATT+
          '" does not exist. Create it in Supabase → Storage (private).');
        throw new Error("Upload failed: "+up.error.message);}
      row.attachment_path=path;row.attachment_type=kind;
      row.attachment_name=pend.name.slice(0,200);row.attachment_size=pend.size;}
    await Q("Sending",sb.from(tbl(active.k)).insert(row));
    tx.value="";pend=null;el("f").value="";el("pb").innerHTML="";
    await paint();
  }catch(e){alert(e.message);}
  finally{b.disabled=false;b.textContent="Send";}}

/* ================= GLOBAL CLICKS ================= */
document.addEventListener("click",async function(e){
  document.querySelectorAll(".menu .pop").forEach(function(p){
    if(!p.parentNode.contains(e.target))p.remove();});
  var zoom=e.target.closest("[data-zoom]");
  if(zoom){lightbox(zoom.dataset.zoom);return;}
  var m=e.target.closest("[data-msg]");
  if(m){
    var lbl=m.textContent;m.disabled=true;m.textContent="Opening…";
    try{
      var f=await Q("Checking for an existing conversation",sb.from("creator_inquiries")
        .select("id").eq("brand_id",me.id).eq("creator_id",m.dataset.msg).maybeSingle());
      if(!f)await Q("Starting the conversation",sb.from("creator_inquiries")
        .insert({brand_id:me.id,creator_id:m.dataset.msg}).select("id").single());
      go("#messages");
    }catch(x){alert(x.message);m.disabled=false;m.textContent=lbl;}
    return;}
  var ap=e.target.closest("[data-apply]");
  if(ap){
    var cid=ap.dataset.apply,title=ap.dataset.title;
    modal('<h2>Apply to this campaign</h2><p class="muted small" style="margin-top:4px">'+esc(title)+'</p>'+
      '<label>Your pitch</label><textarea id="pt" placeholder="Why you\'re a fit, what you\'d make, your rate"></textarea>'+
      '<div class="row2" style="margin-top:16px;justify-content:flex-end">'+
      '<button class="btn g" onclick="closeModal()">Cancel</button>'+
      '<button class="btn" id="ps">Send pitch</button></div><div id="pm"></div>');
    el("ps").onclick=async function(){
      var t=el("pt").value.trim();
      if(!t)return void(el("pm").innerHTML='<div class="bad" style="margin-top:12px"><code>Write a short pitch first.</code></div>');
      var b=el("ps");b.disabled=true;b.textContent="Sending…";
      try{
        await Q("Sending your pitch",sb.from("campaign_applications").insert({
          campaign_id:cid,creator_id:me.id,pitch:t,status:"pending"}));
        closeModal();route();
      }catch(x){el("pm").innerHTML='<div class="bad" style="margin-top:12px"><code>'+esc(x.message)+'</code></div>';
        b.disabled=false;b.textContent="Send pitch";}};
    return;}
  var st=e.target.closest("[data-status]");
  if(st){
    st.disabled=true;var was=st.textContent;st.textContent="…";
    try{await Q("Updating pitch",sb.from("campaign_applications")
      .update({status:st.dataset.status}).eq("id",st.dataset.app));route();}
    catch(x){alert(x.message);st.disabled=false;st.textContent=was;}
    return;}
  var wd=e.target.closest("[data-withdraw]");
  if(wd){
    wd.disabled=true;wd.textContent="…";
    try{await Q("Withdrawing",sb.from("campaign_applications")
      .update({status:"withdrawn"}).eq("id",wd.dataset.withdraw));route();}
    catch(x){alert(x.message);wd.disabled=false;wd.textContent="Withdraw";}
    return;}
  var rep=e.target.closest("[data-rep]");
  if(rep){
    rep.disabled=true;var w2=rep.textContent;rep.textContent="…";
    try{await Q("Updating report",sb.from("reports")
      .update({status:rep.dataset.to}).eq("id",rep.dataset.rep));admin();}
    catch(x){alert(x.message);rep.disabled=false;rep.textContent=w2;}
    return;}
  var sp=e.target.closest("[data-suspend]");
  if(sp){suspendDialog(sp.dataset.suspend,sp.dataset.name);return;}
  var us=e.target.closest("[data-unsuspend]");
  if(us){
    us.disabled=true;us.textContent="…";
    try{await Q("Lifting suspension",sb.from("profiles").update({suspended:false,
      suspended_reason:null,suspended_at:null}).eq("id",us.dataset.unsuspend));admin();}
    catch(x){alert(x.message);us.disabled=false;us.textContent="Lift suspension";}
    return;}
  var ub=e.target.closest("[data-unblock]");
  if(ub){toggleBlock(ub.dataset.unblock,ub.dataset.name,true);return;}
});

/* ================= ROUTER ================= */
async function route(){
  var h=(location.hash||"").slice(1),base=h.split("/")[0];
  document.body.classList.remove("nav","open");
  closeModal();
  if(chan){sb.removeChannel(chan);chan=null;}
  var AUTH={login:login,signup:signup,forgot:forgot,reset:reset};
  try{
    if(!me){
      var ok=await boot();
      if(!ok){
        // Terms and Privacy must be readable before signing up.
        if(base==="terms"||base==="privacy"){
          R.innerHTML='<div class="content" style="margin:0 auto"><p style="margin-bottom:16px">'+
            '<a class="small muted" href="#login">← Back to sign in</a></p><div id="view"></div></div>';
          (base==="terms"?terms:privacy)();return;}
        (AUTH[base]||login)();return;}}
    if(base==="reset"){reset();return;}
    if(AUTH[base]){base="dashboard";location.hash="#dashboard";}
    if(!base)base="dashboard";
    shell(base==="creator"?"creators":(base==="new-campaign"||base==="edit-campaign"?"campaigns":base));
    el("ttl").textContent=TITLES[base]||"Dashboard";
    if(base==="creator")await creatorPage(h.slice(8));
    else if(base==="edit-campaign")await editCampaign(h.slice(14));
    else if(base==="campaigns")await campaignsView();
    else if(base==="new-campaign")campaignForm(null);
    else if(base==="applications")await applications();
    else if(base==="creators")await creators();
    else if(base==="messages")await messages();
    else if(base==="profile")await profileView();
    else if(base==="settings")await settings();
    else if(base==="admin")await admin();
    else if(base==="terms")terms();
    else if(base==="privacy")privacy();
    else await dashboard();
  }catch(e){boom(e);}}
window.addEventListener("hashchange",route);
sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT")me=null;});
route();
})();
</script>
