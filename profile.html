<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cube3 Profile</title><link rel="stylesheet" href="../style.css"></head><body><header class="top"><a href="../index.html">Cube3</a><a href="dashboard.html">Dashboard</a></header><main class="container"><section class="panel"><h1>My profile</h1><form id="profileForm"><input id="fullName" placeholder="Full name"><textarea id="bio" placeholder="Bio"></textarea><input id="avatarUrl" placeholder="Avatar URL"><button>Save</button></form><p id="message"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase-client.js"></script><script src="../js/auth.js"></script><script>const u=await Cube3Auth.requireUser();if(u){const {data}=await cube3Supabase.from("profiles").select("*").eq("id",u.id).single();if(data){fullName.value=data.full_name||"";bio.value=data.bio||"";avatarUrl.value=data.avatar_url||""}}profileForm.addEventListener("submit",async e=>{e.preventDefault();const {error}=await cube3Supabase.from("profiles").update({full_name:fullName.value,bio:bio.value,avatar_url:avatarUrl.value,updated_at:new Date().toISOString()}).eq("id",u.id);message.textContent=error?error.message:"Saved."})</script></body></html>
