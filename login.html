<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cube3 Login</title><link rel="stylesheet" href="../style.css"></head><body><main class="auth"><section class="panel"><h1>Welcome to Cube3</h1><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button></form><p id="message"></p><a href="signup.html">Create an account</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase-client.js"></script><script src="../js/auth.js"></script><script>loginForm.addEventListener("submit",async e=>{e.preventDefault();try{await Cube3Auth.signIn(email.value,password.value);location.href="dashboard.html"}catch(x){message.textContent=x.message}})</script></body></html>
