<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cube3 Campaigns</title><link rel="stylesheet" href="../style.css"></head><body><header class="top"><a href="../index.html">Cube3</a><a href="dashboard.html">Dashboard</a></header><main class="container"><h1>Campaigns</h1><section id="brandBox" class="panel" hidden><h2>Create campaign</h2><form id="campaignForm"><input id="title" placeholder="Title" required><textarea id="description" placeholder="Description"></textarea><input id="budget" type="number" placeholder="Budget"><input id="category" placeholder="Category"><input id="platform" placeholder="Platform"><input id="deadline" type="date"><button>Create campaign</button></form><p id="createMessage"></p></section><div id="campaignGrid" class="grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase-client.js"></script><script src="../js/auth.js"></script><script src="../js/api.js"></script><script>const u=await Cube3Auth.requireUser();if(u){const role=u.user_metadata?.role||"creator";if(role==="brand")brandBox.hidden=false;async function load(){try{const r=await Cube3API.apiFetch("/api/campaigns");campaignGrid.innerHTML=(r.campaigns||[]).map(c=>`<article class="card"><h3>${esc(c.title)}</h3><p>${esc(c.description||"")}</p><p>Budget: ₹${Number(c.budget||0).toLocaleString()}</p>${role==="creator"?`<button onclick="applyCampaign('${c.id}')">Apply</button>`:""}</article>`).join("")||"<p>No campaigns yet.</p>"}catch(e){campaignGrid.innerHTML=`<p class="error">${esc(e.message)}</p>`}}window.applyCampaign=async id=>{const pitch=prompt("Your pitch");if(!pitch)return;try{await Cube3API.apiFetch("/api/campaigns/"+id+"/apply",{method:"POST",body:JSON.stringify({pitch})});alert("Application sent")}catch(e){alert(e.message)}};campaignForm?.addEventListener("submit",async e=>{e.preventDefault();try{await Cube3API.apiFetch("/api/campaigns",{method:"POST",body:JSON.stringify({title:title.value,description:description.value,budget:budget.value,category:category.value,platform:platform.value,deadline:deadline.value})});createMessage.textContent="Campaign created.";campaignForm.reset();load()}catch(x){createMessage.textContent=x.message}});function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}load()}</script></body></html>
