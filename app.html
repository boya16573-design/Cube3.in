<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cube3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F6F8FC;--card:#fff;--ink:#0F172A;--muted:#64748B;--faint:#94A3B8;
  --line:#E7EBF3;--blue:#2563EB;--blue-dark:#1D4ED8;--blue-soft:#EFF4FF;
  --green:#10B981;--green-soft:#ECFDF5;--amber:#F59E0B;--amber-soft:#FFFBEB;
  --purple:#7C3AED;--purple-soft:#F5F3FF;--red:#EF4444;--red-soft:#FEF2F2;
  --r:12px;--shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
h3{font-size:15px;font-weight:600}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
aside{width:250px;flex:0 0 250px;background:var(--card);border-right:1px solid var(--line);
  padding:20px 14px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:60;transition:transform .22s}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand .m{width:30px;height:30px;border-radius:8px;background:var(--blue);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800}
.brand b{color:var(--blue)}
.side a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;
  color:var(--muted);font-weight:500;font-size:14.5px;margin-bottom:2px}
.side a:hover{background:var(--bg);color:var(--ink)}
.side a.on{background:var(--blue);color:#fff;font-weight:600}
.side a .ic{width:19px;text-align:center;font-size:15px}
.side a .pill{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;
  padding:2px 7px;border-radius:20px}
.side a.on .pill{background:rgba(255,255,255,.28)}

main{flex:1;margin-left:250px;min-width:0}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;
  width:38px;height:38px;font-size:17px;cursor:pointer}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}
.who .nm{font-weight:600;font-size:14px;line-height:1.2}
.who .rl{font-size:12px;color:var(--faint)}
.content{padding:22px}
.scrim{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:55}

@media(max-width:900px){
  aside{transform:translateX(-100%)}
  body.nav aside{transform:none}
  body.nav .scrim{display:block}
  main{margin-left:0}
  .burger{display:block}
  .content{padding:16px}
}

/* ---------- bits ---------- */
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--blue);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--blue);
  color:#fff;border:0;border-radius:9px;padding:10px 17px;font-weight:600;font-size:14px;
  cursor:pointer;font-family:inherit}
.btn:hover{background:var(--blue-dark)}
.btn:disabled{opacity:.5;cursor:default}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.g:hover{background:var(--bg)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
  font-size:16px;font-family:inherit;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.chip{display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:12px;
  font-weight:600;padding:4px 10px;border-radius:7px;margin:2px 4px 2px 0}
.chip.g{background:var(--green-soft);color:var(--green)}
.chip.a{background:var(--amber-soft);color:var(--amber)}
.chip.r{background:var(--red-soft);color:var(--red)}
.chip.p{background:var(--purple-soft);color:var(--purple)}
.muted{color:var(--muted)}
.small{font-size:13px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;
  box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.stat .lb{font-size:13.5px;color:var(--muted);font-weight:500}
.stat .vl{font-size:29px;font-weight:700;letter-spacing:-.02em;margin:5px 0 3px}
.stat .sb{font-size:12.5px;font-weight:600}
.stat .ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:18px}

.cols{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:start}
@media(max-width:980px){.cols{grid-template-columns:1fr}}
.hd{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.hd a{color:var(--blue);font-size:13.5px;font-weight:600}
.row{display:flex;gap:13px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.state{padding:36px 20px;text-align:center;color:var(--muted)}
.state b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}
.state.bad{text-align:left;background:var(--red-soft);border-radius:var(--r);border:1px solid #FECACA}
.state.bad b{color:var(--red)}
.state.bad code{display:block;font-family:ui-monospace,monospace;font-size:12.5px;margin-top:6px;word-break:break-word}
.sk{height:66px;background:linear-gradient(90deg,#EEF2F8,#F7F9FC,#EEF2F8);
  background-size:200% 100%;animation:sh 1.3s infinite;border-radius:10px;margin:10px 18px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* chat */
.chat{display:grid;grid-template-columns:290px 1fr;gap:16px;height:calc(100vh - 130px)}
.pane{display:flex;flex-direction:column;overflow:hidden;min-height:0}
#thr{overflow-y:auto;flex:1}
#msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:9px;background:var(--bg)}
.bub{max-width:76%;padding:10px 14px;border-radius:14px;font-size:14.5px;word-break:break-word;box-shadow:var(--shadow)}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.bub.th{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px}
.bub .ts{display:block;font-size:11px;opacity:.65;margin-top:4px}
.comp{display:flex;gap:9px;padding:13px;border-top:1px solid var(--line);align-items:center;background:var(--card)}
.thr{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:11px;align-items:center}
.thr.on{background:var(--blue-soft)}
.back{display:none}
@media(max-width:820px){
  .chat{grid-template-columns:1fr;height:auto}
  .pane.cv{display:none}
  body.open .pane.cv{display:flex;height:calc(100vh - 150px)}
  body.open .pane.ls{display:none}
  .back{display:inline-flex}
}
</style>
</head>
<body>

<div class="scrim" onclick="document.body.classList.remove('nav')"></div>

<div class="shell">
  <aside>
    <div class="brand"><span class="m">C3</span>Cube<b>3</b></div>
    <nav class="side" id="side"></nav>
  </aside>

  <main>
    <div class="top">
      <button class="burger" onclick="document.body.classList.toggle('nav')">☰</button>
      <strong id="ttl">Dashboard</strong>
      <div class="who">
        <div style="text-align:right">
          <div class="nm" id="unm">…</div>
          <div class="rl" id="url">…</div>
        </div>
        <div class="av" id="uav">?</div>
      </div>
    </div>
    <div class="content" id="view"><div class="sk"></div><div class="sk"></div></div>
  </main>
</div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
(function(){
"use strict";

var sb = supabase.createClient(CUBE3_CONFIG.SUPABASE_URL, CUBE3_CONFIG.SUPABASE_PUBLISHABLE_KEY);
var V = document.getElementById("view");
var me = null, BUCKET = "message-attachments";

/* ---------- utils ---------- */
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m];});}
function ini(n){return String(n||"?").trim().split(/\s+/).slice(0,2)
  .map(function(w){return w[0];}).join("").toUpperCase()||"?";}
function ago(t){if(!t)return"";var m=Math.round((Date.now()-new Date(t))/60000);
  if(m<1)return"just now";if(m<60)return m+"m ago";if(m<1440)return Math.round(m/60)+"h ago";
  return Math.round(m/1440)+"d ago";}
function inr(n){return n==null||n===""?"—":"₹"+Number(n).toLocaleString("en-IN");}
function fsize(b){if(b==null)return"";if(b<1024)return b+" B";
  if(b<1048576)return Math.round(b/1024)+" KB";return (b/1048576).toFixed(1)+" MB";}
function el(id){return document.getElementById(id);}

// Named queries: any failure tells you which step broke, and nothing hangs.
async function Q(label, builder){
  var r = await Promise.race([builder, new Promise(function(_,rej){
    setTimeout(function(){rej(new Error(label+": server didn't respond in 15s"));},15000);})]);
  if(r && r.error){
    var e=r.error, m=label+": "+(e.message||"failed");
    if(e.code) m+=" ["+e.code+"]";
    if(e.code==="42P01") m+=" — that table doesn't exist";
    if(e.code==="42501") m+=" — blocked by a security policy";
    throw new Error(m);
  }
  return r?r.data:null;
}
function boom(e){
  console.error(e);
  V.innerHTML='<div class="state bad"><b>Something went wrong</b><code>'+esc(e.message)+
    '</code><button class="btn sm" style="margin-top:12px" onclick="location.reload()">Reload</button></div>';
}
function none(b,d,href,lbl){
  return '<div class="state"><b>'+esc(b)+'</b>'+esc(d||"")+
    (href?'<div style="margin-top:14px"><a class="btn sm" href="'+esc(href)+'">'+esc(lbl)+'</a></div>':"")+'</div>';
}

/* ---------- nav ---------- */
var NAV=[
  {h:"dashboard",  i:"◧", t:"Dashboard"},
  {h:"campaigns",  i:"◈", t:"Campaigns"},
  {h:"applications",i:"✎", t:"Applications"},
  {h:"creators",   i:"◕", t:"Creators"},
  {h:"messages",   i:"✉", t:"Messages"},
  {h:"profile",    i:"◑", t:"Profile", url:"/pages/profile.html"}
];
function paintNav(active){
  el("side").innerHTML = NAV.map(function(n){
    return '<a href="'+(n.url||("#"+n.h))+'" class="'+(n.h===active?"on":"")+'">'+
      '<span class="ic">'+n.i+'</span>'+n.t+'</a>';
  }).join("") + '<a href="#" id="out" style="margin-top:14px"><span class="ic">⏻</span>Sign out</a>';
  el("out").onclick=async function(e){e.preventDefault();await sb.auth.signOut();location.href="/pages/login.html";};
}

/* ---------- session ---------- */
async function boot(){
  var a = await sb.auth.getUser();
  if(!a.data||!a.data.user){location.href="/pages/login.html";return false;}
  var p = await Q("Loading your profile",
    sb.from("profiles").select("id,role,full_name,avatar_url,bio").eq("id",a.data.user.id).maybeSingle());
  if(!p) throw new Error("Your account has no profile row yet. Open Profile and save it once.");
  me={id:p.id,role:p.role,name:p.full_name||"Cube3 user",av:p.avatar_url};
  el("unm").textContent=me.name;
  el("url").textContent=me.role==="brand"?"Brand":"Creator";
  el("uav").outerHTML = me.av
    ? '<img class="av" id="uav" src="'+esc(me.av)+'" alt="">'
    : '<div class="av" id="uav">'+esc(ini(me.name))+'</div>';
  return true;
}

/* ---------- dashboard ---------- */
async function dashboard(){
  var brand = me.role==="brand";
  V.innerHTML='<h1>Welcome back, '+esc(me.name.split(" ")[0])+'</h1>'+
    '<p class="muted" style="margin:4px 0 20px">'+
    (brand?"Find creators and track your campaigns.":"Discover campaigns and grow your work.")+'</p>'+
    '<div class="stats" id="st"></div><div class="cols">'+
    '<div class="card" id="left"></div><div class="card" id="right"></div></div>';

  var open = await Q("Counting open campaigns",
    sb.from("campaigns").select("id",{count:"exact",head:true}).eq("status","open"));

  var mine, msgs;
  if(brand){
    mine = await Q("Loading your campaigns", sb.from("campaigns").select("id,title,budget,status,created_at").eq("brand_id",me.id));
    var ids=(mine||[]).map(function(c){return c.id;});
    var pitches = ids.length? await Q("Counting pitches",
      sb.from("campaign_applications").select("id,status,creator_id,campaign_id,created_at").in("campaign_id",ids)) : [];
    stats([
      ["Your campaigns",(mine||[]).length,"◈","blue"],
      ["Pitches received",(pitches||[]).length,"✎","purple"],
      ["Awaiting review",(pitches||[]).filter(function(p){return p.status==="pending";}).length,"◷","amber"],
      ["Selected",(pitches||[]).filter(function(p){return p.status==="accepted";}).length,"✓","green"]
    ]);
    listCard("left","Your campaigns","#campaigns",(mine||[]).slice(0,5).map(function(c){
      return {t:c.title,s:inr(c.budget)+" · "+ago(c.created_at),c:c.status};}),
      "No campaigns yet","Post one to start receiving pitches.");
  }else{
    mine = await Q("Loading your applications",
      sb.from("campaign_applications").select("id,status,campaign_id,created_at").eq("creator_id",me.id));
    var st={pending:0,accepted:0};
    (mine||[]).forEach(function(a){if(st[a.status]!=null)st[a.status]++;});
    stats([
      ["Open campaigns",open==null?"—":open,"◈","blue"],
      ["My applications",(mine||[]).length,"✎","purple"],
      ["Awaiting reply",st.pending,"◷","amber"],
      ["Selected",st.accepted,"✓","green"]
    ]);
    var recent = await Q("Loading campaigns",
      sb.from("campaigns").select("id,title,budget,category,created_at").eq("status","open")
        .order("created_at",{ascending:false}).limit(5));
    listCard("left","Recommended for you","#campaigns",(recent||[]).map(function(c){
      return {t:c.title,s:inr(c.budget)+(c.category?" · "+c.category:""),c:"open"};}),
      "No open campaigns","Check back soon.");
  }

  // recent messages
  var col = brand?"brand_id":"creator_id", oth = brand?"creator_id":"brand_id";
  var inq = await Q("Loading conversations",
    sb.from("creator_inquiries").select("id,brand_id,creator_id,created_at").eq(col,me.id).limit(5)) || [];
  var names={};
  if(inq.length){
    var pp = await Q("Loading names",
      sb.from("profiles").select("id,full_name").in("id",inq.map(function(i){return i[oth];}))) || [];
    pp.forEach(function(p){names[p.id]=p.full_name;});
  }
  listCard("right","Recent messages","#messages", inq.map(function(i){
    return {t:names[i[oth]]||"Cube3 user",s:"Started "+ago(i.created_at)};}),
    "No messages yet", brand?"Message a creator to begin.":"Brands will reach out here.");

  function stats(rows){
    var tone={blue:["var(--blue-soft)","var(--blue)"],purple:["var(--purple-soft)","var(--purple)"],
      amber:["var(--amber-soft)","var(--amber)"],green:["var(--green-soft)","var(--green)"]};
    el("st").innerHTML=rows.map(function(r){
      var c=tone[r[3]];
      return '<div class="stat"><div><div class="lb">'+esc(r[0])+'</div><div class="vl">'+esc(r[1])+'</div></div>'+
        '<div class="ico" style="background:'+c[0]+';color:'+c[1]+'">'+r[2]+'</div></div>';}).join("");
  }
  function listCard(id,title,href,rows,eb,ed){
    el(id).innerHTML='<div class="hd"><h2>'+esc(title)+'</h2><a href="'+href+'">View all</a></div>'+
      (rows.length? rows.map(function(r){
        return '<div class="row"><div class="av">'+esc(ini(r.t))+'</div><div class="grow">'+
          '<h3 class="trunc">'+esc(r.t)+'</h3><div class="small muted trunc">'+esc(r.s)+'</div></div>'+
          (r.c?'<span class="chip '+(r.c==="accepted"||r.c==="open"?"g":r.c==="pending"?"a":"")+'">'+esc(r.c)+'</span>':"")+
          '</div>';}).join("") : none(eb,ed));
  }
}

/* ---------- campaigns ---------- */
async function campaigns(){
  var brand=me.role==="brand";
  V.innerHTML='<h1>Campaigns</h1><p class="muted" style="margin:4px 0 18px">'+
    (brand?"Campaigns you've posted.":"Open campaigns taking pitches.")+'</p><div id="l"></div>';
  var rows = brand
    ? await Q("Loading your campaigns", sb.from("campaigns")
        .select("id,title,description,budget,category,status,created_at").eq("brand_id",me.id)
        .order("created_at",{ascending:false}))
    : await Q("Loading campaigns", sb.from("campaigns")
        .select("id,title,description,budget,category,status,created_at,brand_id").eq("status","open")
        .order("created_at",{ascending:false}));
  rows=rows||[];
  if(!rows.length){el("l").innerHTML='<div class="card">'+none(brand?"No campaigns yet":"No open campaigns",
    brand?"Post one from the campaigns page.":"Check back soon.","/pages/campaigns.html","Open campaigns page")+'</div>';return;}
  el("l").innerHTML=rows.map(function(c){
    return '<div class="card pad" style="margin-bottom:12px">'+
      '<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">'+
      '<div><h2>'+esc(c.title)+'</h2><div class="small muted">'+esc(c.category||"")+'</div></div>'+
      '<span class="chip '+(c.status==="open"?"g":"")+'">'+esc(c.status||"")+'</span></div>'+
      (c.description?'<p class="muted small" style="margin-top:9px">'+esc(String(c.description).slice(0,190))+'</p>':"")+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)">'+
      '<strong>'+esc(inr(c.budget))+'</strong>'+
      '<a class="btn sm g" href="/pages/campaigns.html">Open</a></div></div>';}).join("");
}

/* ---------- applications ---------- */
async function applications(){
  var brand=me.role==="brand";
  V.innerHTML='<h1>'+(brand?"Pitches received":"My applications")+'</h1><div id="l" style="margin-top:18px"></div>';
  var L={pending:"a",shortlisted:"p",accepted:"g",rejected:"r",withdrawn:"r"};

  if(brand){
    var cs = await Q("Loading your campaigns", sb.from("campaigns").select("id,title").eq("brand_id",me.id))||[];
    if(!cs.length){el("l").innerHTML='<div class="card">'+none("No campaigns yet","Post one and pitches land here.")+'</div>';return;}
    var t={};cs.forEach(function(c){t[c.id]=c.title;});
    var ap = await Q("Loading pitches", sb.from("campaign_applications")
      .select("id,campaign_id,creator_id,pitch,status,created_at")
      .in("campaign_id",cs.map(function(c){return c.id;})).order("created_at",{ascending:false}))||[];
    if(!ap.length){el("l").innerHTML='<div class="card">'+none("No pitches yet","Creators haven't applied yet.")+'</div>';return;}
    var nm={};
    var pp = await Q("Loading creators", sb.from("profiles").select("id,full_name")
      .in("id",Array.from(new Set(ap.map(function(a){return a.creator_id;})))))||[];
    pp.forEach(function(p){nm[p.id]=p.full_name;});
    el("l").innerHTML=ap.map(function(a){return item(nm[a.creator_id]||"Creator",t[a.campaign_id],a,
      '<a class="btn sm g" href="#creator/'+esc(a.creator_id)+'">View profile</a>');}).join("");
  }else{
    var mine = await Q("Loading your applications", sb.from("campaign_applications")
      .select("id,campaign_id,pitch,status,created_at").eq("creator_id",me.id)
      .order("created_at",{ascending:false}))||[];
    if(!mine.length){el("l").innerHTML='<div class="card">'+none("No applications yet",
      "Pitch for a campaign and it shows up here.","#campaigns","Browse campaigns")+'</div>';return;}
    var ti={};
    var cl = await Q("Loading campaigns", sb.from("campaigns").select("id,title")
      .in("id",Array.from(new Set(mine.map(function(a){return a.campaign_id;})))))||[];
    cl.forEach(function(c){ti[c.id]=c.title;});
    el("l").innerHTML=mine.map(function(a){return item(ti[a.campaign_id]||"Campaign unavailable","",a,
      a.status==="accepted"?'<a class="btn sm" href="#messages">Open chat</a>':"");}).join("");
  }

  function item(title,sub,a,act){
    return '<div class="card pad" style="margin-bottom:12px">'+
      '<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">'+
      '<div><h2 style="font-size:16px">'+esc(title)+'</h2>'+
      (sub?'<div class="small muted">'+esc(sub)+'</div>':"")+'</div>'+
      '<span class="chip '+(L[a.status]||"")+'">'+esc(a.status)+'</span></div>'+
      (a.pitch?'<p class="small muted" style="margin-top:10px;padding-left:11px;border-left:3px solid var(--line);white-space:pre-wrap">'+
        esc(a.pitch)+'</p>':"")+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)">'+
      '<span class="small muted">'+esc(ago(a.created_at))+'</span>'+act+'</div></div>';
  }
}

/* ---------- creators ---------- */
async function creators(){
  V.innerHTML='<h1>Creators</h1><p class="muted" style="margin:4px 0 16px">Search the directory.</p>'+
    '<input id="s" placeholder="Search name, handle or bio" style="max-width:420px;margin-bottom:16px">'+
    '<div class="small muted" id="ct" style="margin-bottom:10px"></div><div id="g"></div>';

  var rows = await Q("Loading creators", sb.from("creator_profiles")
    .select("id,handle,category,location"))||[];
  if(!rows.length){el("g").innerHTML='<div class="card">'+none("No creators yet","Profiles appear once people sign up.")+'</div>';return;}
  var pp = await Q("Loading names", sb.from("profiles").select("id,full_name,bio,avatar_url")
    .in("id",rows.map(function(r){return r.id;})))||[];
  var by={};pp.forEach(function(p){by[p.id]=p;});
  var all=rows.map(function(r){var p=by[r.id]||{};
    return Object.assign({},r,{name:p.full_name||"Unnamed creator",bio:p.bio||"",av:p.avatar_url||""});});

  function draw(){
    var t=(el("s").value||"").toLowerCase().trim();
    var list=all.filter(function(c){return !t||(c.name+" "+(c.handle||"")+" "+c.bio).toLowerCase().indexOf(t)>-1;});
    el("ct").textContent=list.length+(list.length===1?" creator":" creators");
    el("g").innerHTML=list.length? '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:14px">'+
      list.map(function(c){
        return '<div class="card pad">'+
          '<div style="display:flex;gap:11px;align-items:center;margin-bottom:10px">'+
          (c.av?'<img class="av" src="'+esc(c.av)+'" alt="">':'<div class="av">'+esc(ini(c.name))+'</div>')+
          '<div style="min-width:0"><h3 class="trunc">'+esc(c.name)+'</h3>'+
          '<div class="small muted trunc">'+(c.handle?"@"+esc(String(c.handle).replace(/^@/,"")):"")+
          (c.location?" · "+esc(c.location):"")+'</div></div></div>'+
          (c.bio?'<p class="small muted" style="margin-bottom:9px">'+esc(String(c.bio).slice(0,110))+'</p>':"")+
          (c.category?'<span class="chip">'+esc(c.category)+'</span>':"")+
          '<div style="display:flex;gap:8px;margin-top:13px">'+
          '<a class="btn sm g" style="flex:1" href="#creator/'+esc(c.id)+'">Profile</a>'+
          (me.role==="brand"?'<button class="btn sm" style="flex:1" data-msg="'+esc(c.id)+'">Message</button>':"")+
          '</div></div>';}).join("")+'</div>'
      : '<div class="card">'+none("No matches","Try a different search.")+'</div>';
  }
  el("s").addEventListener("input",draw);
  draw();
}

/* ---------- one creator ---------- */
async function creator(id){
  V.innerHTML='<div class="sk"></div>';
  var p = await Q("Loading profile", sb.from("profiles")
    .select("id,full_name,bio,avatar_url,role").eq("id",id).maybeSingle());
  if(!p){V.innerHTML='<a class="small muted" href="#creators">← All creators</a><div class="card" style="margin-top:14px">'+
    none("Profile not found","This account may have been deleted.")+'</div>';return;}
  var c = await Q("Loading creator details", sb.from("creator_profiles").select("*").eq("id",id).maybeSingle())||{};
  var links=[["instagram_url","Instagram"],["youtube_url","YouTube"],["x_url","X"],["tiktok_url","TikTok"],
    ["facebook_url","Facebook"],["linkedin_url","LinkedIn"],["threads_url","Threads"],
    ["snapchat_url","Snapchat"],["portfolio_url","Portfolio"]]
    .filter(function(l){return c[l[0]];})
    .map(function(l){return '<a class="chip" href="'+esc(c[l[0]])+'" target="_blank" rel="noopener nofollow">'+l[1]+'</a>';}).join("");
  var can = me.role==="brand" && p.role==="creator" && me.id!==id;

  V.innerHTML='<a class="small muted" href="#creators">← All creators</a>'+
    '<div class="card pad" style="margin-top:14px">'+
    '<div style="display:flex;gap:15px;align-items:center;flex-wrap:wrap">'+
    (p.avatar_url?'<img class="av" style="width:74px;height:74px" src="'+esc(p.avatar_url)+'" alt="">'
      :'<div class="av" style="width:74px;height:74px;font-size:23px">'+esc(ini(p.full_name))+'</div>')+
    '<div style="flex:1;min-width:180px"><h1 style="font-size:23px">'+esc(p.full_name||"Unnamed creator")+'</h1>'+
    '<div class="muted small">'+(c.handle?"@"+esc(String(c.handle).replace(/^@/,"")):"")+
    (c.location?" · "+esc(c.location):"")+'</div></div>'+
    (can?'<button class="btn" data-msg="'+esc(id)+'">Message</button>':"")+'</div>'+
    (p.bio?'<p style="margin-top:15px">'+esc(p.bio)+'</p>':"")+
    (c.category?'<div style="margin-top:12px"><span class="chip">'+esc(c.category)+'</span></div>':"")+
    (links?'<div style="margin-top:12px">'+links+'</div>':"")+
    (!can&&me.role==="creator"&&me.id!==id?'<p class="small muted" style="margin-top:14px">Only brand accounts can start a conversation.</p>':"")+
    '</div>';
}

/* ---------- messages ---------- */
var active=null, chan=null, pend=null;

async function messages(){
  V.innerHTML='<h1 style="margin-bottom:14px">Messages</h1><div class="chat">'+
    '<div class="card pane ls"><div class="hd"><h2>Conversations</h2></div><div id="thr"><div class="sk"></div></div></div>'+
    '<div class="card pane cv"><div class="hd"><button class="btn sm g back" id="bk">← Back</button>'+
    '<h2 id="who">Select a conversation</h2></div>'+
    '<div id="msgs"><div class="state">Pick a conversation.</div></div><div id="pb"></div>'+
    '<div class="comp" id="cp" style="display:none"><input type="file" id="f" hidden>'+
    '<button class="btn sm g" id="clip">📎</button>'+
    '<input type="text" id="tx" placeholder="Type a message" maxlength="2000">'+
    '<button class="btn sm" id="sd">Send</button></div></div></div>';

  el("bk").onclick=function(){document.body.classList.remove("open");};
  el("clip").onclick=function(){el("f").click();};
  el("f").onchange=pickFile;
  el("sd").onclick=send;
  el("tx").onkeydown=function(e){if(e.key==="Enter")send();};

  var th=[], brand=me.role==="brand";
  var col=brand?"brand_id":"creator_id", oth=brand?"creator_id":"brand_id";

  var inq = await Q("Loading conversations",
    sb.from("creator_inquiries").select("id,brand_id,creator_id").eq(col,me.id))||[];
  inq.forEach(function(i){th.push({k:"inquiry",id:i.id,o:i[oth]});});

  if(brand){
    var cs = await Q("Loading campaigns", sb.from("campaigns").select("id,title").eq("brand_id",me.id))||[];
    if(cs.length){
      var t={};cs.forEach(function(c){t[c.id]=c.title;});
      var ap = await Q("Loading accepted pitches", sb.from("campaign_applications")
        .select("id,campaign_id,creator_id").in("campaign_id",cs.map(function(c){return c.id;}))
        .eq("status","accepted"))||[];
      ap.forEach(function(a){th.push({k:"campaign",id:a.id,o:a.creator_id,n:t[a.campaign_id]});});
    }
  }else{
    var ap2 = await Q("Loading accepted pitches", sb.from("campaign_applications")
      .select("id,campaign_id").eq("creator_id",me.id).eq("status","accepted"))||[];
    if(ap2.length){
      var cl = await Q("Loading campaigns", sb.from("campaigns").select("id,title,brand_id")
        .in("id",ap2.map(function(a){return a.campaign_id;})))||[];
      var ci={};cl.forEach(function(c){ci[c.id]=c;});
      ap2.forEach(function(a){var c=ci[a.campaign_id];
        if(c)th.push({k:"campaign",id:a.id,o:c.brand_id,n:c.title});});
    }
  }

  if(!th.length){
    el("thr").innerHTML=none("No conversations yet",
      brand?"Message a creator to start one.":"A chat opens when a brand accepts your pitch.");
    return;
  }
  var nm={};
  var pp = await Q("Loading names", sb.from("profiles").select("id,full_name")
    .in("id",Array.from(new Set(th.map(function(t){return t.o;}).filter(Boolean)))))||[];
  pp.forEach(function(p){nm[p.id]=p.full_name;});

  el("thr").innerHTML=th.map(function(t,i){var n=nm[t.o]||"Cube3 user";
    return '<div class="thr" data-i="'+i+'"><div class="av">'+esc(ini(n))+'</div>'+
      '<div class="grow"><h3 class="trunc">'+esc(n)+'</h3>'+
      '<div class="small muted trunc">'+esc(t.n||"Direct message")+'</div></div></div>';}).join("");

  el("thr").querySelectorAll(".thr").forEach(function(x){
    x.onclick=function(){
      el("thr").querySelectorAll(".thr").forEach(function(y){y.classList.remove("on");});
      x.classList.add("on");
      openThread(th[+x.dataset.i], nm[th[+x.dataset.i].o]||"Cube3 user");
    };
  });
}

function tbl(k){return k==="inquiry"?"inquiry_messages":"messages";}
function fk(k){return k==="inquiry"?"inquiry_id":"application_id";}

async function openThread(t,name){
  active=t;
  document.body.classList.add("open");
  el("who").textContent=name;
  el("cp").style.display="flex";
  try{
    await paint();
    if(chan) sb.removeChannel(chan);
    chan=sb.channel("t-"+t.id).on("postgres_changes",
      {event:"INSERT",schema:"public",table:tbl(t.k),filter:fk(t.k)+"=eq."+t.id},paint).subscribe();
  }catch(e){ el("msgs").innerHTML='<div class="state bad"><b>Couldn\'t load</b><code>'+esc(e.message)+'</code></div>'; }
}

async function paint(){
  var box=el("msgs");
  var rows= await Q("Loading messages", sb.from(tbl(active.k))
    .select("id,sender_id,body,attachment_path,attachment_url,attachment_type,attachment_name,attachment_size,created_at")
    .eq(fk(active.k),active.id).order("created_at",{ascending:true}))||[];
  if(!rows.length){box.innerHTML='<div class="state">No messages yet. Say hello.</div>';return;}
  box.innerHTML=rows.map(function(m){
    var mine=m.sender_id===me.id, aid="at"+m.id;
    var att=(m.attachment_path||m.attachment_url)?'<div id="'+aid+'" class="small" style="margin-bottom:6px">Loading…</div>':"";
    if(att) setTimeout(function(){fillAtt(aid,m);},0);
    return '<div class="bub '+(mine?"me":"th")+'">'+att+(m.body?esc(m.body):"")+
      '<span class="ts">'+esc(ago(m.created_at))+'</span></div>';}).join("");
  box.scrollTop=box.scrollHeight;
}

// Old rows kept a public URL; new rows keep a private path.
async function fillAtt(id,m){
  var e=el(id); if(!e)return;
  var url=m.attachment_url;
  if(!url && m.attachment_path){
    var r=await sb.storage.from(BUCKET).createSignedUrl(m.attachment_path,3600);
    url=r.data?r.data.signedUrl:null;
  }
  if(!url){e.textContent="Attachment unavailable";return;}
  var t=m.attachment_type;
  if(t==="image") e.innerHTML='<a href="'+esc(url)+'" target="_blank" rel="noopener"><img src="'+esc(url)+'" alt="" style="max-width:210px;border-radius:9px;display:block"></a>';
  else if(t==="video") e.innerHTML='<video src="'+esc(url)+'" controls preload="metadata" style="max-width:210px;border-radius:9px;display:block"></video>';
  else if(t==="audio") e.innerHTML='<audio src="'+esc(url)+'" controls style="max-width:210px"></audio>';
  else e.innerHTML='<a href="'+esc(url)+'" target="_blank" rel="noopener" download="'+esc(m.attachment_name||"file")+
    '" style="text-decoration:underline">↓ '+esc(m.attachment_name||"Download")+'</a> <span style="opacity:.7">'+esc(fsize(m.attachment_size))+'</span>';
}

function pickFile(e){
  pend=e.target.files[0]||null;
  el("pb").innerHTML = pend? '<div style="padding:9px 13px;font-size:13px;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px"><span>'+
    esc(pend.name)+' ('+esc(fsize(pend.size))+')</span><button class="btn sm g" id="rm">Remove</button></div>' : "";
  var r=el("rm"); if(r) r.onclick=function(){pend=null;el("f").value="";el("pb").innerHTML="";};
}

var BLOCKED=["exe","msi","bat","cmd","com","scr","jar","js","html","htm","svg","php","sh","ps1","vbs","apk"];

async function send(){
  if(!active)return;
  var tx=el("tx"), body=tx.value.trim();
  if(!body && !pend)return;
  var b=el("sd"); b.disabled=true; b.textContent="…";
  try{
    var row={sender_id:me.id, body:body||null};
    row[fk(active.k)]=active.id;
    if(pend){
      var ext=(pend.name.split(".").pop()||"").toLowerCase();
      if(BLOCKED.indexOf(ext)>-1) throw new Error("."+ext+" files can't be shared here. Zip it first.");
      if(pend.size>50*1024*1024) throw new Error("That file is "+fsize(pend.size)+". Limit is 50 MB.");
      var kind=pend.type.indexOf("image/")===0?"image":pend.type.indexOf("video/")===0?"video"
        :pend.type.indexOf("audio/")===0?"audio":"file";
      var path=active.id+"/"+(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2))+(ext?"."+ext:"");
      var up=await sb.storage.from(BUCKET).upload(path,pend,{contentType:pend.type||"application/octet-stream"});
      if(up.error){
        if(/bucket/i.test(up.error.message))
          throw new Error('Storage bucket "'+BUCKET+'" does not exist. Create it in Supabase → Storage (keep it private).');
        throw new Error("Upload failed: "+up.error.message);
      }
      row.attachment_path=path;row.attachment_type=kind;
      row.attachment_name=pend.name.slice(0,200);row.attachment_size=pend.size;
    }
    await Q("Sending", sb.from(tbl(active.k)).insert(row));
    tx.value="";pend=null;el("f").value="";el("pb").innerHTML="";
    await paint();
  }catch(e){ alert(e.message); }
  finally{ b.disabled=false; b.textContent="Send"; }
}

/* ---------- start a chat ---------- */
document.addEventListener("click", async function(e){
  var b=e.target.closest("[data-msg]"); if(!b)return;
  var lbl=b.textContent; b.disabled=true; b.textContent="Opening…";
  try{
    var f = await Q("Checking for an existing conversation", sb.from("creator_inquiries")
      .select("id").eq("brand_id",me.id).eq("creator_id",b.dataset.msg).maybeSingle());
    if(!f) await Q("Starting the conversation", sb.from("creator_inquiries")
      .insert({brand_id:me.id,creator_id:b.dataset.msg}).select("id").single());
    location.hash="#messages";
  }catch(x){ alert(x.message); b.disabled=false; b.textContent=lbl; }
});

/* ---------- router ---------- */
var TITLES={dashboard:"Dashboard",campaigns:"Campaigns",applications:"Applications",
  creators:"Creators",messages:"Messages"};

async function route(){
  var h=(location.hash||"#dashboard").slice(1), base=h.split("/")[0];
  document.body.classList.remove("nav","open");
  if(chan){sb.removeChannel(chan);chan=null;}
  paintNav(base==="creator"?"creators":base);
  el("ttl").textContent=TITLES[base]|| (base==="creator"?"Creators":"Cube3");
  V.innerHTML='<div class="sk"></div><div class="sk"></div>';
  try{
    if(!me){ if(!await boot()) return; }
    if(base==="creator") await creator(h.slice(8));
    else if(base==="campaigns") await campaigns();
    else if(base==="applications") await applications();
    else if(base==="creators") await creators();
    else if(base==="messages") await messages();
    else await dashboard();
  }catch(e){ boom(e); }
}

window.addEventListener("hashchange",route);
route();
})();
</script>
