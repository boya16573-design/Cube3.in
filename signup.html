<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Cube3</title><link rel="stylesheet" href="../style.css"></head><body><main class="auth"><section class="panel"><h1>Join Cube3</h1><form id="signupForm"><input id="fullName" placeholder="Full name" required><select id="role"><option value="creator">Creator</option><option value="brand">Brand</option></select><input id="email" type="email" placeholder="Email" required><input id="password" type="password" minlength="6" placeholder="Password" required><button>Create account</button></form><p id="message"></p><a href="login.html">Already have an account?</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase-client.js"></script><script src="../js/auth.js"></script><script>signupForm.addEventListener("submit",async e=>{e.preventDefault();try{const r=await Cube3Auth.signUp(email.value,password.value,role.value,fullName.value);message.textContent=r.message}catch(x){message.textContent=x.message}})</script></body></html>
