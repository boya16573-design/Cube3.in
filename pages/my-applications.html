<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applications — Cube3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .app-card{display:flex;flex-direction:column;gap:8px;}
  .app-card .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .app-card .pitch{font-size:14.5px;color:var(--ink-muted);white-space:pre-wrap;
    border-left:2px solid var(--line);padding-left:12px;margin-top:4px;}
  .app-card .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-faint);flex-wrap:wrap;}
</style>
</head>
<body data-nav="app">

<div class="container">
  <h1 id="title">Applications</h1>
  <p class="muted" id="lede">Loading…</p>
  <div id="list" style="margin-top:22px"></div>
</div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="/supabase-client.js"></script>
<script src="/auth.js"></script>
<script src="/cube3.js"></script>

<script>
(async function () {
  var LABEL = { pending: "Submitted", shortlisted: "Shortlisted", accepted: "Selected", rejected: "Not selected", withdrawn: "Withdrawn" };
  var list = document.getElementById("list");

  C3.skeleton(list, 3);

  try {
    var self = await C3.me();

    if (self.role === "brand") {
      document.getElementById("title").textContent = "Pitches received";
      document.getElementById("lede").textContent = "Creators who applied to your campaigns.";
      await brandView(self);
    } else {
      document.getElementById("title").textContent = "My applications";
      document.getElementById("lede").textContent = "Campaigns you've pitched for.";
      await creatorView(self);
    }
  } catch (err) {
    C3.fail(list, err);
  }

  async function creatorView(self) {
    var apps = await C3.q("Loading your applications",
      C3.sb.from("campaign_applications")
        .select("id, campaign_id, pitch, status, created_at")
        .eq("creator_id", self.id)
        .order("created_at", { ascending: false })) || [];

    if (!apps.length) {
      return C3.empty(list, "No applications yet",
        "Pitch for an open campaign and it'll show up here.",
        "/pages/campaigns.html", "Browse campaigns");
    }

    var ids = unique(apps.map(function (a) { return a.campaign_id; }));
    var campaigns = ids.length ? await C3.q("Loading campaigns",
      C3.sb.from("campaigns").select("id, title, budget, brand_id").in("id", ids)) || [] : [];
    var byId = index(campaigns);

    list.innerHTML = apps.map(function (a) {
      var c = byId[a.campaign_id];
      return card({
        status: a.status,
        title: c ? c.title : "Campaign no longer available",
        sub: c && c.budget ? C3.money(c.budget) : "",
        pitch: a.pitch,
        foot: "Applied " + C3.when(a.created_at),
        action: a.status === "accepted"
          ? '<a class="btn btn-primary btn-sm" href="/pages/inbox.html">Open chat</a>' : ""
      });
    }).join("");
  }

  async function brandView(self) {
    var campaigns = await C3.q("Loading your campaigns",
      C3.sb.from("campaigns").select("id, title").eq("brand_id", self.id)) || [];

    if (!campaigns.length) {
      return C3.empty(list, "No campaigns yet",
        "Post a campaign and creator pitches will land here.",
        "/pages/campaigns.html", "Post a campaign");
    }

    var byId = index(campaigns);
    var apps = await C3.q("Loading pitches",
      C3.sb.from("campaign_applications")
        .select("id, campaign_id, creator_id, pitch, status, created_at")
        .in("campaign_id", campaigns.map(function (c) { return c.id; }))
        .order("created_at", { ascending: false })) || [];

    if (!apps.length) {
      return C3.empty(list, "No pitches yet",
        "Creators haven't applied to your campaigns yet.");
    }

    var creatorIds = unique(apps.map(function (a) { return a.creator_id; }));
    var people = creatorIds.length ? await C3.q("Loading creators",
      C3.sb.from("profiles").select("id, full_name").in("id", creatorIds)) || [] : [];
    var nameById = {};
    people.forEach(function (p) { nameById[p.id] = p.full_name; });

    list.innerHTML = apps.map(function (a) {
      var c = byId[a.campaign_id];
      return card({
        status: a.status,
        title: nameById[a.creator_id] || "Creator",
        sub: c ? c.title : "",
        pitch: a.pitch,
        foot: "Received " + C3.when(a.created_at),
        action: '<a class="btn btn-ghost btn-sm" href="/pages/creator.html?id=' +
                encodeURIComponent(a.creator_id) + '">View profile</a>'
      });
    }).join("");
  }

  function card(o) {
    return '<div class="card app-card" style="margin-bottom:14px">' +
      '<div class="head">' +
        '<div><h3>' + C3.esc(o.title) + "</h3>" +
        (o.sub ? '<div class="muted" style="font-size:13.5px">' + C3.esc(o.sub) + "</div>" : "") +
        "</div>" +
        '<span class="status-badge ' + C3.esc(o.status) + '">' +
          C3.esc(LABEL[o.status] || o.status) + "</span>" +
      "</div>" +
      (o.pitch ? '<p class="pitch">' + C3.esc(o.pitch) + "</p>" : "") +
      '<div class="foot"><span>' + C3.esc(o.foot) + "</span>" + (o.action || "") + "</div>" +
    "</div>";
  }

  function unique(a) { return Array.from(new Set(a.filter(Boolean))); }
  function index(rows) {
    var m = {}; (rows || []).forEach(function (r) { m[r.id] = r; }); return m;
  }
})();
</script>

<script src="/layout.js"></script>
</body>
</html>
