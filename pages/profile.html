<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - Cube3</title>
<link rel="stylesheet" href="/style.css">
<style>
  .profile-header{display:flex; gap:22px; align-items:center; padding-bottom:24px; border-bottom:1px solid var(--line); margin-bottom:24px;}
  .avatar-wrapper{position:relative; flex-shrink:0;}
  .avatar{width:96px; height:96px; border-radius:50%; object-fit:cover; background:var(--violet-dim); border:3px solid var(--panel); box-shadow:0 0 0 1px var(--line); display:block;}
  .upload-button{position:absolute; bottom:0; right:0; width:30px; height:30px; border-radius:50%; border:3px solid var(--paper); background:var(--violet); color:#fff; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center;}
  .profile-title h1{font-size:24px; margin-bottom:6px;}
  .role-badge{display:inline-block; padding:5px 11px; border-radius:20px; background:var(--violet-dim); color:var(--violet-deep); font-size:12px; font-weight:600;}
  .section{padding:22px 0; border-bottom:1px solid var(--line);}
  .section:last-of-type{border-bottom:0; padding-bottom:0;}
  .section h2{font-size:17px; margin-bottom:16px;}
  .social-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:600px){ .social-grid{grid-template-columns:1fr;} .profile-header{flex-direction:column; text-align:center;} }
  .hidden{display:none;}
</style>
</head>
<body>

<header class="site-header">
  <nav class="wrap">
    <a class="brand" href="/index.html">
      <svg class="mark" viewBox="0 0 24 24" fill="none"><path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" fill="#6c5ce7"/></svg>
      Cube3
    </a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="campaigns.html">Campaigns</a>
      <a href="creators.html">Creators</a>
      <a href="inbox.html">Messages</a>
      <a href="profile.html" class="active">Profile</a>
      <a href="#" id="logout">Logout</a>
    </div>
  </nav>
</header>

<div class="container-narrow" style="max-width:640px;">

  <div class="card">

    <div class="profile-header">
      <div class="avatar-wrapper">
        <img id="avatar" class="avatar" src="https://placehold.co/96x96/e7e6f0/6c5ce7?text=%20" alt="Profile picture">
        <button type="button" class="upload-button" onclick="document.getElementById('avatarInput').click()" aria-label="Change photo">📷</button>
        <input id="avatarInput" type="file" accept="image/*" hidden>
      </div>
      <div class="profile-title">
        <h1 id="displayName">Loading...</h1>
        <span id="role" class="role-badge">...</span>
      </div>
    </div>

    <form id="profileForm">

      <!-- CREATOR PROFILE -->
      <div id="creatorSection" class="hidden">

        <div class="section">
          <h2>Creator information</h2>

          <label for="creatorName">Full name</label>
          <input id="creatorName" type="text" placeholder="Your name">

          <label for="handle">Creator handle</label>
          <input id="handle" type="text" placeholder="@yourname">

          <label for="category">Category</label>
          <select id="category">
            <option value="">Select category</option>
            <option>Content Creator</option>
            <option>Influencer</option>
            <option>YouTuber</option>
            <option>Instagram Creator</option>
            <option>Gaming</option>
            <option>Education</option>
            <option>Technology</option>
            <option>Fashion</option>
            <option>Fitness</option>
            <option>Travel</option>
            <option>Music</option>
            <option>Photography</option>
            <option>Other</option>
          </select>

          <label for="creatorBio">Bio</label>
          <textarea id="creatorBio" maxlength="1000" placeholder="Tell brands about yourself, your audience and your content..."></textarea>
        </div>

        <div class="section">
          <h2>Social media</h2>
          <div class="social-grid">
            <div><label for="youtube">YouTube</label><input id="youtube" type="url" placeholder="https://youtube.com/@username"></div>
            <div><label for="instagram">Instagram</label><input id="instagram" type="url" placeholder="https://instagram.com/username"></div>
            <div><label for="x">X</label><input id="x" type="url" placeholder="https://x.com/username"></div>
            <div><label for="portfolio">Portfolio</label><input id="portfolio" type="url" placeholder="https://yourwebsite.com"></div>
            <div><label for="tiktok">TikTok</label><input id="tiktok" type="url" placeholder="https://tiktok.com/@username"></div>
            <div><label for="facebook">Facebook</label><input id="facebook" type="url" placeholder="https://facebook.com/username"></div>
            <div><label for="snapchat">Snapchat</label><input id="snapchat" type="url" placeholder="https://snapchat.com/add/username"></div>
            <div><label for="linkedin">LinkedIn</label><input id="linkedin" type="url" placeholder="https://linkedin.com/in/username"></div>
            <div><label for="threads">Threads</label><input id="threads" type="url" placeholder="https://threads.net/@username"></div>
          </div>
        </div>

      </div>

      <!-- BRAND PROFILE -->
      <div id="brandSection" class="hidden">
        <div class="section">
          <h2>Company information</h2>

          <label for="companyName">Company name</label>
          <input id="companyName" type="text" placeholder="Your company name">

          <label for="industry">Industry</label>
          <select id="industry">
            <option value="">Select industry</option>
            <option>Technology</option>
            <option>Finance</option>
            <option>Education</option>
            <option>Healthcare</option>
            <option>Gaming</option>
            <option>Fashion</option>
            <option>Food</option>
            <option>Travel</option>
            <option>Entertainment</option>
            <option>Retail</option>
            <option>Other</option>
          </select>

          <label for="companyBio">Company bio</label>
          <textarea id="companyBio" maxlength="1500" placeholder="Tell creators about your company..."></textarea>

          <label for="website">Company website</label>
          <input id="website" type="url" placeholder="https://yourcompany.com">
        </div>
      </div>

      <div class="section" style="display:flex; gap:10px;">
        <button id="saveButton" class="btn btn-primary" type="submit" style="flex:1;">Save profile</button>
        <button type="button" class="btn btn-danger" onclick="handleLogout()">Log out</button>
      </div>

    </form>

    <div id="message" class="message"></div>

  </div>
</div>

<script src="/config.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-client.js?v=2"></script>
<script src="/auth.js?v=2"></script>

<script>
  const supabase = window.cube3Supabase;
  let user = null;
  let role = null;

  function showMessage(text, type) {
    const box = document.getElementById("message");
    box.textContent = text;
    box.className = "message " + type;
  }

  async function init() {
    try {
      user = await Cube3Auth.requireUser();
      if (!user) return;
      await loadProfile();
    } catch (error) {
      console.error(error);
      document.getElementById("displayName").textContent = "Error loading profile";
      showMessage(error.message || "Something went wrong loading your profile.", "error");
    }
  }

  async function loadProfile() {
    const { data: profile, error } =
      await window.withTimeout(
        supabase.from("profiles").select("*").eq("id", user.id).single(),
        10000,
        "Loading your profile"
      );

    if (error && error.code !== "PGRST116") throw error;

    role = profile?.role || user.user_metadata?.role || "creator";

    document.getElementById("displayName").textContent =
      profile?.full_name || user.email || "Cube3 User";

    document.getElementById("role").textContent = role === "creator" ? "Creator" : "Brand";

    if (profile?.avatar_url) {
      document.getElementById("avatar").src = profile.avatar_url;
    }

    if (role === "creator") {
      document.getElementById("creatorSection").classList.remove("hidden");
      document.getElementById("creatorName").value = profile?.full_name || "";
      document.getElementById("creatorBio").value = profile?.bio || "";
      await loadCreatorProfile();
    } else {
      document.getElementById("brandSection").classList.remove("hidden");
      await loadBrandProfile();
    }
  }

  async function loadCreatorProfile() {
    const { data } = await supabase.from("creator_profiles").select("*").eq("id", user.id).maybeSingle();
    if (!data) return;

    document.getElementById("handle").value = data.handle || "";
    document.getElementById("category").value = data.category || "";
    document.getElementById("youtube").value = data.youtube_url || "";
    document.getElementById("instagram").value = data.instagram_url || "";
    document.getElementById("x").value = data.x_url || "";
    document.getElementById("portfolio").value = data.portfolio_url || "";
    document.getElementById("tiktok").value = data.tiktok_url || "";
    document.getElementById("facebook").value = data.facebook_url || "";
    document.getElementById("snapchat").value = data.snapchat_url || "";
    document.getElementById("linkedin").value = data.linkedin_url || "";
    document.getElementById("threads").value = data.threads_url || "";
  }

  async function loadBrandProfile() {
    const { data } = await supabase.from("brand_profiles").select("*").eq("id", user.id).maybeSingle();
    if (!data) return;

    document.getElementById("companyName").value = data.company_name || "";
    document.getElementById("industry").value = data.industry || "";
    document.getElementById("companyBio").value = data.description || "";
    document.getElementById("website").value = data.website_url || "";
    if (data.logo_url) document.getElementById("avatar").src = data.logo_url;
  }

  document.getElementById("profileForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    const button = document.getElementById("saveButton");
    button.disabled = true;
    button.textContent = "Saving...";

    try {
      if (role === "creator") {
        await saveCreator();
      } else {
        await saveBrand();
      }
      showMessage("Profile saved successfully.", "success");
      await loadProfile();

    } catch (error) {
      console.error(error);
      showMessage(error.message || "Could not save profile.", "error");
    } finally {
      button.disabled = false;
      button.textContent = "Save profile";
    }
  });

  async function saveCreator() {
    const fullName = document.getElementById("creatorName").value.trim();

    const { error: profileError } = await supabase.from("profiles").upsert({
      id: user.id,
      full_name: fullName,
      bio: document.getElementById("creatorBio").value.trim(),
      role: "creator",
      updated_at: new Date().toISOString()
    });
    if (profileError) throw profileError;

    const { error } = await supabase.from("creator_profiles").upsert({
      id: user.id,
      handle: document.getElementById("handle").value.trim(),
      category: document.getElementById("category").value,
      youtube_url: document.getElementById("youtube").value.trim(),
      instagram_url: document.getElementById("instagram").value.trim(),
      x_url: document.getElementById("x").value.trim(),
      portfolio_url: document.getElementById("portfolio").value.trim(),
      tiktok_url: document.getElementById("tiktok").value.trim(),
      facebook_url: document.getElementById("facebook").value.trim(),
      snapchat_url: document.getElementById("snapchat").value.trim(),
      linkedin_url: document.getElementById("linkedin").value.trim(),
      threads_url: document.getElementById("threads").value.trim()
    }, { onConflict: "id" });
    if (error) throw error;
  }

  async function saveBrand() {
    const companyName = document.getElementById("companyName").value.trim();

    const { error: profileError } = await supabase.from("profiles").upsert({
      id: user.id,
      full_name: companyName,
      role: "brand",
      updated_at: new Date().toISOString()
    });
    if (profileError) throw profileError;

    const { error } = await supabase.from("brand_profiles").upsert({
      id: user.id,
      company_name: companyName,
      website_url: document.getElementById("website").value.trim(),
      industry: document.getElementById("industry").value,
      description: document.getElementById("companyBio").value.trim()
    }, { onConflict: "id" });
    if (error) throw error;
  }

  document.getElementById("avatarInput").addEventListener("change", uploadAvatar);

  async function uploadAvatar(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (!file.type.startsWith("image/")) { showMessage("Please select an image.", "error"); return; }
    if (file.size > 5 * 1024 * 1024) { showMessage("Image must be smaller than 5 MB.", "error"); return; }

    try {
      const extension = file.name.split(".").pop();
      const path = `${user.id}/${Date.now()}.${extension}`;

      const { error: uploadError } = await supabase.storage.from("avatars").upload(path, file, { upsert: true });
      if (uploadError) throw uploadError;

      const { data } = supabase.storage.from("avatars").getPublicUrl(path);
      const imageUrl = data.publicUrl;

      document.getElementById("avatar").src = imageUrl;

      await supabase.from("profiles").upsert({ id: user.id, avatar_url: imageUrl, updated_at: new Date().toISOString() });

      if (role === "brand") {
        await supabase.from("brand_profiles").update({ logo_url: imageUrl }).eq("id", user.id);
      }

      showMessage("Image uploaded successfully.", "success");

    } catch (error) {
      console.error(error);
      showMessage("Image upload failed: " + error.message, "error");
    }
  }

  async function handleLogout() {
    try { await Cube3Auth.signOut(); } catch (error) { console.error(error); }
  }

  document.getElementById("logout").addEventListener("click", async function(event) {
    event.preventDefault();
    await handleLogout();
  });

  init();
</script>

</body>
</html>
