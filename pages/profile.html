<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile - Cube3</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08090d;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    nav {
      height: 65px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0b0c11;
      border-bottom: 1px solid #252733;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
    }

    .logo span {
      color: #9878ff;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      margin-left: 18px;
      font-size: 14px;
    }

    nav a:hover {
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 35px 20px 70px;
    }

    .profile-card {
      background: #11131a;
      border: 1px solid #292c38;
      border-radius: 20px;
      padding: 30px;
    }

    .profile-header {
      display: flex;
      gap: 25px;
      align-items: center;
      padding-bottom: 25px;
      border-bottom: 1px solid #292c38;
    }

    .avatar-wrapper {
      position: relative;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      background: #20232e;
      border: 3px solid #9274ff;
      display: block;
    }

    .upload-button {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid #11131a;
      background: #9274ff;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .profile-title h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .role {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      background: #211b39;
      color: #a992ff;
      font-size: 13px;
    }

    .section {
      padding: 25px 0;
      border-bottom: 1px solid #292c38;
    }

    .section:last-child {
      border-bottom: 0;
    }

    .section h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    label {
      display: block;
      color: #c7c8d0;
      margin: 15px 0 7px;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #30333f;
      background: #0c0e13;
      color: white;
      outline: none;
      font-size: 15px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #9274ff;
    }

    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .social-input {
      position: relative;
    }

    .social-input span {
      position: absolute;
      left: 13px;
      top: 13px;
      color: #9274ff;
      font-weight: bold;
      z-index: 1;
    }

    .social-input input {
      padding-left: 85px;
    }

    .save-button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: 0;
      border-radius: 10px;
      background: #9274ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-button:hover {
      background: #a58eff;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
    }

    .success {
      display: block;
      background: #12351f;
      color: #83eca1;
    }

    .error {
      display: block;
      background: #3a171b;
      color: #ff9da5;
    }

    .hidden {
      display: none;
    }

    @media(max-width: 650px) {

      .profile-header {
        flex-direction: column;
        text-align: center;
      }

      .social-grid {
        grid-template-columns: 1fr;
      }

      nav {
        padding: 0 15px;
      }

      nav a {
        margin-left: 7px;
        font-size: 12px;
      }

      .profile-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<nav>

  <div class="logo">
    Cube<span>3</span>
  </div>

  <div>
    <a href="dashboard.html">Dashboard</a>
    <a href="campaigns.html">Campaigns</a>
    <a href="profile.html">Profile</a>
    <a href="#" id="logout">Logout</a>
  </div>

</nav>


<div class="container">

  <div class="profile-card">

    <div class="profile-header">

      <div class="avatar-wrapper">

        <img
          id="avatar"
          class="avatar"
          src="https://placehold.co/120x120"
          alt="Profile picture"
        >

        <button
          class="upload-button"
          onclick="document.getElementById('avatarInput').click()"
        >
          📷
        </button>

        <input
          id="avatarInput"
          type="file"
          accept="image/*"
          hidden
        >

      </div>


      <div class="profile-title">

        <h1 id="displayName">
          Loading...
        </h1>

        <span
          id="role"
          class="role"
        >
          ...
        </span>

      </div>

    </div>


    <!-- CREATOR PROFILE -->

    <div
      id="creatorSection"
      class="hidden"
    >

      <div class="section">

        <h2>Creator Information</h2>

        <label>
          Full name
        </label>

        <input
          id="creatorName"
          type="text"
          placeholder="Your name"
        >


        <label>
          Creator handle
        </label>

        <input
          id="handle"
          type="text"
          placeholder="@yourname"
        >


        <label>
          Category
        </label>

        <select id="category">

          <option value="">
            Select category
          </option>

          <option>Content Creator</option>
          <option>Influencer</option>
          <option>YouTuber</option>
          <option>Instagram Creator</option>
          <option>Gaming</option>
          <option>Education</option>
          <option>Technology</option>
          <option>Fashion</option>
          <option>Fitness</option>
          <option>Travel</option>
          <option>Music</option>
          <option>Photography</option>
          <option>Other</option>

        </select>


        <label>
          Bio
        </label>

        <textarea
          id="creatorBio"
          maxlength="1000"
          placeholder="Tell brands about yourself, your audience and your content..."
        ></textarea>

      </div>


      <div class="section">

        <h2>
          Social Media
        </h2>

        <div class="social-grid">

          <div class="social-input">

            <span>YouTube</span>

            <input
              id="youtube"
              type="url"
              placeholder="https://youtube.com/@username"
            >

          </div>


          <div class="social-input">

            <span>Instagram</span>

            <input
              id="instagram"
              type="url"
              placeholder="https://instagram.com/username"
            >

          </div>


          <div class="social-input">

            <span>X</span>

            <input
              id="x"
              type="url"
              placeholder="https://x.com/username"
            >

          </div>


          <div class="social-input">

            <span>Portfolio</span>

            <input
              id="portfolio"
              type="url"
              placeholder="https://yourwebsite.com"
            >

          </div>

        </div>

      </div>

    </div>


    <!-- BRAND PROFILE -->

    <div
      id="brandSection"
      class="hidden"
    >

      <div class="section">

        <h2>
          Company Information
        </h2>

        <label>
          Company name
        </label>

        <input
          id="companyName"
          type="text"
          placeholder="Your company name"
        >


        <label>
          Industry
        </label>

        <select id="industry">

          <option value="">
            Select industry
          </option>

          <option>Technology</option>
          <option>Finance</option>
          <option>Education</option>
          <option>Healthcare</option>
          <option>Gaming</option>
          <option>Fashion</option>
          <option>Food</option>
          <option>Travel</option>
          <option>Entertainment</option>
          <option>Retail</option>
          <option>Other</option>

        </select>


        <label>
          Company bio
        </label>

        <textarea
          id="companyBio"
          maxlength="1500"
          placeholder="Tell creators about your company..."
        ></textarea>


        <label>
          Company website
        </label>

        <input
          id="website"
          type="url"
          placeholder="https://yourcompany.com"
        >

      </div>

    </div>


    <button
      id="saveButton"
      class="save-button"
    >
      Save Profile
    </button>

    <div
      id="message"
      class="message"
    ></div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../supabase-client.js"></script>


<script>

  const supabase = window.cube3Supabase;

  let user = null;
  let role = null;


  async function init() {

    if (!supabase) {

      showMessage(
        "Supabase client is not configured.",
        true
      );

      return;

    }


    const {
      data: {
        session
      },
      error
    } =
      await supabase.auth.getSession();


    if (error || !session) {

      window.location.href =
        "login.html";

      return;

    }


    user = session.user;


    await loadProfile();

  }


  async function loadProfile() {

    const {
      data: profile,
      error
    } =
      await supabase
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .single();


    if (error) {

      showMessage(
        error.message,
        true
      );

      return;

    }


    role = profile.role;


    document
      .getElementById("displayName")
      .textContent =
        profile.full_name ||
        profile.email ||
        "Cube3 User";


    document
      .getElementById("role")
      .textContent =
        role === "creator"
          ? "Creator"
          : "Brand";


    if (profile.avatar_url) {

      document
        .getElementById("avatar")
        .src =
          profile.avatar_url;

    }


    if (role === "creator") {

      await loadCreatorProfile();

      document
        .getElementById("creatorSection")
        .classList.remove("hidden");

    } else {

      await loadBrandProfile();

      document
        .getElementById("brandSection")
        .classList.remove("hidden");

    }

  }


  async function loadCreatorProfile() {

    const {
      data
    } =
      await supabase
        .from("creator_profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();


    document
      .getElementById("creatorName")
      .value =
        document
          .getElementById("displayName")
          .textContent;


    if (!data) return;


    document
      .getElementById("handle")
      .value =
        data.handle || "";


    document
      .getElementById("category")
      .value =
        data.category || "";


    document
      .getElementById("creatorBio")
      .value =
        data.bio || "";


    document
      .getElementById("youtube")
      .value =
        data.youtube_url || "";


    document
      .getElementById("instagram")
      .value =
        data.instagram_url || "";


    document
      .getElementById("x")
      .value =
        data.x_url || "";


    document
      .getElementById("portfolio")
      .value =
        data.portfolio_url || "";

  }


  async function loadBrandProfile() {

    const {
      data
    } =
      await supabase
        .from("brand_profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();


    if (!data) return;


    document
      .getElementById("companyName")
      .value =
        data.company_name || "";


    document
      .getElementById("industry")
      .value =
        data.industry || "";


    document
      .getElementById("companyBio")
      .value =
        data.description || "";


    document
      .getElementById("website")
      .value =
        data.website_url || "";


    if (data.logo_url) {

      document
        .getElementById("avatar")
        .src =
          data.logo_url;

    }

  }


  document
    .getElementById("saveButton")
    .addEventListener(
      "click",
      saveProfile
    );


  async function saveProfile() {

    try {

      const {
        data: {
          user: currentUser
        }
      } =
        await supabase.auth.getUser();


      if (!currentUser) {

        window.location.href =
          "login.html";

        return;

      }


      if (role === "creator") {

        await saveCreator(
          currentUser
        );

      } else {

        await saveBrand(
          currentUser
        );

      }


      showMessage(
        "Profile saved successfully.",
        false
      );


      await loadProfile();


    } catch (error) {

      console.error(error);

      showMessage(
        error.message,
        true
      );

    }

  }


  async function saveCreator(currentUser) {

    const fullName =
      document
        .getElementById("creatorName")
        .value
        .trim();


    const profileUpdate = {

      full_name: fullName,

      bio:
        document
          .getElementById("creatorBio")
          .value
          .trim(),

      updated_at:
        new Date().toISOString()

    };


    const {
      error: profileError
    } =
      await supabase
        .from("profiles")
        .update(profileUpdate)
        .eq("id", currentUser.id);


    if (profileError)
      throw profileError;


    const creatorData = {

      id: currentUser.id,

      handle:
        document
          .getElementById("handle")
          .value
          .trim(),

      category:
        document
          .getElementById("category")
          .value,

      youtube_url:
        document
          .getElementById("youtube")
          .value
          .trim(),

      instagram_url:
        document
          .getElementById("instagram")
          .value
          .trim(),

      x_url:
        document
          .getElementById("x")
          .value
          .trim(),

      portfolio_url:
        document
          .getElementById("portfolio")
          .value
          .trim()

    };


    const {
      error
    } =
      await supabase
        .from("creator_profiles")
        .upsert(
          creatorData,
          {
            onConflict: "id"
          }
        );


    if (error)
      throw error;

  }


  async function saveBrand(currentUser) {

    const companyName =
      document
        .getElementById("companyName")
        .value
        .trim();


    const {
      error: profileError
    } =
      await supabase
        .from("profiles")
        .update({

          full_name: companyName,

          updated_at:
            new Date().toISOString()

        })
        .eq("id", currentUser.id);


    if (profileError)
      throw profileError;


    const brandData = {

      id: currentUser.id,

      company_name:
        companyName,

      website_url:
        document
          .getElementById("website")
          .value
          .trim(),

      industry:
        document
          .getElementById("industry")
          .value,

      description:
        document
          .getElementById("companyBio")
          .value
          .trim()

    };


    const {
      error
    } =
      await supabase
        .from("brand_profiles")
        .upsert(
          brandData,
          {
            onConflict: "id"
          }
        );


    if (error)
      throw error;

  }


  document
    .getElementById("avatarInput")
    .addEventListener(
      "change",
      uploadAvatar
    );


  async function uploadAvatar(event) {

    const file =
      event.target.files[0];


    if (!file) return;


    if (!file.type.startsWith("image/")) {

      showMessage(
        "Please select an image.",
        true
      );

      return;

    }


    if (file.size > 5 * 1024 * 1024) {

      showMessage(
        "Image must be smaller than 5 MB.",
        true
      );

      return;

    }


    try {

      const extension =
        file.name
          .split(".")
          .pop();


      const path =
        `${user.id}/${Date.now()}.${extension}`;


      const {
        error: uploadError
      } =
        await supabase.storage
          .from("avatars")
          .upload(
            path,
            file,
            {
              upsert: true
            }
          );


      if (uploadError)
        throw uploadError;


      const {
        data
      } =
        supabase.storage
          .from("avatars")
          .getPublicUrl(path);


      const imageUrl =
        data.publicUrl;


      document
        .getElementById("avatar")
        .src =
          imageUrl;


      if (role === "creator") {

        await supabase
          .from("profiles")
          .update({
            avatar_url: imageUrl
          })
          .eq("id", user.id);

      } else {

        await supabase
          .from("profiles")
          .update({
            avatar_url: imageUrl
          })
          .eq("id", user.id);


        await supabase
          .from("brand_profiles")
          .update({
            logo_url: imageUrl
          })
          .eq("id", user.id);

      }


      showMessage(
        "Image uploaded successfully.",
        false
      );


    } catch (error) {

      console.error(error);

      showMessage(
        "Image upload failed: " +
        error.message,
        true
      );

    }

  }


  document
    .getElementById("logout")
    .addEventListener(
      "click",
      async event => {

        event.preventDefault();

        await supabase.auth.signOut();

        window.location.href =
          "login.html";

      }
    );


  function showMessage(
    text,
    error
  ) {

    const box =
      document.getElementById(
        "message"
      );


    box.textContent = text;

    box.className =
      error
        ? "message error"
        : "message success";

  }


  init();

</script>

</body>
</html>
