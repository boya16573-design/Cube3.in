<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Cube3</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="site-header">
  <nav class="wrap">
    <a class="brand" href="/index.html">
      <svg class="mark" viewBox="0 0 24 24" fill="none"><path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" fill="#6c5ce7"/></svg>
      Cube3
    </a>
    <div class="nav-links">
      <a href="/index.html">Home</a>
    </div>
  </nav>
</header>

<div class="auth-page">
  <div class="auth-card">
    <h1>Join Cube3</h1>
    <div class="subtitle">Create your account and start building connections.</div>

    <form id="signupForm">
      <label for="role">I am joining as</label>
      <select id="role" required>
        <option value="creator">Creator</option>
        <option value="brand">Brand</option>
      </select>

      <label for="fullName">Full name</label>
      <input id="fullName" type="text" placeholder="Your full name" required>

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Minimum 6 characters" minlength="6" required>

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" placeholder="Enter password again" minlength="6" required>

      <button id="signupButton" class="btn btn-primary btn-block" type="submit" style="margin-top:18px;">Create Cube3 account</button>
    </form>

    <div id="message" class="message"></div>

    <div class="auth-link">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-client.js"></script>
<script src="/auth.js"></script>

<script>
  const form = document.getElementById("signupForm");
  const button = document.getElementById("signupButton");
  const message = document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const role = document.getElementById("role").value;
    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
      showMessage("Passwords do not match.", "error");
      return;
    }
    if (password.length < 6) {
      showMessage("Password must contain at least 6 characters.", "error");
      return;
    }

    button.disabled = true;
    button.textContent = "Creating account...";

    try {
      const result = await Cube3Auth.signUp(email, password, role, fullName);
      showMessage(result.message, "success");
      setTimeout(() => { window.location.href = "login.html"; }, 2200);

    } catch (error) {
      console.error(error);
      showMessage(error.message || "Could not create your account.", "error");
      button.disabled = false;
      button.textContent = "Create Cube3 account";
    }
  });
</script>

</body>
</html>
