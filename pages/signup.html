<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Cube3</title>
<link rel="preconnect" href="https://zjgtceurzsvjkspkvroz.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>.hidden{display:none;}</style>
</head>
<body>

<header class="site-header">
  <nav class="wrap">
    <a class="brand" href="/index.html">
      <svg class="mark" viewBox="0 0 24 24" fill="none"><path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" fill="#3730a3"/></svg>
      Cube3
    </a>
    <div class="nav-links"><a href="/index.html">Home</a></div>
  </nav>
</header>

<div class="auth-page">
  <div class="auth-card">
    <h1>What are you joining Cube3 as?</h1>
    <div class="subtitle">Create your account to get started.</div>

    <form id="signupForm">
      <label for="role">I am joining as</label>
      <select id="role" required>
        <option value="creator">I'm a Creator</option>
        <option value="brand">I'm a Brand</option>
      </select>

      <label for="fullName">Full name</label>
      <input id="fullName" type="text" placeholder="Your full name" required>

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Minimum 6 characters" minlength="6" required>

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" placeholder="Enter password again" minlength="6" required>

      <button id="signupButton" class="btn btn-primary btn-block" type="submit" style="margin-top:18px;">Create Cube3 account</button>
    </form>

    <form id="otpForm" class="hidden">
      <p class="subtitle" style="margin-bottom:14px;">We sent a 6-digit code to your email. Enter it below to confirm your account.</p>
      <label for="otpCode">Confirmation code</label>
      <input id="otpCode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="123456" required>
      <button id="otpButton" class="btn btn-primary btn-block" type="submit" style="margin-top:18px;">Verify and continue</button>
      <button id="resendButton" type="button" class="btn btn-ghost btn-block" style="margin-top:10px;">Resend code</button>
    </form>

    <div id="message" class="message"></div>
    <div class="auth-link">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="/supabase-client.js"></script>
<script src="/auth.js"></script>

<script>
  const form = document.getElementById("signupForm");
  const button = document.getElementById("signupButton");
  const otpForm = document.getElementById("otpForm");
  const otpButton = document.getElementById("otpButton");
  const resendButton = document.getElementById("resendButton");
  const message = document.getElementById("message");
  let pendingEmail = "";

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const role = document.getElementById("role").value;
    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) { showMessage("Passwords do not match.", "error"); return; }
    if (password.length < 6) { showMessage("Password must contain at least 6 characters.", "error"); return; }

    button.disabled = true;
    button.textContent = "Creating account...";

    try {
      await Cube3Auth.signUp(email, password, role, fullName);
      pendingEmail = email;
      showMessage("Account created! Check your email for a 6-digit code.", "success");
      form.classList.add("hidden");
      otpForm.classList.remove("hidden");

    } catch (error) {
      console.error(error);
      showMessage(error.message || "Could not create your account.", "error");
      button.disabled = false;
      button.textContent = "Create Cube3 account";
    }
  });

  otpForm.addEventListener("submit", async function(event) {
    event.preventDefault();
    const code = document.getElementById("otpCode").value.trim();
    otpButton.disabled = true;
    otpButton.textContent = "Verifying...";

    try {
      const { error } = await window.cube3Supabase.auth.verifyOtp({ email: pendingEmail, token: code, type: "signup" });
      if (error) throw error;

      showMessage("Email confirmed! Redirecting...", "success");
      setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);

    } catch (error) {
      console.error(error);
      showMessage(error.message || "Invalid or expired code. Try again or resend.", "error");
      otpButton.disabled = false;
      otpButton.textContent = "Verify and continue";
    }
  });

  resendButton.addEventListener("click", async function() {
    resendButton.disabled = true;
    resendButton.textContent = "Sending...";
    try {
      const { error } = await window.cube3Supabase.auth.resend({ type: "signup", email: pendingEmail });
      if (error) throw error;
      showMessage("New code sent to your email.", "success");
    } catch (error) {
      console.error(error);
      showMessage(error.message || "Could not resend code.", "error");
    } finally {
      resendButton.disabled = false;
      resendButton.textContent = "Resend code";
    }
  });
</script>

</body>
</html>
