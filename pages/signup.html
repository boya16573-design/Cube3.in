<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Cube3</title>

  <link rel="stylesheet" href="/style.css">

  <style>
    body {
      margin: 0;
      background: #08080d;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      background: #11121a;
      border: 1px solid #292b38;
      border-radius: 20px;
      padding: 32px;
      box-sizing: border-box;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 30px;
    }

    .logo span {
      color: #9b7cff;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 32px;
    }

    .subtitle {
      color: #999baa;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #d7d8df;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 15px;
      border-radius: 10px;
      border: 1px solid #303241;
      background: #0b0c12;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #9878ff;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #9274ff;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #a48aff;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      display: none;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #12351f;
      color: #7ff0a0;
    }

    .error {
      display: block;
      background: #39171b;
      color: #ff9ca5;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #999baa;
    }

    a {
      color: #a78bfa;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="auth-page">
  <div class="auth-card">

    <div class="logo">Cube<span>3</span></div>

    <h1>Join Cube3</h1>
    <div class="subtitle">
      Create your account and start building connections.
    </div>

    <form id="signupForm">

      <label for="role">I am joining as</label>

      <select id="role" required>
        <option value="creator">Creator</option>
        <option value="brand">Brand</option>
      </select>

      <label for="fullName">Full name</label>

      <input
        id="fullName"
        type="text"
        placeholder="Your full name"
        required
      >

      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        placeholder="Minimum 6 characters"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm password</label>

      <input
        id="confirmPassword"
        type="password"
        placeholder="Enter password again"
        minlength="6"
        required
      >

      <button id="signupButton" type="submit">
        Create Cube3 account
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login-link">
      Already have an account?
      <a href="login.html">Log in</a>
    </div>

  </div>
</div>

<script src="/config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/supabase-client.js"></script>
<script src="/auth.js"></script>

<script>
  const form = document.getElementById("signupForm");
  const button = document.getElementById("signupButton");
  const message = document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const role = document.getElementById("role").value;
    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword =
      document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
      showMessage("Passwords do not match.", "error");
      return;
    }

    if (password.length < 6) {
      showMessage("Password must contain at least 6 characters.", "error");
      return;
    }

    button.disabled = true;
    button.textContent = "Creating account...";

    try {

      const result = await Cube3Auth.signUp(
        email,
        password,
        role,
        fullName
      );

      showMessage(result.message, "success");

      setTimeout(() => {
        window.location.href = "login.html";
      }, 2500);

    } catch (error) {

      console.error(error);

      showMessage(
        error.message || "Could not create your account.",
        "error"
      );

      button.disabled = false;
      button.textContent = "Create Cube3 account";
    }
  });
</script>

</body>
</html>
