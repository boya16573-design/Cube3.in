<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Cube3</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#08090d;color:#f5f5f7;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:460px;background:#11131a;border:1px solid #252936;border-radius:20px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    .logo{text-align:center;font-size:32px;font-weight:800;margin-bottom:8px}.logo span{color:#9277ff}
    h1{text-align:center;margin:10px 0;font-size:28px}.subtitle{text-align:center;color:#969aa8;margin-bottom:24px}
    label{display:block;margin:16px 0 7px;color:#c9cbd4;font-size:14px}
    input,select{width:100%;padding:14px 15px;border-radius:10px;border:1px solid #303441;background:#090b10;color:white;font-size:16px;outline:none}
    input:focus,select:focus{border-color:#9277ff}
    .roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
    .role{border:1px solid #303441;border-radius:12px;padding:14px;cursor:pointer;background:#090b10;text-align:center;color:#c9cbd4}
    .role input{display:none}.role.active{border-color:#9277ff;background:#19152d;color:white}
    .role strong{display:block;margin-bottom:4px}.role small{color:#969aa8}
    button{width:100%;margin-top:24px;padding:15px;border:0;border-radius:10px;background:#9277ff;color:white;font-size:16px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}#message{margin-top:18px;text-align:center;min-height:24px;line-height:1.45}
    .login{text-align:center;margin-top:24px;color:#969aa8}.login a{color:#a28aff;text-decoration:none}.back{display:block;text-align:center;margin-top:18px;color:#777c8b;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Cube<span>3</span></div>
    <h1>Join Cube3</h1>
    <div class="subtitle">Create your creator or brand account</div>

    <form id="signupForm">
      <label>Account type</label>
      <div class="roles">
        <label class="role active" id="creatorRole">
          <input type="radio" name="role" value="creator" checked>
          <strong>👤 Creator</strong>
          <small>Showcase your audience</small>
        </label>
        <label class="role" id="brandRole">
          <input type="radio" name="role" value="brand">
          <strong>🏢 Brand</strong>
          <small>Find creators & campaigns</small>
        </label>
      </div>

      <label for="fullName">Full name</label>
      <input id="fullName" type="text" placeholder="Your full name" required>

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="At least 6 characters" minlength="6" required>

      <button id="signupButton" type="submit">Create account</button>
      <div id="message"></div>
    </form>

    <div class="login">Already have an account? <a href="login.html">Login</a></div>
    <a class="back" href="../index.html">← Back to Cube3</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="../supabase-client.js"></script>
  <script src="../auth.js"></script>

  <script>
    const form=document.getElementById('signupForm');
    const button=document.getElementById('signupButton');
    const message=document.getElementById('message');
    const creatorRole=document.getElementById('creatorRole');
    const brandRole=document.getElementById('brandRole');

    document.querySelectorAll('input[name="role"]').forEach(input=>{
      input.addEventListener('change',()=>{
        creatorRole.classList.toggle('active',input.value==='creator'&&input.checked);
        brandRole.classList.toggle('active',input.value==='brand'&&input.checked);
      });
    });

    form.addEventListener('submit',async event=>{
      event.preventDefault();
      const fullName=document.getElementById('fullName').value.trim();
      const email=document.getElementById('email').value.trim();
      const password=document.getElementById('password').value;
      const role=document.querySelector('input[name="role"]:checked').value;

      message.textContent='';
      button.disabled=true;
      button.textContent='Creating account...';

      try{
        const result=await Cube3Auth.signUp(email,password,role,fullName);
        message.style.color='#72e6a2';
        message.textContent=result.message||'Account created successfully!';
        if(result.user && result.user.id){
          setTimeout(()=>{window.location.href='../index.html';},1200);
        }else{
          button.disabled=false;
          button.textContent='Create account';
        }
      }catch(error){
        console.error(error);
        message.style.color='#ff8f8f';
        message.textContent=error.message||'Signup failed.';
        button.disabled=false;
        button.textContent='Create account';
      }
    });
  </script>
</body>
</html>
