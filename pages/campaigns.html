<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://zjgtceurzsvjkspkvroz.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaigns - Cube3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .filters{display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; margin:24px 0 30px;}
  @media (max-width:700px){ .filters{grid-template-columns:1fr;} }
  .campaign-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .favorite{background:transparent; border:0; color:var(--ink-faint); font-size:20px; cursor:pointer; line-height:1;}
  .favorite.active{color:#f0b429;}
  .details{border-top:1px solid var(--line); margin-top:12px; padding-top:12px; color:var(--ink-muted); font-size:13px; line-height:1.7;}

  .modal-overlay{position:fixed; inset:0; background:rgba(22,24,38,0.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:1000;}
  .modal-overlay.show{display:flex;}
  .modal{width:100%; max-width:560px; max-height:88vh; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:26px;}
  .modal-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .close-btn{border:0; background:transparent; color:var(--ink-faint); font-size:22px; cursor:pointer;}
</style>
</head>
<body>

<header class="site-header">
  <nav class="wrap">
    <a class="brand" href="/index.html">
      <svg class="mark" viewBox="0 0 24 24" fill="none"><path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" fill="#0284c7"/></svg>
      Cube3
    </a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="campaigns.html" class="active">Campaigns</a>
      <a href="creators.html">Creators</a>
      <a href="inbox.html">Messages</a>
      <a href="profile.html">Profile</a>
      <a href="#" id="logout">Logout</a>
    </div>
  </nav>
</header>

<div class="container">

  <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;">
    <div>
      <h1 style="font-size:30px;">Campaigns</h1>
      <p class="muted">Discover brand opportunities and connect with creators.</p>
    </div>
    <button id="createCampaignButton" class="btn btn-primary" style="display:none;">+ Create campaign</button>
  </div>

  <div class="filters">
    <input id="search" type="search" placeholder="Search campaigns...">
    <select id="categoryFilter">
      <option value="">All categories</option>
      <option>Technology</option><option>Gaming</option><option>Education</option>
      <option>Entertainment</option><option>Business</option><option>Fashion</option>
      <option>Fitness</option><option>Travel</option><option>Food</option>
    </select>
    <select id="platformFilter">
      <option value="">All platforms</option>
      <option>YouTube</option><option>Instagram</option><option>TikTok</option>
      <option>Facebook</option><option>X</option><option>Website</option><option>Other</option>
    </select>
  </div>

  <div id="campaignGrid" class="grid-cards">
    <div class="loading-state">Loading campaigns...</div>
  </div>
</div>

<!-- APPLY MODAL -->
<div id="applyModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2 style="font-size:20px;">Apply to campaign</h2>
      <button class="close-btn" onclick="closeApplyModal()">×</button>
    </div>
    <form id="applicationForm">
      <input type="hidden" id="applicationCampaignId">
      <label for="pitch">Your pitch</label>
      <textarea id="pitch" placeholder="Tell the brand why you're a good fit..." required></textarea>

      <label for="proposedRate">Your rate (₹, optional)</label>
      <input id="proposedRate" type="number" min="0" step="0.01" placeholder="e.g. 15000">

      <label for="portfolioUrl">Portfolio / samples link (optional)</label>
      <input id="portfolioUrl" type="url" placeholder="Link to past work, reel, or portfolio">

      <button class="btn btn-primary btn-block" type="submit" style="margin-top:18px;">Submit application</button>
      <div id="applicationMessage" class="message"></div>
    </form>
  </div>
</div>

<!-- CREATE CAMPAIGN MODAL -->
<div id="createModal" class="modal-overlay">
  <div class="modal" style="max-width:640px;">
    <div class="modal-header">
      <h2 style="font-size:20px;">Create campaign</h2>
      <button class="close-btn" onclick="closeCreateModal()">×</button>
    </div>

    <div style="display:flex; gap:6px; margin:16px 0 22px;">
      <div class="step-dot" data-step="1"></div>
      <div class="step-dot" data-step="2"></div>
      <div class="step-dot" data-step="3"></div>
      <div class="step-dot" data-step="4"></div>
    </div>
    <div id="stepLabel" class="muted" style="font-size:12.5px; margin-bottom:14px; text-transform:uppercase; letter-spacing:.04em; font-weight:600;">Step 1 of 4 — Basics</div>

    <form id="campaignForm">

      <!-- STEP 1: Templates + Basics -->
      <div class="wizard-step" id="wizardStep1">
        <label>Start from a template (optional)</label>
        <div id="templateGrid" style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:18px;"></div>

        <label for="campaignTitle">Campaign title</label>
        <input id="campaignTitle" type="text" placeholder="Example: Promote our new product" required>

        <label for="campaignCategory">Category</label>
        <select id="campaignCategory">
          <option value="Technology">Technology</option><option value="Gaming">Gaming</option>
          <option value="Education">Education</option><option value="Entertainment">Entertainment</option>
          <option value="Business">Business</option><option value="Fashion">Fashion</option>
          <option value="Fitness">Fitness</option><option value="Travel">Travel</option><option value="Food">Food</option>
        </select>

        <label for="campaignPlatform">Platform</label>
        <select id="campaignPlatform">
          <option>YouTube</option><option>Instagram</option><option>TikTok</option>
          <option>Facebook</option><option>X</option><option>Website</option><option>Other</option>
        </select>

        <label for="campaignDescription">Description</label>
        <textarea id="campaignDescription" placeholder="Describe the campaign..." required></textarea>
      </div>

      <!-- STEP 2: Budget & Deliverables -->
      <div class="wizard-step hidden" id="wizardStep2">
        <label for="campaignBudget">Budget (₹)</label>
        <input id="campaignBudget" type="number" min="0" step="0.01" placeholder="50000">

        <label for="campaignRequirements">Deliverables & requirements</label>
        <textarea id="campaignRequirements" placeholder="e.g. '3 Instagram posts, 1 Reel, minimum 10K followers'"></textarea>
      </div>

      <!-- STEP 3: Timeline & Location -->
      <div class="wizard-step hidden" id="wizardStep3">
        <label for="campaignDeadline">Application deadline</label>
        <input id="campaignDeadline" type="date">

        <label for="campaignLocation">Location</label>
        <input id="campaignLocation" type="text" placeholder="India / Remote">
      </div>

      <!-- STEP 4: Review -->
      <div class="wizard-step hidden" id="wizardStep4">
        <div id="reviewSummary" style="background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px; font-size:13.5px; line-height:1.8;"></div>
      </div>

      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="button" id="wizardBack" class="btn btn-ghost hidden" onclick="window.wizardBack()">Back</button>
        <button type="button" id="wizardNext" class="btn btn-primary" style="flex:1;" onclick="window.wizardNext()">Next</button>
        <button type="submit" id="wizardPublish" class="btn btn-primary hidden" style="flex:1;">Publish campaign</button>
      </div>

      <div id="campaignMessage" class="message"></div>
    </form>
  </div>
</div>

<style>
  .step-dot{flex:1; height:4px; border-radius:2px; background:var(--line);}
  .step-dot.active{background:var(--violet);}
  .step-dot.done{background:var(--success-fg);}
  .template-card{border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; cursor:pointer; font-size:12.5px; transition:border-color .15s ease, background .15s ease;}
  .template-card:hover{border-color:var(--violet);}
  .template-card b{display:block; font-size:13px; margin-bottom:2px;}
</style>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="/supabase-client.js"></script>
<script src="/auth.js"></script>

<script>
(function () {
  var supabase = window.cube3Supabase;
  var currentUser = null;
  var currentRole = null;
  var campaigns = [];
  var wizardStep = 1;
  var TOTAL_STEPS = 4;

  var CAMPAIGN_TEMPLATES = [
    { name: "Product Launch", category: "Technology", platform: "Instagram",
      description: "Introduce our new product to your audience with an authentic first-impressions post.",
      requirements: "1 feed post + 2 stories, must show unboxing/first use." },
    { name: "Brand Awareness", category: "Business", platform: "YouTube",
      description: "Help more people discover our brand through genuine storytelling.",
      requirements: "1 dedicated video mention (60-90 seconds) within a regular upload." },
    { name: "App Install Push", category: "Technology", platform: "TikTok",
      description: "Drive installs for our app with a short, engaging demo.",
      requirements: "1 short-form video showing the app in use, link in bio for 7 days." },
    { name: "Event Promotion", category: "Entertainment", platform: "Instagram",
      description: "Spread the word about our upcoming event to your local audience.",
      requirements: "1 story series (min 3 slides) in the week leading up to the event." }
  ];

  function escapeHTML(value) {
    return String(value || "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  async function initialize() {
    try {
      currentUser = await Cube3Auth.requireUser();
      if (!currentUser) return;

      // Profile (for role) and campaigns don't depend on each other,
      // so fetch them at the same time instead of one-after-another.
      var [profileResult] = await Promise.all([
        supabase.from("profiles").select("role, full_name").eq("id", currentUser.id).single(),
        loadCampaigns()
      ]);

      var profile = profileResult.data;
      var error = profileResult.error;
      if (error && error.code !== "PGRST116") throw error;

      currentRole = profile ? profile.role : "creator";

      if (currentRole === "brand") {
        document.getElementById("createCampaignButton").style.display = "inline-flex";
      }

      renderCampaigns();

    } catch (error) {
      console.error(error);
      document.getElementById("campaignGrid").innerHTML = '<div class="empty-state">Could not load campaigns. ' + escapeHTML(error.message) + '</div>';
    }
  }

  async function loadCampaigns() {
    var grid = document.getElementById("campaignGrid");
    grid.innerHTML = '<div class="loading-state">Loading campaigns...</div>';

    var { data, error } = await supabase.from("campaigns").select("*").eq("status", "open").order("created_at", { ascending: false });

    if (error) {
      grid.innerHTML = '<div class="empty-state">' + escapeHTML(error.message) + '</div>';
      return;
    }

    campaigns = data || [];
    renderCampaigns();
  }

  function renderCampaigns() {
    var search = document.getElementById("search").value.toLowerCase().trim();
    var category = document.getElementById("categoryFilter").value;
    var platform = document.getElementById("platformFilter").value;

    var filtered = campaigns.filter(function (c) {
      var matchesSearch = !search ||
        (c.title || "").toLowerCase().includes(search) ||
        (c.description || "").toLowerCase().includes(search) ||
        (c.requirements || "").toLowerCase().includes(search);
      var matchesCategory = !category || c.category === category;
      var matchesPlatform = !platform || c.platform === platform;
      return matchesSearch && matchesCategory && matchesPlatform;
    });

    var grid = document.getElementById("campaignGrid");

    if (!filtered.length) {
      grid.innerHTML = '<div class="empty-state">No campaigns found.</div>';
      return;
    }

    grid.innerHTML = filtered.map(renderCampaign).join("");
    loadFavorites();
  }

  function renderCampaign(campaign) {
    return '' +
      '<div class="card">' +
        '<div class="campaign-top">' +
          '<h3 style="font-size:18px;">' + escapeHTML(campaign.title) + '</h3>' +
          '<button class="favorite" id="favorite-' + campaign.id + '" onclick="toggleFavorite(\'' + campaign.id + '\')" title="Favorite">☆</button>' +
        '</div>' +
        '<p class="muted" style="font-size:13.5px; min-height:50px;">' + escapeHTML(campaign.description || "No description provided.") + '</p>' +
        '<div>' +
          (campaign.category ? '<span class="tag">' + escapeHTML(campaign.category) + '</span>' : "") +
          (campaign.platform ? '<span class="tag">' + escapeHTML(campaign.platform) + '</span>' : "") +
          (campaign.location ? '<span class="tag">' + escapeHTML(campaign.location) + '</span>' : "") +
        '</div>' +
        '<div class="details">' +
          (campaign.budget ? 'Budget: ₹' + Number(campaign.budget).toLocaleString("en-IN") : "Budget: Negotiable") + '<br>' +
          (campaign.deadline ? 'Deadline: ' + escapeHTML(campaign.deadline) : "No deadline") +
          (campaign.requirements ? '<br>' + escapeHTML(campaign.requirements) : "") +
        '</div>' +
        (currentRole === "creator" ? '<button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="openApplyModal(\'' + campaign.id + '\')">Apply now</button>' : '') +
      '</div>';
  }

  async function loadFavorites() {
    if (!currentUser) return;
    var { data, error } = await supabase.from("favorites").select("campaign_id").eq("user_id", currentUser.id).not("campaign_id", "is", null);
    if (error) { console.error(error); return; }

    var favoriteIds = new Set((data || []).map(function (item) { return item.campaign_id; }));
    favoriteIds.forEach(function (id) {
      var button = document.getElementById("favorite-" + id);
      if (button) { button.textContent = "★"; button.classList.add("active"); }
    });
  }

  window.toggleFavorite = async function (campaignId) {
    if (!currentUser) return;
    var { data, error } = await supabase.from("favorites").select("id").eq("user_id", currentUser.id).eq("campaign_id", campaignId).maybeSingle();
    if (error) { console.error(error); return; }

    if (data) {
      await supabase.from("favorites").delete().eq("id", data.id);
    } else {
      await supabase.from("favorites").insert({ user_id: currentUser.id, campaign_id: campaignId });
    }
    await loadFavorites();
  };

  window.openApplyModal = function (campaignId) {
    document.getElementById("applicationCampaignId").value = campaignId;
    document.getElementById("pitch").value = "";
    document.getElementById("proposedRate").value = "";
    document.getElementById("portfolioUrl").value = "";
    document.getElementById("applicationMessage").className = "message";
    document.getElementById("applyModal").classList.add("show");
  };

  window.closeApplyModal = function () {
    document.getElementById("applyModal").classList.remove("show");
  };

  document.getElementById("applicationForm").addEventListener("submit", async function (event) {
    event.preventDefault();
    var campaignId = document.getElementById("applicationCampaignId").value;
    var pitch = document.getElementById("pitch").value.trim();
    var message = document.getElementById("applicationMessage");

    try {
      var { error } = await supabase.from("campaign_applications").insert({
        campaign_id: campaignId,
        creator_id: currentUser.id,
        pitch: pitch,
        proposed_rate: Number(document.getElementById("proposedRate").value) || null,
        portfolio_url: document.getElementById("portfolioUrl").value.trim() || null,
        status: "pending"
      });
      if (error) throw error;

      message.textContent = "Application submitted successfully!";
      message.className = "message success";
      setTimeout(window.closeApplyModal, 1400);

    } catch (error) {
      console.error(error);
      message.textContent = error.message || "Could not submit application.";
      message.className = "message error";
    }
  });

  document.getElementById("createCampaignButton").addEventListener("click", function () {
    document.getElementById("createModal").classList.add("show");
    renderTemplates();
    goToStep(1);
  });

  window.closeCreateModal = function () {
    document.getElementById("createModal").classList.remove("show");
  };

  function renderTemplates() {
    var grid = document.getElementById("templateGrid");
    grid.innerHTML = CAMPAIGN_TEMPLATES.map(function (t, i) {
      return '<div class="template-card" onclick="window.applyTemplate(' + i + ')">' +
        '<b>' + escapeHTML(t.name) + '</b>' + escapeHTML(t.platform) + ' · ' + escapeHTML(t.category) +
        '</div>';
    }).join("");
  }

  window.applyTemplate = function (index) {
    var t = CAMPAIGN_TEMPLATES[index];
    if (!t) return;
    document.getElementById("campaignTitle").value = t.name;
    document.getElementById("campaignCategory").value = t.category;
    document.getElementById("campaignPlatform").value = t.platform;
    document.getElementById("campaignDescription").value = t.description;
    document.getElementById("campaignRequirements").value = t.requirements;
  };

  function goToStep(step) {
    wizardStep = step;

    for (var i = 1; i <= TOTAL_STEPS; i++) {
      var el = document.getElementById("wizardStep" + i);
      if (el) el.classList.toggle("hidden", i !== step);

      var dot = document.querySelector('.step-dot[data-step="' + i + '"]');
      if (dot) {
        dot.classList.toggle("active", i === step);
        dot.classList.toggle("done", i < step);
      }
    }

    var labels = ["", "Basics", "Budget & deliverables", "Timeline & location", "Review & publish"];
    document.getElementById("stepLabel").textContent = "Step " + step + " of " + TOTAL_STEPS + " — " + labels[step];

    document.getElementById("wizardBack").classList.toggle("hidden", step === 1);
    document.getElementById("wizardNext").classList.toggle("hidden", step === TOTAL_STEPS);
    document.getElementById("wizardPublish").classList.toggle("hidden", step !== TOTAL_STEPS);

    if (step === TOTAL_STEPS) renderReview();
  }

  function validateStep(step) {
    if (step === 1) {
      var title = document.getElementById("campaignTitle").value.trim();
      var description = document.getElementById("campaignDescription").value.trim();
      if (!title || !description) {
        alert("Please fill in the campaign title and description before continuing.");
        return false;
      }
    }
    return true;
  }

  window.wizardNext = function () {
    if (!validateStep(wizardStep)) return;
    if (wizardStep < TOTAL_STEPS) goToStep(wizardStep + 1);
  };

  window.wizardBack = function () {
    if (wizardStep > 1) goToStep(wizardStep - 1);
  };

  function renderReview() {
    var budget = document.getElementById("campaignBudget").value;
    var deadline = document.getElementById("campaignDeadline").value;

    document.getElementById("reviewSummary").innerHTML =
      '<strong>' + escapeHTML(document.getElementById("campaignTitle").value) + '</strong><br>' +
      escapeHTML(document.getElementById("campaignCategory").value) + ' · ' + escapeHTML(document.getElementById("campaignPlatform").value) + '<br><br>' +
      escapeHTML(document.getElementById("campaignDescription").value) + '<br><br>' +
      '<strong>Budget:</strong> ' + (budget ? "₹" + Number(budget).toLocaleString("en-IN") : "Not set") + '<br>' +
      '<strong>Deliverables:</strong> ' + (escapeHTML(document.getElementById("campaignRequirements").value) || "Not set") + '<br>' +
      '<strong>Deadline:</strong> ' + (deadline || "Not set") + '<br>' +
      '<strong>Location:</strong> ' + (escapeHTML(document.getElementById("campaignLocation").value) || "Not set");
  }

  document.getElementById("campaignForm").addEventListener("submit", async function (event) {
    event.preventDefault();
    var message = document.getElementById("campaignMessage");

    try {
      var campaign = {
        brand_id: currentUser.id,
        title: document.getElementById("campaignTitle").value.trim(),
        description: document.getElementById("campaignDescription").value.trim(),
        budget: Number(document.getElementById("campaignBudget").value || 0),
        category: document.getElementById("campaignCategory").value,
        platform: document.getElementById("campaignPlatform").value,
        location: document.getElementById("campaignLocation").value.trim(),
        requirements: document.getElementById("campaignRequirements").value.trim(),
        deadline: document.getElementById("campaignDeadline").value || null,
        status: "open"
      };

      var { error } = await supabase.from("campaigns").insert(campaign);
      if (error) throw error;

      message.textContent = "Campaign published successfully!";
      message.className = "message success";
      document.getElementById("campaignForm").reset();
      await loadCampaigns();
      setTimeout(window.closeCreateModal, 1100);

    } catch (error) {
      console.error(error);
      message.textContent = error.message || "Could not create campaign.";
      message.className = "message error";
    }
  });

  document.getElementById("search").addEventListener("input", renderCampaigns);
  document.getElementById("categoryFilter").addEventListener("change", renderCampaigns);
  document.getElementById("platformFilter").addEventListener("change", renderCampaigns);

  document.getElementById("logout").addEventListener("click", async function (event) {
    event.preventDefault();
    await Cube3Auth.signOut();
  });

  initialize();
})();
</script>

</body>
</html>
