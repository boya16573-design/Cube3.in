<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cube3 debug</title>
<link rel="stylesheet" href="/style.css">
<style>
  body{padding:16px;font-family:ui-monospace,monospace;font-size:14px;}
  .row{border:1.5px solid var(--ink,#000);border-radius:4px;padding:12px;margin-bottom:10px;background:#fff;}
  .row h3{font-size:14px;margin:0 0 6px;font-family:ui-monospace,monospace;}
  .ok{color:#127A42;font-weight:700;}
  .bad{color:#BE3423;font-weight:700;}
  pre{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;font-size:12.5px;background:#F4F4F6;padding:8px;border-radius:3px;}
</style>
</head>
<body>

<h2 style="font-family:ui-monospace,monospace">Inbox diagnostic</h2>
<p style="color:#666">Each step runs one of the queries inbox.html uses. The first
red line is the problem. Screenshot this whole page.</p>
<div id="out"></div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="/supabase-client.js"></script>

<script>
var out = document.getElementById("out");
var sb = window.cube3Supabase;

function log(title, ok, detail) {
  var d = document.createElement("div");
  d.className = "row";
  d.innerHTML = "<h3>" + title + " <span class='" + (ok ? "ok" : "bad") + "'>" +
    (ok ? "OK" : "FAILED") + "</span></h3>" +
    (detail ? "<pre>" + String(detail).replace(/</g, "&lt;").slice(0, 900) + "</pre>" : "");
  out.appendChild(d);
}

// Any step that hangs will never log — that itself is the finding.
async function step(title, fn) {
  var timer = setTimeout(function () {
    log(title, false, "TIMED OUT after 8 seconds — this step never finished.");
  }, 8000);
  try {
    var result = await fn();
    clearTimeout(timer);
    log(title, true, result);
    return result;
  } catch (err) {
    clearTimeout(timer);
    log(title, false, (err && err.message) || String(err));
    return null;
  }
}

(async function () {
  if (!window.cube3Supabase) { log("Supabase client", false, "window.cube3Supabase is undefined"); return; }
  log("Supabase client", true, "created");

  var user = await step("1. Get current user", async function () {
    var r = await sb.auth.getUser();
    if (r.error) throw r.error;
    if (!r.data.user) throw new Error("Not signed in. Log in first, then reopen this page.");
    return "user id: " + r.data.user.id + "\nemail: " + r.data.user.email;
  });
  if (!user) return;

  var me = (await sb.auth.getUser()).data.user;

  var role = await step("2. Read my row in profiles (.single())", async function () {
    var r = await sb.from("profiles").select("role, full_name").eq("id", me.id).single();
    if (r.error) throw new Error(r.error.message + "  [code " + r.error.code + "]");
    return JSON.stringify(r.data);
  });

  await step("3. Read campaigns where I'm the brand", async function () {
    var r = await sb.from("campaigns").select("id, title").eq("brand_id", me.id);
    if (r.error) throw new Error(r.error.message);
    return r.data.length + " campaigns";
  });

  await step("4. Read my applications as creator", async function () {
    var r = await sb.from("campaign_applications")
      .select("id, campaign_id, creator_id").eq("creator_id", me.id).eq("status", "accepted");
    if (r.error) throw new Error(r.error.message);
    return r.data.length + " accepted applications";
  });

  // This is the one I most suspect: .in() with an empty array is a 400.
  await step("5. messages .in() with an EMPTY list", async function () {
    var r = await sb.from("messages").select("application_id, body").in("application_id", []);
    if (r.error) throw new Error(r.error.message + "  [code " + r.error.code + "]");
    return "returned " + r.data.length + " rows (empty list is fine)";
  });

  await step("6. Read creator_inquiries (as brand)", async function () {
    var r = await sb.from("creator_inquiries").select("id, creator_id").eq("brand_id", me.id);
    if (r.error) throw new Error(r.error.message);
    return r.data.length + " inquiries";
  });

  await step("7. Read creator_inquiries (as creator)", async function () {
    var r = await sb.from("creator_inquiries").select("id, brand_id").eq("creator_id", me.id);
    if (r.error) throw new Error(r.error.message);
    return r.data.length + " inquiries";
  });

  await step("8. Read messages table", async function () {
    var r = await sb.from("messages").select("id").limit(1);
    if (r.error) throw new Error(r.error.message);
    return r.data.length + " rows readable";
  });

  await step("9. Read inquiry_messages table", async function () {
    var r = await sb.from("inquiry_messages").select("id").limit(1);
    if (r.error) throw new Error(r.error.message);
    return r.data.length + " rows readable";
  });

  var d = document.createElement("p");
  d.textContent = "Done. Screenshot everything above.";
  d.style.fontWeight = "700";
  out.appendChild(d);
})();
</script>
</body>
</html>
