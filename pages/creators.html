<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://zjgtceurzsvjkspkvroz.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creators - Cube3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .filters{display:grid; grid-template-columns:2fr 1fr; gap:12px; margin:24px 0 30px;}
  @media (max-width:600px){ .filters{grid-template-columns:1fr;} }
  .card h3{font-size:16px; margin:0 0 3px;}
  .card .handle{color:var(--ink-muted); font-size:12.5px; margin-bottom:10px;}
  .card .bio{color:var(--ink); font-size:13.5px; line-height:1.5; margin-bottom:10px; min-height:38px;}
  .links{margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;}
  .links a{color:var(--violet-deep); font-size:12px; font-weight:600;}
</style>
</head>
<body>

<header class="site-header">
  <nav class="wrap">
    <a class="brand" href="/index.html">
      <svg class="mark" viewBox="0 0 24 24" fill="none"><path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" fill="#0284c7"/></svg>
      Cube3
    </a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="campaigns.html">Campaigns</a>
      <a href="creators.html" class="active">Creators</a>
      <a href="inbox.html">Messages</a>
      <a href="profile.html">Profile</a>
    </div>
  </nav>
</header>

<div class="container">
  <h1 style="font-size:30px;">Creators</h1>
  <p class="muted">Browse and search the Cube3 creator directory.</p>

  <div class="filters">
    <input id="search" type="search" placeholder="Search by name, handle, or bio...">
    <select id="categoryFilter">
      <option value="">All categories</option>
      <option>Technology</option><option>Gaming</option><option>Education</option>
      <option>Entertainment</option><option>Business</option><option>Fashion</option>
      <option>Fitness</option><option>Travel</option><option>Food</option>
      <option>Content Creator</option><option>Influencer</option><option>Other</option>
    </select>
  </div>

  <div id="grid" class="grid-cards">
    <div class="loading-state">Loading creators...</div>
  </div>
</div>

<!-- CHAT MODAL -->
<div id="chatModal" class="modal-overlay" style="position:fixed; inset:0; background:rgba(15,23,42,0.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:1000;">
  <div style="width:100%; max-width:420px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; display:flex; flex-direction:column; max-height:80vh;">
    <div style="padding:14px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;">
      <strong id="chatWithName" style="font-size:14px;"></strong>
      <button onclick="closeChat()" style="border:0; background:transparent; font-size:20px; cursor:pointer; color:var(--ink-faint);">×</button>
    </div>
    <div id="chatMessages" style="flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; min-height:200px;"></div>
    <div style="display:flex; gap:8px; padding:12px; border-top:1px solid var(--line);">
      <input type="file" id="chatAttachInput" accept="image/*,video/*" hidden onchange="handleChatAttachSelect()">
      <button class="btn btn-ghost" onclick="document.getElementById('chatAttachInput').click()" title="Attach photo/video">📎</button>
      <input id="chatInput" type="text" placeholder="Say hello..." style="flex:1;">
      <button class="btn btn-primary" onclick="sendChatMessage()">Send</button>
    </div>
  </div>
</div>

<style>
  .chat-bubble{max-width:75%; padding:8px 12px; border-radius:12px; font-size:13px; line-height:1.4;}
  .chat-bubble.mine{align-self:flex-end; background:var(--violet); color:#fff; border-bottom-right-radius:4px;}
  .chat-bubble.theirs{align-self:flex-start; background:var(--paper); color:var(--ink); border-bottom-left-radius:4px;}
</style>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="/supabase-client.js"></script>
<script src="/auth.js"></script>

<script>
(function () {
  var supabase = window.cube3Supabase;
  var creators = [];
  var currentUser = null;
  var currentRole = null;
  var activeInquiryId = null;
  var activeChannel = null;

  function escapeHTML(value) {
    return String(value || "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  async function uploadAttachment(file) {
    if (!file) return null;
    var isImage = file.type.startsWith("image/");
    var isVideo = file.type.startsWith("video/");
    if (!isImage && !isVideo) { alert("Only photos and videos can be shared."); return null; }
    if (file.size > 25 * 1024 * 1024) { alert("File must be smaller than 25 MB."); return null; }

    var extension = file.name.split(".").pop();
    var path = currentUser.id + "/" + Date.now() + "." + extension;

    var { error } = await supabase.storage.from("message-attachments").upload(path, file);
    if (error) { alert("Upload failed: " + error.message); return null; }

    var { data } = supabase.storage.from("message-attachments").getPublicUrl(path);
    return { url: data.publicUrl, type: isImage ? "image" : "video" };
  }

  function formatCount(n) {
    if (!n || n <= 0) return "";
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
    return String(n);
  }

  var COUNT_FIELDS = {
    youtube_url: "youtube_subscribers", instagram_url: "instagram_followers", x_url: "x_followers",
    tiktok_url: "tiktok_followers", facebook_url: "facebook_followers", snapchat_url: "snapchat_followers",
    linkedin_url: "linkedin_followers", threads_url: "threads_followers"
  };

  function linkWithCount(c, urlField, label) {
    if (!c[urlField]) return "";
    var countField = COUNT_FIELDS[urlField];
    var count = countField && c[countField] ? formatCount(c[countField]) : "";
    return '<a href="' + escapeHTML(c[urlField]) + '" target="_blank" rel="noopener">' + label + (count ? " · " + count : "") + '</a>';
  }

  async function init() {
    try {
      currentUser = await Cube3Auth.requireUser();
      if (!currentUser) return;

      var { data: profile } = await supabase.from("profiles").select("role").eq("id", currentUser.id).single();
      currentRole = profile ? profile.role : "creator";

      await loadCreators();
    } catch (error) {
      console.error(error);
      document.getElementById("grid").innerHTML = '<div class="empty-state">Could not load creators. ' + escapeHTML(error.message) + '</div>';
    }
  }

  async function loadCreators() {
    var { data: creatorProfiles, error } = await supabase.from("creator_profiles").select("*");
    if (error) throw error;

    var ids = (creatorProfiles || []).map(function (c) { return c.id; });
    var { data: profiles } = await supabase.from("profiles").select("id, full_name, bio, avatar_url").in("id", ids);
    var profileById = {}; (profiles || []).forEach(function (p) { profileById[p.id] = p; });

    creators = (creatorProfiles || []).map(function (c) {
      var p = profileById[c.id];
      return Object.assign({}, c, { fullName: p ? p.full_name : "Unnamed creator", bio: p ? p.bio : "", avatarUrl: p ? p.avatar_url : "" });
    });

    var ids2 = creators.map(function (c) { return c.id; });
    var { data: allReviews } = await supabase.from("reviews").select("reviewee_id, rating").in("reviewee_id", ids2);

    var ratingsById = {};
    (allReviews || []).forEach(function (r) {
      if (!ratingsById[r.reviewee_id]) ratingsById[r.reviewee_id] = [];
      ratingsById[r.reviewee_id].push(r.rating);
    });

    creators.forEach(function (c) {
      var ratings = ratingsById[c.id];
      c.avgRating = ratings && ratings.length ? (ratings.reduce(function (a, b) { return a + b; }, 0) / ratings.length).toFixed(1) : null;
      c.reviewCount = ratings ? ratings.length : 0;
    });

    render();
  }

  function render() {
    var grid = document.getElementById("grid");
    var search = document.getElementById("search").value.toLowerCase().trim();
    var category = document.getElementById("categoryFilter").value;

    var filtered = creators.filter(function (c) {
      var matchesSearch = !search ||
        (c.fullName || "").toLowerCase().includes(search) ||
        (c.handle || "").toLowerCase().includes(search) ||
        (c.bio || "").toLowerCase().includes(search);
      var matchesCategory = !category || c.category === category;
      return matchesSearch && matchesCategory;
    });

    if (!filtered.length) {
      grid.innerHTML = '<div class="empty-state">No creators found.</div>';
      return;
    }

    grid.innerHTML = filtered.map(function (c) {
      var avatarSrc = c.avatarUrl || "https://placehold.co/48x48/e7e6f0/6c5ce7?text=%20";
      return '<div class="card">' +
        '<div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">' +
          '<img src="' + escapeHTML(avatarSrc) + '" alt="" style="width:48px; height:48px; border-radius:50%; object-fit:cover; background:var(--violet-dim); border:1px solid var(--line);">' +
          '<div>' +
            '<h3 style="margin:0;">' + escapeHTML(c.fullName) + (c.avgRating ? ' <span style="color:#0369a1; font-size:12.5px; font-weight:700;">★' + c.avgRating + '</span>' : '') + '</h3>' +
            '<div class="handle" style="margin:0;">' + (c.handle ? "@" + escapeHTML(c.handle.replace(/^@/, "")) : "") + '</div>' +
          '</div>' +
        '</div>' +
        '<p class="bio">' + escapeHTML(c.bio || "No bio yet.") + '</p>' +
        (c.category ? '<span class="tag">' + escapeHTML(c.category) + '</span>' : "") +
        '<div class="links">' +
          linkWithCount(c, "youtube_url", "YouTube") +
          linkWithCount(c, "instagram_url", "Instagram") +
          linkWithCount(c, "x_url", "X") +
          linkWithCount(c, "tiktok_url", "TikTok") +
          linkWithCount(c, "facebook_url", "Facebook") +
          linkWithCount(c, "snapchat_url", "Snapchat") +
          linkWithCount(c, "linkedin_url", "LinkedIn") +
          linkWithCount(c, "threads_url", "Threads") +
          (c.portfolio_url ? '<a href="' + escapeHTML(c.portfolio_url) + '" target="_blank" rel="noopener">Portfolio</a>' : "") +
        '</div>' +
        (currentRole === "brand" ? '<button class="btn btn-primary btn-sm" style="margin-top:12px;" onclick="openChat(\'' + c.id + '\', \'' + escapeHTML(c.fullName).replace(/'/g, "\\'") + '\')">Message</button>' : "") +
      '</div>';
    }).join("");
  }

  document.getElementById("search").addEventListener("input", render);
  document.getElementById("categoryFilter").addEventListener("change", render);

  window.openChat = async function (creatorId, creatorName) {
    document.getElementById("chatWithName").textContent = creatorName;
    document.getElementById("chatMessages").innerHTML = '<div class="muted" style="font-size:12.5px;">Loading...</div>';
    document.getElementById("chatModal").style.display = "flex";

    try {
      var { data: existing } = await supabase.from("creator_inquiries").select("id").eq("brand_id", currentUser.id).eq("creator_id", creatorId).maybeSingle();

      if (existing) {
        activeInquiryId = existing.id;
      } else {
        var { data: created, error } = await supabase.from("creator_inquiries").insert({ brand_id: currentUser.id, creator_id: creatorId }).select("id").single();
        if (error) throw error;
        activeInquiryId = created.id;
      }

      await loadChatMessages();
      subscribeToChat();

    } catch (error) {
      console.error(error);
      document.getElementById("chatMessages").innerHTML = '<div class="empty-state">Could not open chat. ' + escapeHTML(error.message) + '</div>';
    }
  };

  window.closeChat = function () {
    document.getElementById("chatModal").style.display = "none";
    if (activeChannel) { supabase.removeChannel(activeChannel); activeChannel = null; }
    activeInquiryId = null;
  };

  async function loadChatMessages() {
    var box = document.getElementById("chatMessages");
    var { data, error } = await supabase.from("inquiry_messages").select("id, sender_id, body, attachment_url, attachment_type").eq("inquiry_id", activeInquiryId).order("created_at", { ascending: true });

    if (error) { box.innerHTML = '<div class="empty-state">Could not load messages.</div>'; return; }

    if (!data.length) {
      box.innerHTML = '<div class="muted" style="font-size:12.5px; text-align:center;">Say hello to start the conversation.</div>';
      return;
    }

    box.innerHTML = data.map(function (m) {
      var mine = m.sender_id === currentUser.id;
      var media = "";
      if (m.attachment_url) {
        media = m.attachment_type === "video"
          ? '<video src="' + escapeHTML(m.attachment_url) + '" controls style="max-width:200px; border-radius:10px; display:block; margin-bottom:' + (m.body ? '6px' : '0') + ';"></video>'
          : '<img src="' + escapeHTML(m.attachment_url) + '" alt="" style="max-width:200px; border-radius:10px; display:block; margin-bottom:' + (m.body ? '6px' : '0') + '; cursor:pointer;" onclick="window.open(this.src, \'_blank\')">';
      }
      return '<div class="chat-bubble ' + (mine ? "mine" : "theirs") + '">' + media + (m.body ? escapeHTML(m.body) : "") + '</div>';
    }).join("");
    box.scrollTop = box.scrollHeight;
  }

  function subscribeToChat() {
    if (activeChannel) { supabase.removeChannel(activeChannel); activeChannel = null; }
    activeChannel = supabase
      .channel("inquiry-" + activeInquiryId)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "inquiry_messages", filter: "inquiry_id=eq." + activeInquiryId }, function () {
        loadChatMessages();
      })
      .subscribe();
  }

  var pendingChatAttachment = null;

  window.handleChatAttachSelect = async function () {
    var fileInput = document.getElementById("chatAttachInput");
    var file = fileInput.files[0];
    fileInput.value = "";
    if (!file) return;

    var chatInput = document.getElementById("chatInput");
    chatInput.placeholder = "Uploading...";
    var result = await uploadAttachment(file);
    chatInput.placeholder = "Say hello...";
    if (!result) return;

    pendingChatAttachment = result;
    chatInput.placeholder = "Attachment ready — add a caption or just Send";
  };

  window.sendChatMessage = async function () {
    var input = document.getElementById("chatInput");
    var body = input.value.trim();
    if (!body && !pendingChatAttachment) return;
    if (!activeInquiryId) return;

    input.value = "";
    input.placeholder = "Say hello...";

    try {
      var payload = { inquiry_id: activeInquiryId, sender_id: currentUser.id, body: body };
      if (pendingChatAttachment) {
        payload.attachment_url = pendingChatAttachment.url;
        payload.attachment_type = pendingChatAttachment.type;
      }
      var { error } = await supabase.from("inquiry_messages").insert(payload);
      if (error) throw error;
      pendingChatAttachment = null;
      await loadChatMessages();
    } catch (error) {
      console.error(error);
      alert(error.message || "Could not send message.");
    }
  };

  document.getElementById("chatInput") && document.getElementById("chatInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") window.sendChatMessage();
  });

  init();
})();
</script>

</body>
</html>
