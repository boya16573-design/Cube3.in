<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator — Cube3</title>
<link rel="preconnect" href="https://zjgtceurzsvjkspkvroz.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .profile-head{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
  .profile-head img.pic{width:96px;height:96px;border-radius:4px;object-fit:cover;border:1.5px solid var(--ink);background:var(--panel-2);}
  .profile-head .who{flex:1;min-width:220px;}
  .profile-head h1{font-size:clamp(24px,5vw,32px);margin-bottom:4px;}
  .handle{color:var(--ink-muted);font-family:"DM Mono",monospace;font-size:13px;}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
  .bio{margin-top:16px;font-size:16px;max-width:60ch;}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
  .links a{font-size:13px;font-weight:600;border-bottom:2px solid var(--accent);}
  .facts{margin-top:26px;}
  .backlink{display:inline-block;margin-bottom:18px;font-size:14px;color:var(--ink-muted);}
  .backlink:hover{color:var(--ink);}
</style>
</head>
<body data-nav="app">

<div class="container">
  <a class="backlink" href="/pages/creators.html">← All creators</a>
  <div id="content">
    <div class="skeleton"><div class="bar mid"></div><div class="bar"></div><div class="bar short"></div></div>
  </div>
</div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="/supabase-client.js"></script>
<script src="/auth.js"></script>
<script src="/messaging.js"></script>
<script>
(function () {
  "use strict";
  var sb = window.cube3Supabase;
  var content = document.getElementById("content");

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  function link(url, label) {
    if (!url) return "";
    return '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + label + "</a>";
  }

  function fail(msg) {
    content.innerHTML = '<div class="empty-state"><strong>' + esc(msg) + "</strong>" +
      '<div style="margin-top:14px"><a class="btn btn-ghost btn-sm" href="/pages/creators.html">Back to creators</a></div></div>';
  }

  async function init() {
    var id = new URLSearchParams(location.search).get("id");
    if (!id) return fail("No creator specified.");

    var me = await window.Cube3Auth.requireUser();
    if (!me) return;

    var myProfile = await sb.from("profiles").select("role").eq("id", me.id).single();
    var iAmBrand = myProfile.data && myProfile.data.role === "brand";
    var isMe = me.id === id;

    var res = await sb.from("profiles")
      .select("id, full_name, bio, avatar_url, role")
      .eq("id", id)
      .maybeSingle();

    if (res.error) return fail("Could not load this profile.");
    if (!res.data) return fail("That creator profile doesn't exist.");
    var p = res.data;

    var cp = await sb.from("creator_profiles").select("*").eq("id", id).maybeSingle();
    var c = cp.data || {};

    var tags = [];
    if (c.category) tags.push(c.category);
    if (c.location) tags.push(c.location);
    if (c.engagement_rate) tags.push(c.engagement_rate + "% engagement");
    if (c.rate_min || c.rate_max) {
      tags.push("₹" + (c.rate_min ? Number(c.rate_min).toLocaleString("en-IN") : "?") +
                (c.rate_max ? "–₹" + Number(c.rate_max).toLocaleString("en-IN") : ""));
    }

    var action = "";
    if (isMe) {
      action = '<a class="btn btn-ghost" href="/pages/profile.html">Edit your profile</a>';
    } else if (iAmBrand) {
      action = '<button class="btn btn-primary" id="messageBtn" data-message="' + esc(p.id) + '">Message</button>';
    } else {
      action = '<span class="muted" style="font-size:14px">Sign in with a brand account to message creators.</span>';
    }

    content.innerHTML =
      '<div class="profile-head">' +
        '<img class="pic" src="' + esc(p.avatar_url || "https://placehold.co/96x96/f1f0f4/918ca0?text=%20") + '" alt="">' +
        '<div class="who">' +
          "<h1>" + esc(p.full_name || "Unnamed creator") + "</h1>" +
          '<div class="handle">' + (c.handle ? "@" + esc(String(c.handle).replace(/^@/, "")) : "&nbsp;") + "</div>" +
          '<div class="actions">' + action + "</div>" +
        "</div>" +
      "</div>" +
      '<p class="bio">' + esc(p.bio || "This creator hasn't written a bio yet.") + "</p>" +
      '<div class="facts">' + tags.map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") + "</div>" +
      '<div class="links">' +
        link(c.instagram_url, "Instagram") + link(c.youtube_url, "YouTube") +
        link(c.x_url, "X") + link(c.tiktok_url, "TikTok") +
        link(c.portfolio_url, "Portfolio") +
      "</div>";
  }

  // One handler for the Message button here and on creators.html.
  document.addEventListener("click", async function (e) {
    var btn = e.target.closest("[data-message]");
    if (!btn) return;
    var original = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Opening…";
    try {
      var thread = await window.Cube3Chat.startInquiry(btn.dataset.message);
      location.href = "/pages/inbox.html?inquiry=" + thread.id;
    } catch (err) {
      alert(err.message || "Could not start the conversation.");
      btn.disabled = false;
      btn.textContent = original;
    }
  });

  init().catch(function (e) { console.error(e); fail("Something went wrong loading this profile."); });
})();
</script>

<script src="/layout.js"></script>
</body>
</html>
