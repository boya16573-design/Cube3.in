<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creators — Cube3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 6px;}
  .toolbar input,.toolbar select{width:auto;flex:1;min-width:150px;}
  .count{font-family:"DM Mono",monospace;font-size:12px;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.06em;margin:14px 0;}
  .c-card{display:flex;flex-direction:column;gap:10px;}
  .c-card .top{display:flex;gap:12px;align-items:center;}
  .c-card .top img{width:46px;height:46px;border-radius:50%;object-fit:cover;
    border:1.5px solid var(--ink);background:var(--panel-2);}
  .c-card .bio{font-size:14px;color:var(--ink-muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .c-card .acts{display:flex;gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);}
  .c-card .acts .btn{flex:1;}
</style>
</head>
<body data-nav="app">

<div class="container">
  <h1>Creators</h1>
  <p class="muted">Search the Cube3 creator directory.</p>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Name, handle, or bio">
    <select id="category"><option value="">All categories</option></select>
  </div>

  <div class="count" id="count"></div>
  <div class="grid-cards" id="grid"></div>
</div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="/supabase-client.js"></script>
<script src="/auth.js"></script>
<script src="/cube3.js"></script>
<script src="/messaging.js"></script>

<script>
(async function () {
  var grid = document.getElementById("grid");
  var all = [];
  var isBrand = false;

  C3.skeleton(grid, 4);

  try {
    var self = await C3.me();
    isBrand = self.role === "brand";

    var creators = await C3.q("Loading creators",
      C3.sb.from("creator_profiles")
        .select("id, handle, category, location, instagram_url, youtube_url, portfolio_url")) || [];

    if (!creators.length) {
      document.getElementById("count").textContent = "";
      return C3.empty(grid, "No creators yet",
        "Creator profiles will appear here once people sign up.");
    }

    var people = await C3.q("Loading names",
      C3.sb.from("profiles").select("id, full_name, bio, avatar_url")
        .in("id", creators.map(function (c) { return c.id; }))) || [];

    var byId = {};
    people.forEach(function (p) { byId[p.id] = p; });

    all = creators.map(function (c) {
      var p = byId[c.id] || {};
      return Object.assign({}, c, {
        name: p.full_name || "Unnamed creator",
        bio: p.bio || "",
        avatar: p.avatar_url || ""
      });
    });

    // Category list built from what actually exists, not a hardcoded list.
    var cats = Array.from(new Set(all.map(function (c) { return c.category; }).filter(Boolean))).sort();
    var sel = document.getElementById("category");
    cats.forEach(function (cat) {
      var o = document.createElement("option");
      o.value = cat; o.textContent = cat;
      sel.appendChild(o);
    });

    document.getElementById("search").addEventListener("input", render);
    sel.addEventListener("change", render);
    render();

  } catch (err) {
    C3.fail(grid, err);
  }

  function render() {
    var term = document.getElementById("search").value.toLowerCase().trim();
    var cat = document.getElementById("category").value;

    var rows = all.filter(function (c) {
      if (cat && c.category !== cat) return false;
      if (!term) return true;
      return (c.name + " " + (c.handle || "") + " " + c.bio).toLowerCase().indexOf(term) !== -1;
    });

    document.getElementById("count").textContent =
      rows.length + (rows.length === 1 ? " creator" : " creators");

    if (!rows.length) {
      return C3.empty(grid, "No matches", "Try a different search or clear the category filter.");
    }

    grid.innerHTML = rows.map(function (c) {
      var href = "/pages/creator.html?id=" + encodeURIComponent(c.id);
      var pic = c.avatar
        ? '<img src="' + C3.esc(c.avatar) + '" alt="">'
        : '<div class="avatar" style="width:46px;height:46px;border-radius:50%">' + C3.esc(C3.initials(c.name)) + "</div>";

      return '<article class="card c-card">' +
        '<div class="top">' + pic +
          "<div><h3>" + C3.esc(c.name) + "</h3>" +
          '<div class="muted" style="font-size:13px">' +
            (c.handle ? "@" + C3.esc(String(c.handle).replace(/^@/, "")) : "") +
            (c.location ? " · " + C3.esc(c.location) : "") +
          "</div></div>" +
        "</div>" +
        (c.bio ? '<p class="bio">' + C3.esc(c.bio) + "</p>" : "") +
        (c.category ? '<div><span class="tag">' + C3.esc(c.category) + "</span></div>" : "") +
        '<div class="acts">' +
          '<a class="btn btn-ghost btn-sm" href="' + href + '">View profile</a>' +
          (isBrand ? '<button class="btn btn-primary btn-sm" data-message="' + C3.esc(c.id) + '">Message</button>' : "") +
        "</div>" +
      "</article>";
    }).join("");
  }

  document.addEventListener("click", async function (e) {
    var btn = e.target.closest("[data-message]");
    if (!btn) return;
    var label = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Opening…";
    try {
      var thread = await window.Cube3Chat.startInquiry(btn.dataset.message);
      location.href = "/pages/inbox.html?inquiry=" + thread.id;
    } catch (err) {
      alert(err.message || "Could not start the conversation.");
      btn.disabled = false;
      btn.textContent = label;
    }
  });
})();
</script>

<script src="/layout.js"></script>
</body>
</html>
