<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://zjgtceurzsvjkspkvroz.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password - Cube3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
  <style>
    body { margin: 0; background: #08080d; color: #fff; font-family: Arial, sans-serif; }
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth-card { width: 100%; max-width: 460px; background: #11121a; border: 1px solid #292b38; border-radius: 20px; padding: 32px; box-sizing: border-box; }
    .logo { font-size: 28px; font-weight: 800; margin-bottom: 30px; }
    .logo span { color: #9b7cff; }
    h1 { margin-bottom: 8px; font-size: 28px; }
    .subtitle { color: #999baa; margin-bottom: 28px; font-size: 14px; }
    label { display: block; margin: 18px 0 8px; color: #d7d8df; font-size: 14px; }
    input { width: 100%; box-sizing: border-box; padding: 14px 15px; border-radius: 10px; border: 1px solid #303241; background: #0b0c12; color: white; font-size: 15px; outline: none; }
    input:focus { border-color: #9878ff; }
    button { width: 100%; margin-top: 24px; padding: 15px; border: 0; border-radius: 10px; background: #9274ff; color: white; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:hover { background: #a48aff; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .message { margin-top: 18px; padding: 12px; border-radius: 9px; display: none; font-size: 14px; }
    .success { display: block; background: #12351f; color: #7ff0a0; }
    .error { display: block; background: #39171b; color: #ff9ca5; }
    .login-link { text-align: center; margin-top: 22px; color: #999baa; }
    a { color: #a78bfa; text-decoration: none; }
  </style>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="logo">Cube<span>3</span></div>
    <h1>Reset your password</h1>
    <div class="subtitle">Enter your email and we'll send you a link to reset it.</div>

    <form id="resetForm">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required>
      <button id="resetButton" type="submit">Send reset link</button>
    </form>

    <div id="message" class="message"></div>

    <div class="login-link">
      Remembered it? <a href="login.html">Log in</a>
    </div>
  </div>
</div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="/supabase-client.js"></script>

<script>
  const supabase = window.cube3Supabase;
  const form = document.getElementById("resetForm");
  const button = document.getElementById("resetButton");
  const message = document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  form.addEventListener("submit", async function(event) {
    event.preventDefault();
    const email = document.getElementById("email").value.trim();

    button.disabled = true;
    button.textContent = "Sending...";

    try {
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/pages/update-password.html"
      });

      if (error) throw error;

      showMessage("Check your email for a password reset link.", "success");

    } catch (error) {
      console.error(error);
      showMessage(error.message || "Could not send reset email.", "error");
    } finally {
      button.disabled = false;
      button.textContent = "Send reset link";
    }
  });
</script>

</body>
</html>
