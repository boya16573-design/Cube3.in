<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Cube3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .chat{display:grid;grid-template-columns:290px 1fr;gap:14px;
    height:calc(100vh - 58px - 40px);max-width:1180px;margin:20px auto;padding:0 20px;}
  .pane{background:var(--panel);border:1.5px solid var(--ink);border-radius:var(--radius-md);
    display:flex;flex-direction:column;overflow:hidden;min-height:0;}
  .pane h2{font-size:14px;padding:14px 16px;border-bottom:1px solid var(--line);
    font-family:"DM Mono",monospace;font-weight:400;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);}
  #threads{overflow-y:auto;flex:1;}
  .thread{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;
    display:flex;gap:11px;align-items:center;transition:background .12s;}
  .thread:hover{background:var(--panel-2);}
  .thread[aria-current="true"]{background:var(--panel-2);border-left:3px solid var(--accent);padding-left:13px;}
  .thread .n{font-weight:600;font-size:14.5px;}
  .thread .p{font-size:12.5px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .thread .meta{flex:1;min-width:0;}

  #messages{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px;}
  .bubble{max-width:75%;padding:10px 13px;border-radius:var(--radius-md);
    border:1.5px solid var(--ink);font-size:15px;line-height:1.45;word-break:break-word;}
  .bubble.mine{align-self:flex-end;background:var(--ink);color:#fff;}
  .bubble.theirs{align-self:flex-start;background:var(--panel-2);}
  .bubble .t{display:block;font-family:"DM Mono",monospace;font-size:10.5px;
    opacity:.6;margin-top:5px;}

  .composer{display:flex;gap:8px;padding:12px;border-top:1.5px solid var(--ink);align-items:center;}
  .composer input[type=text]{flex:1;}
  .pending{padding:8px 12px;font-size:13px;background:var(--panel-2);
    border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;}

  .back{display:none;}
  @media (max-width:780px){
    .chat{grid-template-columns:1fr;height:auto;padding:0 12px;}
    .pane.convo{display:none;}
    body.viewing .pane.convo{display:flex;height:calc(100vh - 130px);}
    body.viewing .pane.list{display:none;}
    .back{display:inline-flex;}
  }
</style>
</head>
<body data-nav="app">

<div class="chat">
  <div class="pane list">
    <h2>Conversations</h2>
    <div id="threads"></div>
  </div>

  <div class="pane convo">
    <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)">
      <button class="btn btn-ghost btn-sm back" onclick="document.body.classList.remove('viewing')">← Back</button>
      <strong id="convoTitle" style="font-family:Archivo,sans-serif">Select a conversation</strong>
    </div>
    <div id="messages"><div class="empty-state" style="border:0">Pick a conversation on the left.</div></div>
    <div id="pendingBar"></div>
    <div class="composer" id="composer" style="display:none">
      <input type="file" id="file" hidden>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('file').click()" title="Attach a file">📎</button>
      <input type="text" id="body" placeholder="Type a message" maxlength="2000">
      <button class="btn btn-primary btn-sm" id="send">Send</button>
    </div>
  </div>
</div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="/supabase-client.js"></script>
<script src="/auth.js"></script>
<script src="/cube3.js"></script>
<script src="/messaging.js"></script>

<script>
(async function () {
  var threadsEl = document.getElementById("threads");
  var msgsEl = document.getElementById("messages");
  var self, active = null, channel = null, pendingFile = null;

  C3.skeleton(threadsEl, 3);

  try {
    self = await C3.me();
    await loadThreads();
  } catch (err) {
    C3.fail(threadsEl, err);
    return;
  }

  async function loadThreads() {
    var threads = [];

    // Direct inquiries — the column depends on which side you're on.
    var col = self.role === "brand" ? "brand_id" : "creator_id";
    var other = self.role === "brand" ? "creator_id" : "brand_id";

    var inquiries = await C3.q("Loading conversations",
      C3.sb.from("creator_inquiries").select("id, brand_id, creator_id").eq(col, self.id)) || [];

    inquiries.forEach(function (i) {
      threads.push({ kind: "inquiry", id: i.id, otherId: i[other] });
    });

    // Accepted campaign applications
    if (self.role === "brand") {
      var mine = await C3.q("Loading your campaigns",
        C3.sb.from("campaigns").select("id, title").eq("brand_id", self.id)) || [];
      if (mine.length) {
        var byId = {}; mine.forEach(function (c) { byId[c.id] = c.title; });
        var apps = await C3.q("Loading accepted pitches",
          C3.sb.from("campaign_applications").select("id, campaign_id, creator_id")
            .in("campaign_id", mine.map(function (c) { return c.id; }))
            .eq("status", "accepted")) || [];
        apps.forEach(function (a) {
          threads.push({ kind: "campaign", id: a.id, otherId: a.creator_id, note: byId[a.campaign_id] });
        });
      }
    } else {
      var apps2 = await C3.q("Loading your accepted pitches",
        C3.sb.from("campaign_applications").select("id, campaign_id")
          .eq("creator_id", self.id).eq("status", "accepted")) || [];
      if (apps2.length) {
        var cs = await C3.q("Loading campaigns",
          C3.sb.from("campaigns").select("id, title, brand_id")
            .in("id", apps2.map(function (a) { return a.campaign_id; }))) || [];
        var cById = {}; cs.forEach(function (c) { cById[c.id] = c; });
        apps2.forEach(function (a) {
          var c = cById[a.campaign_id];
          if (c) threads.push({ kind: "campaign", id: a.id, otherId: c.brand_id, note: c.title });
        });
      }
    }

    if (!threads.length) {
      return C3.empty(threadsEl, "No conversations yet",
        self.role === "brand"
          ? "Message a creator from the directory to start one."
          : "A chat opens when a brand accepts your pitch, or messages you directly.",
        self.role === "brand" ? "/pages/creators.html" : "/pages/campaigns.html",
        self.role === "brand" ? "Browse creators" : "Browse campaigns");
    }

    var ids = Array.from(new Set(threads.map(function (t) { return t.otherId; }).filter(Boolean)));
    var people = ids.length ? await C3.q("Loading names",
      C3.sb.from("profiles").select("id, full_name").in("id", ids)) || [] : [];
    var nameById = {}; people.forEach(function (p) { nameById[p.id] = p.full_name; });

    threadsEl.innerHTML = threads.map(function (t) {
      var name = nameById[t.otherId] || "Cube3 user";
      return '<div class="thread" data-kind="' + t.kind + '" data-id="' + C3.esc(t.id) + '" data-name="' + C3.esc(name) + '">' +
        '<div class="avatar">' + C3.esc(C3.initials(name)) + "</div>" +
        '<div class="meta"><div class="n">' + C3.esc(name) + "</div>" +
        '<div class="p">' + C3.esc(t.note || "Direct message") + "</div></div>" +
      "</div>";
    }).join("");

    threadsEl.querySelectorAll(".thread").forEach(function (el) {
      el.addEventListener("click", function () {
        open(el.dataset.kind, el.dataset.id, el.dataset.name, el);
      });
    });

    // Arrive from a Message button with the thread already chosen.
    var wanted = new URLSearchParams(location.search).get("inquiry");
    if (wanted) {
      var match = threadsEl.querySelector('.thread[data-id="' + wanted + '"]');
      if (match) match.click();
    }
  }

  function table(kind) { return kind === "inquiry" ? "inquiry_messages" : "messages"; }
  function key(kind) { return kind === "inquiry" ? "inquiry_id" : "application_id"; }

  async function open(kind, id, name, el) {
    active = { kind: kind, id: id };
    document.body.classList.add("viewing");
    document.getElementById("convoTitle").textContent = name;
    document.getElementById("composer").style.display = "flex";

    threadsEl.querySelectorAll(".thread").forEach(function (t) { t.removeAttribute("aria-current"); });
    if (el) el.setAttribute("aria-current", "true");

    msgsEl.innerHTML = '<div class="loading-state" style="border:0">Loading messages…</div>';

    try {
      await draw();
      if (channel) C3.sb.removeChannel(channel);
      channel = C3.sb.channel("thread-" + id)
        .on("postgres_changes",
          { event: "INSERT", schema: "public", table: table(kind), filter: key(kind) + "=eq." + id },
          draw)
        .subscribe();
    } catch (err) {
      C3.fail(msgsEl, err);
    }
  }

  async function draw() {
    var rows = await C3.q("Loading messages",
      C3.sb.from(table(active.kind))
        .select("id, sender_id, body, attachment_path, attachment_type, attachment_name, attachment_size, created_at")
        .eq(key(active.kind), active.id)
        .order("created_at", { ascending: true })) || [];

    if (!rows.length) {
      msgsEl.innerHTML = '<div class="empty-state" style="border:0">No messages yet. Say hello.</div>';
      return;
    }

    msgsEl.innerHTML = rows.map(function (m) {
      var mine = m.sender_id === self.id;
      var media = (window.Cube3Chat && m.attachment_path) ? window.Cube3Chat.renderAttachment(m) : "";
      return '<div class="bubble ' + (mine ? "mine" : "theirs") + '">' +
        media + (m.body ? C3.esc(m.body) : "") +
        '<span class="t">' + C3.esc(C3.when(m.created_at)) + "</span></div>";
    }).join("");
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  document.getElementById("file").addEventListener("change", function (e) {
    pendingFile = e.target.files[0] || null;
    document.getElementById("pendingBar").innerHTML = pendingFile
      ? '<div class="pending"><span>' + C3.esc(pendingFile.name) + " (" +
        C3.esc(window.Cube3Chat.humanSize(pendingFile.size)) + ')</span>' +
        '<button class="btn btn-ghost btn-sm" id="drop">Remove</button></div>'
      : "";
    var drop = document.getElementById("drop");
    if (drop) drop.addEventListener("click", clearFile);
  });

  function clearFile() {
    pendingFile = null;
    document.getElementById("file").value = "";
    document.getElementById("pendingBar").innerHTML = "";
  }

  async function send() {
    if (!active) return;
    var input = document.getElementById("body");
    var text = input.value.trim();
    if (!text && !pendingFile) return;

    var btn = document.getElementById("send");
    btn.disabled = true;
    btn.textContent = "Sending…";

    try {
      var row = { sender_id: self.id, body: text || null };
      row[key(active.kind)] = active.id;

      if (pendingFile) {
        var up = await window.Cube3Chat.uploadAttachment(active.id, pendingFile);
        row.attachment_path = up.path;
        row.attachment_type = up.type;
        row.attachment_name = up.name;
        row.attachment_size = up.size;
      }

      await C3.q("Sending message", C3.sb.from(table(active.kind)).insert(row));

      input.value = "";
      clearFile();
      await draw();
    } catch (err) {
      alert(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Send";
    }
  }

  document.getElementById("send").addEventListener("click", send);
  document.getElementById("body").addEventListener("keydown", function (e) {
    if (e.key === "Enter") send();
  });
})();
</script>

<script src="/layout.js"></script>
</body>
</html>
