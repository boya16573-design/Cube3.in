<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://zjgtceurzsvjkspkvroz.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applications - Cube3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .campaign-group{margin-top:24px;}
  .campaign-group h2{font-size:19px; margin-bottom:4px;}
  .campaign-group .count{color:var(--violet-deep); font-size:12.5px; font-weight:600; margin-bottom:14px;}
  .application{border-top:1px solid var(--line); padding:16px 0; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .application:first-of-type{border-top:0; padding-top:0;}
  .applicant h3{font-size:16px; margin:0 0 3px;}
  .applicant .handle{color:var(--ink-muted); font-size:12.5px; margin-bottom:8px;}
  .pitch{color:var(--ink); font-size:13.5px; line-height:1.5; max-width:500px;}
  .actions{display:flex; gap:8px; align-items:flex-start;}
  .actions button{padding:8px 14px; font-size:13px;}
  .accept-btn{background:var(--success-bg); color:var(--success-fg); border:0; border-radius:8px; font-weight:700; cursor:pointer;}
  .reject-btn{background:var(--error-bg); color:var(--error-fg); border:0; border-radius:8px; font-weight:700; cursor:pointer;}
</style>
</head>
<body>

<header class="site-header">
  <nav class="wrap">
    <a class="brand" href="/index.html">
      <svg class="mark" viewBox="0 0 24 24" fill="none"><path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" fill="#0284c7"/></svg>
      Cube3
    </a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="campaigns.html">Campaigns</a>
      <a href="creators.html">Creators</a>
      <a href="applications.html" class="active">Applications</a>
      <a href="inbox.html">Messages</a>
      <a href="profile.html">Profile</a>
    </div>
  </nav>
</header>

<div class="container">
  <h1 style="font-size:30px;">Applications</h1>
  <p class="muted">Creators who applied to your campaigns.</p>

  <div id="content">
    <div class="loading-state">Loading applications...</div>
  </div>
</div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="/supabase-client.js"></script>
<script src="/auth.js"></script>

<script>
(function () {
  var supabase = window.cube3Supabase;
  var currentUser = null;

  function escapeHTML(value) {
    return String(value || "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  async function init() {
    var content = document.getElementById("content");
    try {
      currentUser = await Cube3Auth.requireUser();
      if (!currentUser) return;

      var { data: profile, error } = await supabase.from("profiles").select("role").eq("id", currentUser.id).single();
      if (error && error.code !== "PGRST116") throw error;

      if (!profile || profile.role !== "brand") {
        content.innerHTML = '<div class="empty-state">This page is for brands. Head back to your <a href="dashboard.html" style="color:var(--violet);">dashboard</a>.</div>';
        return;
      }

      await loadApplications();

    } catch (error) {
      console.error(error);
      content.innerHTML = '<div class="empty-state">Could not load applications. ' + escapeHTML(error.message) + '</div>';
    }
  }

  async function loadApplications() {
    var content = document.getElementById("content");

    var { data: campaignList, error: campaignsError } = await supabase.from("campaigns").select("id, title").eq("brand_id", currentUser.id).order("created_at", { ascending: false });
    if (campaignsError) throw campaignsError;

    if (!campaignList.length) {
      content.innerHTML = '<div class="empty-state">You haven\'t posted any campaigns yet. <a href="campaigns.html" style="color:var(--violet);">Create one</a> to start receiving applications.</div>';
      return;
    }

    var campaignIds = campaignList.map(function (c) { return c.id; });

    var { data: applications, error: appsError } = await supabase.from("campaign_applications").select("id, campaign_id, creator_id, pitch, status, created_at").in("campaign_id", campaignIds).order("created_at", { ascending: false });
    if (appsError) throw appsError;

    if (!applications.length) {
      content.innerHTML = '<div class="empty-state">No applications yet. Check back soon.</div>';
      return;
    }

    var creatorIds = Array.from(new Set(applications.map(function (a) { return a.creator_id; })));

    var { data: profiles } = await supabase.from("profiles").select("id, full_name").in("id", creatorIds);
    var { data: creatorProfiles } = await supabase.from("creator_profiles").select("id, handle, category").in("id", creatorIds);

    var nameById = {}; (profiles || []).forEach(function (p) { nameById[p.id] = p.full_name; });
    var creatorById = {}; (creatorProfiles || []).forEach(function (c) { creatorById[c.id] = c; });

    var html = campaignList.map(function (campaign) {
      var apps = applications.filter(function (a) { return a.campaign_id === campaign.id; });
      if (!apps.length) return "";
      return '<div class="card campaign-group">' +
        '<h2>' + escapeHTML(campaign.title) + '</h2>' +
        '<div class="count">' + apps.length + ' application' + (apps.length === 1 ? "" : "s") + '</div>' +
        apps.map(function (app) { return renderApplication(app, nameById, creatorById); }).join("") +
      '</div>';
    }).join("");

    content.innerHTML = html.trim() || '<div class="empty-state">No applications yet. Check back soon.</div>';
  }

  function renderApplication(app, nameById, creatorById) {
    var name = nameById[app.creator_id] || "Unknown creator";
    var creator = creatorById[app.creator_id];
    var handle = creator && creator.handle ? "@" + creator.handle.replace(/^@/, "") : "";
    var category = creator && creator.category ? creator.category : "";

    return '<div class="application" id="app-' + app.id + '">' +
      '<div class="applicant">' +
        '<span class="status-badge ' + app.status + '">' + escapeHTML(app.status) + '</span>' +
        '<h3>' + escapeHTML(name) + '</h3>' +
        '<div class="handle">' + escapeHTML(handle) + (handle && category ? " · " : "") + escapeHTML(category) + '</div>' +
        '<p class="pitch">' + escapeHTML(app.pitch) + '</p>' +
      '</div>' +
      '<div class="actions">' +
        (app.status === "pending" ?
          '<button class="accept-btn" onclick="updateStatus(\'' + app.id + '\', \'accepted\')">Accept</button>' +
          '<button class="reject-btn" onclick="updateStatus(\'' + app.id + '\', \'rejected\')">Reject</button>'
          : "") +
      '</div>' +
    '</div>';
  }

  window.updateStatus = async function (applicationId, status) {
    try {
      var { error } = await supabase.from("campaign_applications").update({ status: status }).eq("id", applicationId);
      if (error) throw error;
      await loadApplications();
    } catch (error) {
      console.error(error);
      alert(error.message || "Could not update application.");
    }
  };

  init();
})();
</script>

</body>
</html>
