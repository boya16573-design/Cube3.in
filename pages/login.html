<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in - Cube3</title>
<link rel="preconnect" href="https://zjgtceurzsvjkspkvroz.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="site-header">
  <nav class="wrap">
    <a class="brand" href="/index.html">
      <svg class="mark" viewBox="0 0 24 24" fill="none"><path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" fill="#3730a3"/></svg>
      Cube3
    </a>
    <div class="nav-links"><a href="/index.html">Home</a></div>
  </nav>
</header>

<div class="auth-page">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <div class="subtitle">Log in to your Cube3 account.</div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Your password" required>

      <div style="text-align:right; margin-top:8px;">
        <a href="forgot-password.html" style="font-size:13px; color:var(--indigo); font-weight:600;">Forgot password?</a>
      </div>

      <button id="loginButton" class="btn btn-primary btn-block" type="submit" style="margin-top:18px;">Log in</button>
    </form>

    <div id="message" class="message"></div>
    <div class="auth-link">Don't have an account? <a href="signup.html">Sign up</a></div>
  </div>
</div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="/supabase-client.js"></script>
<script src="/auth.js"></script>

<script>
  const form = document.getElementById("loginForm");
  const button = document.getElementById("loginButton");
  const message = document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Logging in...";

    try {
      const result = await Cube3Auth.signIn(email, password);
      showMessage(result?.message || "Logged in successfully!", "success");
      setTimeout(() => { window.location.href = "dashboard.html"; }, 700);

    } catch (error) {
      console.error(error);
      showMessage(error.message || "Could not log in. Check your email and password.", "error");
      button.disabled = false;
      button.textContent = "Log in";
    }
  });
</script>

</body>
</html>
