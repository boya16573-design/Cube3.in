!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - Cube3</title>

  <link rel="stylesheet" href="/style.css">

  <style>
    body {
      margin: 0;
      background: #08080d;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      background: #11121a;
      border: 1px solid #292b38;
      border-radius: 20px;
      padding: 32px;
      box-sizing: border-box;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 30px;
    }

    .logo span {
      color: #9b7cff;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 32px;
    }

    .subtitle {
      color: #999baa;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #d7d8df;
      font-size: 14px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 15px;
      border-radius: 10px;
      border: 1px solid #303241;
      background: #0b0c12;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #9878ff;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #9274ff;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #a48aff;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      display: none;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #12351f;
      color: #7ff0a0;
    }

    .error {
      display: block;
      background: #39171b;
      color: #ff9ca5;
    }

    .signup-link {
      text-align: center;
      margin-top: 22px;
      color: #999baa;
    }

    a {
      color: #a78bfa;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="auth-page">
  <div class="auth-card">

    <div class="logo">Cube<span>3</span></div>

    <h1>Log in</h1>
    <div class="subtitle">
      Welcome back. Log in to your Cube3 account.
    </div>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        placeholder="Your password"
        required
      >

      <button id="loginButton" type="submit">
        Log in
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="signup-link">
      Don't have an account?
      <a href="signup.html">Sign up</a>
    </div>

  </div>
</div>

<script src="/config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/supabase-client.js"></script>
<script src="/auth.js"></script>

<script>
  const form = document.getElementById("loginForm");
  const button = document.getElementById("loginButton");
  const message = document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Logging in...";

    try {

      // NOTE: assumes auth.js exposes Cube3Auth.signIn(email, password),
      // matching the Cube3Auth.signUp(...) pattern used in signup.html.
      // If auth.js uses a different method name, update this call.
      const result = await Cube3Auth.signIn(email, password);

      showMessage(result?.message || "Logged in successfully!", "success");

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 800);

    } catch (error) {

      console.error(error);

      showMessage(
        error.message || "Could not log in. Check your email and password.",
        "error"
      );

      button.disabled = false;
      button.textContent = "Log in";
    }
  });
</script>

</body>
</html>
